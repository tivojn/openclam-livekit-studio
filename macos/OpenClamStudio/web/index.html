    const ensureAudioGraph = () => {
      audioContext = audioContext || new AudioContext();
      if (!audioAnalyser) {
        audioAnalyser = audioContext.createAnalyser();
        audioAnalyser.fftSize = 1024;
        audioAnalyser.smoothingTimeConstant = .38;
        // Keep the metering graph renderable without letting its second branch
        // reach the speakers. Speech and LiveKit each retain exactly one audible
        // output path below.
        audioMonitorGain = audioContext.createGain();
        audioMonitorGain.gain.value = 0;
        audioAnalyser.connect(audioMonitorGain);
        audioMonitorGain.connect(audioContext.destination);
      }
      if (audioContext.state !== 'running') audioContext.resume().catch(() => {});
      return audioContext;
    };

    const stopSpeech = () => {
      if (speechSource) { try { speechSource.stop(); } catch (_) { /* already ended */ } }

      reactiveMouthState.viseme = 'sil';
      reactiveMouthState.audibleUntil = 0;

    const playSpeech = async (base64, track = []) => {
      if (!base64) return;
      stopSpeech();
      const graph = ensureAudioGraph();
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      const buffer = await graph.decodeAudioData(bytes.buffer.slice(0));
      const source = graph.createBufferSource();
      source.buffer = buffer;
      source.connect(audioAnalyser);
      source.connect(graph.destination);
      speechSource = source;
      resumeChatSpeakingPose();
      speechTrack = stabiliseTrack(
        track,
        buffer.duration,
        manifest && Array.isArray(manifest.visemes) ? manifest.visemes : [],
      );
      speechTrackIndex = 0;
      speechStart = graph.currentTime;
      source.onended = () => {
        if (speechSource === source) {
          speechSource = null;
          speechTrack = [];
          currentViseme = 'sil';
          resumeChatSpeakingPose();
          setStatus(live ? 'Live Talk · connected' : 'Ready', live ? 'live' : 'good');

      };
      source.start();
      setStatus('Speaking', 'good');

    const renderSafeMarkdown = text => {
      const root = document.createElement('div');
      root.className = 'openclaw-markdown-preview';
      let code = null;
      let list = null;
      for (const raw of String(text || '').split(/\r?\n/).slice(0, 2000)) {
        const line = raw.slice(0, 4000);
        if (/^```/.test(line)) {
          if (code) code = null;
          else {
            code = document.createElement('pre');
            root.appendChild(code);
          }
          list = null;
          continue;
        }
        if (code) {
          code.textContent += `${line}\n`;
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const node = document.createElement(`h${heading[1].length}`);
          node.textContent = heading[2];
          root.appendChild(node);
          list = null;
          continue;
        }
        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (bullet) {
          if (!list) {
            list = document.createElement('ul');
            root.appendChild(list);
          }
          const item = document.createElement('li');
          item.textContent = bullet[1];
          list.appendChild(item);
          continue;
        }
        list = null;
        const paragraph = document.createElement('p');
        paragraph.textContent = line || ' ';
        root.appendChild(paragraph);

      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) return;
      const received = await response.blob();
      const nameText = String(attachment.name || 'OpenClaw file').slice(0, 160);
      const mediaType = safeFileType(attachment) !== 'application/octet-stream'
        ? safeFileType(attachment) : (received.type || 'application/octet-stream');
      const file = new File([received], nameText, { type: mediaType });
      const objectURL = URL.createObjectURL(file);
      const resource = { file, url: objectURL };
      const card = document.createElement('div');
      card.className = `openclaw-file-card${options.role === 'user' ? ' user-file' : ''}`;
      const previewButton = document.createElement('button');
      previewButton.className = 'openclaw-file-preview';
      previewButton.type = 'button';
      previewButton.ariaLabel = `Open ${nameText}`;
      let preview;
      if (mediaType.startsWith('image/')) {
        preview = document.createElement('img');
        preview.src = objectURL;

        preview = document.createElement('video');
