        preview = document.createElement('span');
        preview.className = 'file-kind';
        preview.textContent = mediaType.startsWith('audio/') ? 'AUDIO'
          : mediaType === 'application/pdf' ? 'PDF'
          : /markdown/.test(mediaType) || /\.md$/i.test(nameText) ? 'MD' : 'FILE';
      }
      previewButton.appendChild(preview);
      previewButton.addEventListener('click', () => showFilePreview(resource));
      const copy = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'openclaw-file-name';
      name.textContent = nameText;
      const meta = document.createElement('div');
      meta.className = 'openclaw-file-meta';
      const bytes = Number(attachment.byte_count) || file.size;
      meta.textContent = `${mediaType} · ${Math.max(1, Math.round(bytes / 1024))} KB`;
      copy.append(name, meta);
      const actions = document.createElement('div');
      actions.className = 'openclaw-file-actions';
      const open = document.createElement('button');
      open.type = 'button';
      open.textContent = 'Open';
      open.addEventListener('click', () => showFilePreview(resource));
      const share = document.createElement('button');
      share.type = 'button';
      share.textContent = 'Share';
      share.addEventListener('click', () => shareResource(resource));
      const save = document.createElement('a');
      save.href = objectURL;
      save.download = nameText;
      save.textContent = 'Save';
      actions.append(open, share, save);
      card.append(previewButton, copy, actions);
      if (mediaType.startsWith('audio/')) {
        const audio = document.createElement('audio');
        audio.src = objectURL;
        audio.controls = true;
        card.appendChild(audio);
      } else if ((mediaType.startsWith('text/') || /\.(?:md|markdown|txt)$/i.test(nameText))
          && file.size <= 500000) {
        card.appendChild(renderSafeMarkdown(await file.text()));
      }
      conversation.appendChild(card);
      conversation.scrollTop = conversation.scrollHeight;
      if (options.persist !== false) recordThreadItem({
        kind: 'attachment', attachment: {
          url,
          name: nameText,
          media_type: mediaType,
          byte_count: bytes,
        }, role: options.role === 'user' ? 'user' : 'assistant',
      });
    };

    const restoreChatThread = async thread => {
      if (!thread) return;
      restoringThread = true;
      removeWorking();
      conversation.replaceChildren();
      history = [];
      latestAssistantText = '';
      openClawSessionID = thread.openClawSessionID || '';
      const savedMode = [...agentModeSelect.options].some(option => option.value === thread.agentMode)
        ? thread.agentMode : 'local';
      if (agentModeSelect.value !== savedMode) {
        agentModeSelect.value = savedMode;
        agentModeSelect.dispatchEvent(new Event('change'));
      }
      try {
        for (const record of thread.records) {
          if (record.kind === 'message') {
            addMessage(record.role, record.text,
              { readable: record.readable !== false, persist: false, route: record.route });
            history.push({ role: record.role, content: record.text });
          } else if (record.kind === 'work') {
            const timeline = createWorkTimeline();
            timeline.startedAt = performance.now() - record.elapsedSeconds * 1000;
            for (const step of record.steps) updateWorkTimeline(timeline, step);
            finishWorkTimeline(timeline, record.state);
          } else if (record.kind === 'attachment') {
            await appendOpenClawAttachment(record.attachment, {
              persist: false,
              role: record.role === 'user' ? 'user' : 'assistant',
            });
          } else if (record.kind === 'media') {
            await appendMedia([record.card], { persist: false });
          }
        }
      } finally {
        restoringThread = false;
      }
      if (history.length > 24) history = history.slice(-24);
      chatThreadHeading.textContent = thread.title || 'New chat';
      conversation.scrollTop = conversation.scrollHeight;
    };

    switchChatThread = async id => {
      if (turnController || live) {
        notify('Finish or stop the active conversation before switching chats.');
        return;
      }
      const thread = chatThreads.find(candidate => candidate.id === id);
      if (!thread) return;
      activeThreadID = thread.id;
      localStorage.setItem(ACTIVE_CHAT_KEY, activeThreadID);
      renderChatHistory();
      setHistoryOpen(false);
      await restoreChatThread(thread);
    };

    const createNewChat = async () => {
      if (turnController || live) {
        notify('Finish or stop the active conversation before starting a new chat.');
        return;
      }
      const thread = freshThread();
      chatThreads.unshift(thread);
      activeThreadID = thread.id;
      saveChatThreads();
      setHistoryOpen(false);
      await restoreChatThread(thread);
      composer.focus();
    };

    const deleteChatThread = async id => {
      if (turnController || live) {
        notify('Finish or stop the active conversation before deleting a chat.');
        return;
      }
      const deletingActive = id === activeThreadID;
      chatThreads = chatThreads.filter(thread => thread.id !== id);
      if (!chatThreads.length) chatThreads = [freshThread()];
      if (deletingActive) activeThreadID = chatThreads[0].id;
      saveChatThreads();
      if (deletingActive) await restoreChatThread(activeChatThread());
    };

    const renderPendingAttachments = () => {
      pendingAttachmentsNode.replaceChildren();
      for (const attachment of pendingComposerAttachments) {
        const chip = document.createElement('div');
        chip.className = 'pending-attachment';
        const label = document.createElement('span');
        label.textContent = attachment.name;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '×';
        remove.ariaLabel = `Remove ${attachment.name}`;
        remove.addEventListener('click', () => {
          pendingComposerAttachments = pendingComposerAttachments.filter(
            candidate => candidate.handle !== attachment.handle);
          renderPendingAttachments();
          resizeComposer();
        });
        chip.append(label, remove);
        pendingAttachmentsNode.appendChild(chip);
      }
      attachButton.disabled = Boolean(turnController) || Boolean(live)
        || !selectedOpenClawAgent() || pendingComposerAttachments.length >= 8;
    };

    const setAttachmentMenuOpen = value => {
      const next = Boolean(value) && !attachButton.disabled;
      attachmentMenu.hidden = !next;
      attachButton.setAttribute('aria-expanded', String(next));
    };

    const uploadComposerFiles = async files => {
      const agentID = selectedOpenClawAgent();
      if (!agentID) {
        notify('Choose an OpenClaw agent before adding a file.');
        return;
      }
      const candidates = [...(files || [])].slice(0, 8 - pendingComposerAttachments.length);
      if (!candidates.length) return;
      if (candidates.some(file => file.size <= 0 || file.size > 32 * 1024 * 1024)
          || candidates.reduce((sum, file) => sum + file.size, 0) > 64 * 1024 * 1024) {
        notify('Attach up to 8 files, 32 MB each and 64 MB total.');
        return;
      }
      attachButton.disabled = true;
      setStatus('Adding files…', 'busy');
      const form = new FormData();
      form.set('agent_id', agentID);
      form.set('session_id', ensureOpenClawSessionID());
      for (const file of candidates) form.append('files', file, file.name);
      try {
        const response = await fetch('/api/openclaw/uploads', {
          method: 'POST', body: form, cache: 'no-store',
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !Array.isArray(result.attachments)) {
          throw new Error(result.detail || `Upload failed (${response.status})`);
        }
        pendingComposerAttachments.push(...result.attachments);
        pendingComposerAttachments = pendingComposerAttachments.slice(0, 8);
        setStatus('Ready', 'good');
      } catch (error) {
        notify(String(error.message || error).slice(0, 180));
        setStatus('Could not add file', '');
      } finally {
        renderPendingAttachments();
        resizeComposer();
      }
    };

    const stopCamera = () => {
      if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      cameraPreview.srcObject = null;
      if (cameraDialog.open) cameraDialog.close();
    };

    const startCamera = async () => {
      setAttachmentMenuOpen(false);
      if (!selectedOpenClawAgent()) {
        notify('Choose an OpenClaw agent before taking a photo.');
        return;
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
        });
        cameraPreview.srcObject = cameraStream;
        cameraDialog.showModal();
      } catch (_) {
        stopCamera();
        notify('Camera access was not available. Choose a photo instead.');
      }
    };

    const captureCameraPhoto = async () => {
      if (!cameraStream || !cameraPreview.videoWidth || !cameraPreview.videoHeight) return;
      const canvas = document.createElement('canvas');
      canvas.width = cameraPreview.videoWidth;
      canvas.height = cameraPreview.videoHeight;
      canvas.getContext('2d').drawImage(cameraPreview, 0, 0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .92));
      stopCamera();
      if (!blob) {
        notify('The camera did not return a photo.');
        return;
      }
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      await uploadComposerFiles([new File([blob], `OpenClam-photo-${timestamp}.jpg`, {
        type: 'image/jpeg',
      })]);
    };

    async function submitOpenClawTurn(value, agentID, options = {}) {
      stopSpeech();
      if (!options.keepAvatarMode) await openChat(false);
      resumeChatSpeakingPose();
      addMessage('user', value, { readable: false });
      const inputAttachments = Array.isArray(options.attachments)
        ? options.attachments.slice(0, 8) : [];
      for (const attachment of inputAttachments) {
        await appendOpenClawAttachment(attachment, { role: 'user' });
      }
      const work = createWorkTimeline();
      turnController = new AbortController();
      sendButton.disabled = true;
      pttButton.disabled = true;
      agentModeSelect.disabled = true;
      setStatus('Connecting to OpenClaw…', 'busy');
      let finalText = '';
      let liveReply = null;
      try {
        const response = await fetch('/api/openclaw/turn', {
          method: 'POST',
          headers: { 'Accept': 'application/x-ndjson', 'Content-Type': 'application/json', 'Cache-Control': 'no-store' },
          body: JSON.stringify({
            agent_id: agentID,
            session_id: ensureOpenClawSessionID(),
            prompt: value,
            input_handles: inputAttachments.map(attachment => attachment.handle),
          }),
          signal: turnController.signal,
        });
        if (!response.ok || !response.body) throw new Error(`OpenClaw request failed (${response.status})`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffered = '';
        for (;;) {
          const chunk = await reader.read();
          buffered += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
          const lines = buffered.split('\n');
          buffered = chunk.done ? '' : lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === 'accepted') {
              setStatus(`${String(event.agent || 'OpenClaw').slice(0, 80)} is working…`, 'busy');
            } else if (event.type === 'work') {
              updateWorkTimeline(work, event.step);
              setStatus(String(event.step && event.step.title || 'OpenClaw is working').slice(0, 120), 'busy');
            } else if (event.type === 'text') {
              resumeChatSpeakingPose();
              finalText = String(event.text || '').slice(0, 64000);
              if (!liveReply) {
                liveReply = addMessage('assistant', '', { readable: false, persist: false });
                liveReply.row.classList.add('streaming');
              }
              liveReply.bubble.textContent = finalText;
              latestAssistantText = finalText;
              conversation.scrollTop = conversation.scrollHeight;
            } else if (event.type === 'attachment') {
              await appendOpenClawAttachment(event.attachment);
            } else if (event.type === 'complete') {
              finalText = String(event.text || finalText).slice(0, 64000);
            } else if (event.type === 'error') {
              throw new Error(String(event.message || 'OpenClaw could not complete this turn').slice(0, 180));
            }
          }
          if (chunk.done) break;
        }
        const completedText = finalText || 'OpenClaw completed without a text reply.';
        resumeChatSpeakingPose();
        if (liveReply) {
          liveReply.bubble.textContent = completedText;
          latestAssistantText = completedText;
          liveReply.row.classList.remove('streaming');
          appendAssistantActions(liveReply.row, completedText);
          recordThreadItem({ kind: 'message', role: 'assistant', text: completedText, readable: true });
        } else {
          addMessage('assistant', completedText);
        }
        finishWorkTimeline(work, 'completed');
        setStatus('Ready', 'good');
      } catch (error) {
        finishWorkTimeline(work, 'failed');
        if (error.name !== 'AbortError') {
          resumeChatSpeakingPose();
          addMessage('assistant', `OpenClaw is unavailable: ${String(error.message || error).slice(0, 150)}`, { readable: false });
          setStatus('Check OpenClaw', '');
          if (!pendingComposerAttachments.length && inputAttachments.length) {
            pendingComposerAttachments = inputAttachments;
            renderPendingAttachments();
          }
        }
      } finally {
        turnController = null;
        agentModeSelect.disabled = false;
        pttButton.disabled = Boolean(live);
        sendButton.disabled = !composer.value.trim() && !pendingComposerAttachments.length;
      }
    }

    async function submitLocalTurn(text, options = {}) {
      const value = String(text || '').trim();
      if (!value || turnController || avatarOnlyMotion) return;
      if (live) {
        notify('Hang up Live Talk before sending a regular chat message.');
        return;
      }
      stopSpeech();
      if (!options.keepAvatarMode) await openChat(false);
      resumeChatSpeakingPose();
      addMessage('user', value, { readable: false });
      history.push({ role: 'user', content: value });
      addWorking();
      turnController = new AbortController();
      sendButton.disabled = true;
      pttButton.disabled = true;
      setStatus('Thinking…', 'busy');
      let liveReply = null;
      try {
        const response = await fetch('/reply/stream', {
          method: 'POST',
          headers: { 'Accept': 'application/x-ndjson', 'Content-Type': 'application/json', 'Cache-Control': 'no-store' },
          body: JSON.stringify({ history }),
          signal: turnController.signal,
        });
        if (!response.ok || !response.body) throw new Error(`Model request failed (${response.status})`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffered = '';
        let result = null;
        for (;;) {
          const chunk = await reader.read();
          buffered += decoder.decode(chunk.value || new Uint8Array(), { stream: !chunk.done });
          const lines = buffered.split('\n');
          buffered = chunk.done ? '' : lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === 'text') {
              const partial = String(event.text || '').slice(0, 64000);
              if (!partial) continue;
              removeWorking();
              resumeChatSpeakingPose();
              if (!liveReply) {
                liveReply = addMessage('assistant', '', { readable: false, persist: false });
                liveReply.row.classList.add('streaming');
              }
              liveReply.bubble.textContent = partial;
              latestAssistantText = partial;
              setStatus('Answering…', 'busy');
              conversation.scrollTop = conversation.scrollHeight;
            } else if (event.type === 'complete') {
              result = event;
            } else if (event.type === 'error') {
              throw new Error(String(event.message || 'The model stream failed').slice(0, 180));
            }
          }
          if (chunk.done) break;
        }
        if (!result) throw new Error('The model stream ended before completion');
        removeWorking();
        const answer = String(result.text || 'I lost that thought. Please try again.');
        resumeChatSpeakingPose();
        if (liveReply) {
          liveReply.bubble.textContent = answer;
          latestAssistantText = answer;
          liveReply.row.classList.remove('streaming');
          appendAssistantActions(liveReply.row, answer, result.llm_route);
          recordThreadItem({ kind: 'message', role: 'assistant', text: answer,
            readable: true, route: result.llm_route });
        } else {
          addMessage('assistant', answer, { route: result.llm_route });
        }
        history.push({ role: 'assistant', content: answer });
        if (history.length > 24) history.splice(0, history.length - 24);
        await appendMedia(result.media);
        if (result.audio) await playSpeech(result.audio, result.track || []);
        else setStatus('Ready', 'good');
      } catch (error) {
        removeWorking();
        if (liveReply) liveReply.row.remove();
        if (error.name !== 'AbortError') {
          resumeChatSpeakingPose();
          const message = `I could not answer: ${String(error.message || error).slice(0, 150)}`;
          addMessage('assistant', message, { readable: false });
          setStatus('Check model settings', '');
        }
      } finally {
        turnController = null;
        pttButton.disabled = Boolean(live);
        sendButton.disabled = !composer.value.trim() && !pendingComposerAttachments.length;
      }
    }

    async function submitTurn(text, options = {}) {
      const value = String(text || '').trim();
      if (!value || turnController || avatarOnlyMotion) return;
      const agentID = selectedOpenClawAgent();
      if (agentID) return submitOpenClawTurn(value, agentID, options);
      if (options.attachments && options.attachments.length) {
        notify('File messages require an OpenClaw agent.');
        return;
      }
      return submitLocalTurn(value, options);
    }

    const submitComposer = () => {
      if (avatarOnlyMotion) return;
      const typedValue = composer.value.trim();
      const attachments = pendingComposerAttachments.slice(0, 8);
      if (!typedValue && !attachments.length) return;
      if (live) {
        notify('Hang up Live Talk before sending a regular chat message.');
        return;
      }
      resumeChatSpeakingPose();
      const value = typedValue || `Please review the attached file${attachments.length === 1 ? '' : 's'}.`;
      composer.value = '';
      pendingComposerAttachments = [];
      renderPendingAttachments();
      resizeComposer();
      submitTurn(value, { attachments });
    };

    const resizeComposer = () => {
      composer.style.height = '40px';
      composer.style.height = `${Math.min(112, Math.max(40, composer.scrollHeight))}px`;
      sendButton.disabled = (!composer.value.trim() && !pendingComposerAttachments.length)
        || Boolean(turnController) || Boolean(live);
      attachButton.disabled = Boolean(turnController) || Boolean(live)
        || !selectedOpenClawAgent() || pendingComposerAttachments.length >= 8;
      reportControlRects(true);
    };

    const recordingMime = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(type => MediaRecorder.isTypeSupported(type)) || '';

    const setDictationFeedback = (text = '', state = 'idle', duration = 0) => {
      clearTimeout(dictationStatusTimer);
      const message = String(text || '').slice(0, 180);
      recordingLabel.textContent = message;
      recordingChip.dataset.state = state;
      recordingChip.dataset.visible = message ? 'true' : 'false';
      const listening = state === 'listening';
      recordingLevel.hidden = !listening;
      recordingClock.hidden = !listening;
      if (message && duration > 0) {
        dictationStatusTimer = setTimeout(() => {
          recordingChip.dataset.visible = 'false';
          recordingChip.dataset.state = 'idle';
          reportControlRects(true);
        }, duration);
      }
      reportControlRects(true);
    };

    async function startRecording() {
      if (avatarOnlyMotion || ptt || live || turnController) return;
      stopSpeech();
      markActivity();
      const session = {
        released: false,
        chunks: [],
        started: performance.now(),
        stream: null,
        recorder: null,
        meterContext: null,
        analyser: null,
        // A head-hold in Avatar mode is a voice gesture on the companion,
        // not an implicit navigation command into the Chat/Talk window.
        keepAvatarMode: !root.classList.contains('chat-mode'),
      };
      ptt = session;
      root.classList.add('recording');
      pttButton.classList.add('recording');
      pttButton.setAttribute('aria-label', 'Release to transcribe');
      setDictationFeedback('Listening…', 'listening');
      setStatus('Listening…', 'live');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        if (ptt !== session || session.released) { stream.getTracks().forEach(track => track.stop()); finishRecordingUI(); return; }
        session.stream = stream;
        session.meterContext = new AudioContext();
        session.analyser = session.meterContext.createAnalyser();
        session.analyser.fftSize = 512;
        session.meterContext.createMediaStreamSource(stream).connect(session.analyser);
        const type = recordingMime();
        session.recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
        session.recorder.ondataavailable = event => { if (event.data && event.data.size) session.chunks.push(event.data); };
        session.recorder.onstop = () => transcribeRecording(session);
        session.recorder.start(180);
      } catch (error) {
        if (ptt === session) ptt = null;
        finishRecordingUI();
        setDictationFeedback(`Microphone unavailable: ${String(error.message || error).slice(0, 110)}`, 'error', 5200);
        setStatus('Ready', 'good');
      }
    }

    function stopRecording(cancel = false) {
      const session = ptt;
      if (!session) return;
      session.released = true;
      session.cancelled = cancel;
      if (session.recorder && session.recorder.state !== 'inactive') session.recorder.stop();
      else if (!session.stream) {
        ptt = null;
        finishRecordingUI();
      }
    }

    const finishRecordingUI = (preserveFeedback = false) => {
      root.classList.remove('recording');
      pttButton.classList.remove('recording');
      pttButton.setAttribute('aria-label', 'Hold to talk');
      recordingClock.textContent = '0:00.0';
      recordingBars.forEach(bar => { bar.style.height = '3px'; });
      if (!preserveFeedback) setDictationFeedback();
      reportControlRects(true);
    };

    async function transcribeRecording(session) {
      if (ptt === session) ptt = null;
      finishRecordingUI(true);
      if (session.stream) session.stream.getTracks().forEach(track => track.stop());
      if (session.meterContext) session.meterContext.close().catch(() => {});
      if (session.cancelled || performance.now() - session.started < 220 || !session.chunks.length) {
        setDictationFeedback();
        setStatus('Ready', 'good');
        return;
      }
      setDictationFeedback('Transcribing…', 'busy');
      setStatus('Transcribing…', 'busy');
      try {
        const blob = new Blob(session.chunks, { type: session.recorder && session.recorder.mimeType || 'audio/webm' });
        const form = new FormData();
        form.append('audio', blob, blob.type.includes('mp4') ? 'take.m4a' : 'take.webm');
        const result = await fetch('/stt', { method: 'POST', body: form }).then(safeJSON);
        const heard = String(result.text || '').trim();
        if (!heard) throw new Error(result.error || 'I did not catch that');
        setDictationFeedback();
        await submitTurn(heard, { keepAvatarMode: Boolean(session.keepAvatarMode) });
      } catch (error) {
        setDictationFeedback(`Could not transcribe: ${String(error.message || error).slice(0, 120)}`, 'error', 5200);
        setStatus('Ready', 'good');
      }
    }

    const updateRecordingMeter = now => {
      if (!ptt) return;
      const elapsed = Math.max(0, (now - ptt.started) / 1000);
      recordingClock.textContent = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toFixed(1).padStart(4, '0')}`;
      let level = 0;
      if (ptt.analyser) {
        const samples = new Uint8Array(ptt.analyser.fftSize);
        ptt.analyser.getByteTimeDomainData(samples);
        let sum = 0;
        for (const sample of samples) { const value = (sample - 128) / 128; sum += value * value; }
        level = Math.min(1, Math.sqrt(sum / samples.length) * 7);
      }
      recordingBars.forEach((bar, index) => {
        const shape = .38 + .62 * Math.sin(Math.PI * (index + .5) / recordingBars.length);
        bar.style.height = `${Math.round(3 + level * 13 * shape)}px`;
      });
    };

    const EMAIL_RPC = 'openclam.prepareEmailDraft.v1';
    const MAX_RPC_BYTES = 12000;
    const utf8Size = value => new TextEncoder().encode(String(value || '')).length;
    const canonicalWords = value => String(value || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
    const containsWord = (value, term) => (` ${value} `).includes(` ${term} `);
    const looksQuoted = value => {
      const text = String(value || '').trim();
      if (!text) return false;
      const edgeQuotes = new Set(['"', "'", '`', '>', '«', '»', '‘', '’', '“', '”']);
      if (edgeQuotes.has(text[0]) || edgeQuotes.has(text[text.length - 1])) return true;
      return (text.match(/"/g) || []).length >= 2 || (text.match(/`/g) || []).length >= 2;
    };

    const explicitEmailRequest = (value, recipientName) => {
      let request = canonicalWords(value);
      const recipient = canonicalWords(recipientName);
      if (!request || !recipient || looksQuoted(value)) return false;
      const followups = new Set(['approve', 'approve it', 'confirm', 'confirm it', 'do it', 'go ahead', 'ok send it', 'okay send it', 'send', 'send it', 'yes', 'yes send it']);
      if (followups.has(request)) return false;
      const blocked = [
        'can t', 'cannot', 'do not', 'don t', 'dont', 'must not', 'mustn t',
        'never', 'should not', 'shouldn t', 'won t', 'asked', 'avoid', 'cancel',
        'check', 'drafted', 'emailed', 'find', 'forwarded', 'mentioned', 'no',
        'not', 'open', 'pasted', 'prepared', 'quoted', 'read', 'received',
        'reported', 'said', 'says', 'search', 'sent', 'show', 'stop',
        'summarise', 'summarize', 'told', 'wrote',
      ];
      if (blocked.some(term => containsWord(request, term))) return false;
      for (const prefix of ['please would you', 'please could you', 'please can you', 'would you', 'could you', 'i want to', 'i need to', 'i d like to', 'will you', 'help me', 'please', 'let s', 'can you', 'lets']) {
        if (request.startsWith(`${prefix} `)) { request = request.slice(prefix.length + 1); break; }
      }
      const candidates = [`email ${recipient}`, `email to ${recipient}`];
      for (const action of ['compose', 'create', 'draft', 'prepare', 'send', 'write']) {
        candidates.push(`${action} an email to ${recipient}`, `${action} a email to ${recipient}`, `${action} email to ${recipient}`, `${action} an email for ${recipient}`, `${action} a email for ${recipient}`, `${action} email for ${recipient}`, `${action} ${recipient} an email`, `${action} ${recipient} a email`, `${action} ${recipient} email`);
      }
      return candidates.some(candidate => request === candidate || request.startsWith(`${candidate} `));
    };

    const exactObject = (value, keys) => value && typeof value === 'object' && !Array.isArray(value)
      && Object.keys(value).sort().join('|') === keys.slice().sort().join('|');

    const parseEmailRequest = payload => {
      if (typeof payload !== 'string' || utf8Size(payload) > MAX_RPC_BYTES) return null;
      let rootValue;
      try { rootValue = JSON.parse(payload); } catch (_) { return null; }
      if (!exactObject(rootValue, ['schema_version', 'request_id', 'spoken_request', 'tool'])
          || !exactObject(rootValue.tool, ['name', 'arguments'])
          || !exactObject(rootValue.tool.arguments, ['recipient_name', 'subject', 'body'])) return null;
      const values = rootValue.tool.arguments;
      if (rootValue.schema_version !== 1 || rootValue.tool.name !== 'prepare_email_draft'
          || !/^[0-9a-f]{64}$/.test(rootValue.request_id)
          || ![rootValue.spoken_request, values.recipient_name, values.subject, values.body].every(item => typeof item === 'string')
          || !rootValue.spoken_request.trim() || utf8Size(rootValue.spoken_request) > 8000
          || !values.recipient_name.trim() || [...values.recipient_name].length > 320
          || [...values.subject].length > 240 || utf8Size(values.body) > 6000
          || !explicitEmailRequest(rootValue.spoken_request, values.recipient_name)) return null;
      return { request_id: rootValue.request_id, spoken_request: rootValue.spoken_request, recipient_name: values.recipient_name, subject: values.subject, body: values.body };
    };

    const emailDraftText = (recipient, subject, body) => [
      'Unsent email draft',
      `To: ${String(recipient || '')}`,
      `Subject: ${String(subject || '')}`,
      '',
      String(body || ''),
    ].join('\n');

    const retainEmailDraft = (historyEntries, recipient, subject, body, limit = 24) => {
      const content = emailDraftText(recipient, subject, body);
      historyEntries.push({ role: 'assistant', content });
      if (historyEntries.length > limit) historyEntries.splice(0, historyEntries.length - limit);
      return content;
    };

    const closeEmailReview = () => {
      const state = emailReviewState;
      const panel = state && state.panel ? state.panel : document.querySelector('.email-review');
      if (panel) panel.remove();
      if (state) {
        for (const entry of state.background) {
          if (!entry.element.isConnected) continue;
          entry.element.inert = entry.inert || (avatarOnlyMotion && motionChrome.includes(entry.element));
        }
      }
      emailReviewState = null;
      if (live) live.pendingDraft = null;
      reportControlRects(true);
      const previousFocus = state && state.previousFocus;
      if (!avatarOnlyMotion && previousFocus && previousFocus.isConnected && !previousFocus.inert) {
        requestAnimationFrame(() => previousFocus.focus({ preventScroll: true }));
      }
    };

    const presentEmailReview = request => {
      if (document.querySelector('.email-review')) return 'busy';
      openChat(false);
      const panel = document.createElement('section');
      panel.className = 'email-review';
      panel.setAttribute('role', 'dialog');
      panel.setAttribute('aria-modal', 'true');
      panel.setAttribute('aria-labelledby', 'emailReviewTitle');
      panel.inert = avatarOnlyMotion;
      const title = document.createElement('h2');
      title.id = 'emailReviewTitle';
      title.textContent = 'Review email draft';
      const warning = document.createElement('div');
      warning.className = 'unsent';
      warning.textContent = 'Unsent · this draft stays on screen until you copy it or keep it in the conversation.';
      panel.append(title, warning);
      const makeField = (labelText, value, multiline) => {
        const label = document.createElement('label');
        label.append(document.createTextNode(labelText));
        const input = document.createElement(multiline ? 'textarea' : 'input');
        input.value = value;
        input.dir = 'auto';
        input.autocomplete = 'off';
        input.maxLength = multiline ? 6000 : labelText === 'Recipient' ? 320 : 240;
        label.append(input);
        panel.append(label);
        return input;
      };
      const recipient = makeField('Recipient', request.recipient_name, false);
      const subject = makeField('Subject', request.subject, false);
      const body = makeField('Message', request.body, true);
      const actions = document.createElement('div');
      actions.className = 'email-actions';
      const keep = document.createElement('button');
      keep.type = 'button';
      keep.textContent = 'Keep in chat';
      keep.addEventListener('click', () => {
        const retained = retainEmailDraft(history, recipient.value, subject.value, body.value);
        closeEmailReview();
        addMessage('assistant', retained);
        openChat(false);
        notify('Unsent draft kept in this conversation.');
      });
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.textContent = 'Copy draft';
      copy.addEventListener('click', async () => {
        const text = [`To: ${recipient.value}`, `Subject: ${subject.value}`, '', body.value].join('\n');
        try {
          await navigator.clipboard.writeText(text);
          copy.textContent = 'Copied';
        } catch (_) { copy.textContent = 'Copy failed'; }
        setTimeout(() => { if (copy.isConnected) copy.textContent = 'Copy draft'; }, 1500);
      });
      actions.append(keep, copy);
      panel.append(actions);
      document.body.append(panel);
      const previousFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      const background = [...document.body.children]
        .filter(element => element !== panel && element instanceof HTMLElement)
        .map(element => ({ element, inert: element.inert }));
      for (const entry of background) entry.element.inert = true;
      emailReviewState = { panel, background, previousFocus };
      panel.addEventListener('keydown', event => {
        if (event.code === 'Space') event.stopPropagation();
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          closeEmailReview();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = [...panel.querySelectorAll('input, textarea, button:not([disabled])')]
          .filter(element => !element.inert && element.getClientRects().length);
        if (!focusable.length) { event.preventDefault(); return; }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      panel.addEventListener('keyup', event => {
        if (event.code === 'Space') event.stopPropagation();
      });
      if (live) live.pendingDraft = panel;
      reportControlRects(true);
      if (!avatarOnlyMotion) recipient.focus();
      return 'presented_for_review';
    };

    const trustedAgents = room => [...room.remoteParticipants.values()].filter(participant => participant.isAgent);

    const trustedEmailInvocation = (session, invocation, timeout) => {
      const agents = trustedAgents(session.room);
      return live === session && session.agentReady && document.visibilityState === 'visible'
        && agents.length === 1 && agents[0].identity === invocation.callerIdentity
        && Number.isFinite(timeout) && timeout >= 1000 && timeout <= 20000;
    };

    const waitForMatchingFinalUserTurn = async (session, spokenRequest, timeout) => {
      const expected = canonicalWords(spokenRequest);
      if (!expected) return false;
      const deadline = performance.now() + Math.min(5000, Math.max(0, timeout - 1500));
      do {
        if (live !== session) return false;
        if (canonicalWords(session.latestFinalUserTranscript) === expected) return true;
        await new Promise(resolve => setTimeout(resolve, 25));
      } while (performance.now() < deadline);
      return canonicalWords(session.latestFinalUserTranscript) === expected;
    };

    const appendFinalUserTurnSegment = (session, text) => {
      if (!session.userTurnOpen) {
        session.finalUserTurnSegments = [];
        session.userTurnOpen = true;
      }
      session.finalUserTurnSegments.push(text);
      session.latestFinalUserTranscript = session.finalUserTurnSegments.join(' ');
      return session.latestFinalUserTranscript;
    };

    const handleEmailRPC = async (session, invocation) => {
      const answer = status => JSON.stringify({ schema_version: 1, status });
      const timeout = Number(invocation.responseTimeout);
      if (!trustedEmailInvocation(session, invocation, timeout)) return answer('rejected');
      const request = parseEmailRequest(invocation.payload);
      if (!request || !await waitForMatchingFinalUserTurn(session, request.spoken_request, timeout)
          || !trustedEmailInvocation(session, invocation, timeout)) return answer('rejected');
      if (session.replayedEmailRequests.has(request.request_id)) return answer('rejected');
      session.replayedEmailRequests.add(request.request_id);
      while (session.replayedEmailRequests.size > 64) {
        session.replayedEmailRequests.delete(session.replayedEmailRequests.values().next().value);
      }
      return answer(presentEmailReview(request));
    };

    const setLiveButton = state => {
      liveButton.dataset.state = state;
      const label = state === 'connected' ? 'Hang up Live Talk' : state === 'connecting' ? 'Cancel Live Talk call' : 'Start Live Talk';
      liveButton.setAttribute('aria-label', label);
      liveButton.title = label;
    };

    const startConnectionSound = session => {
      if (session.ringtone) return;
      const ringtone = new Audio('/live-talk-connection.wav');
      ringtone.loop = true;
      ringtone.volume = .5;
      session.ringtone = ringtone;
      ringtone.play().catch(() => {});
    };

    const stopConnectionSound = session => {
      if (!session || !session.ringtone) return;
      session.ringtone.pause();
      session.ringtone.currentTime = 0;
      session.ringtone = null;
    };

    function waitForSoleAgent(session, status = 'Live Talk · waiting for agent…') {
      if (live !== session) return;
      session.agentReady = false;
      session.remoteAudioState = makeLiveTalkAudioState();
      agentSpeaking = false;
      currentViseme = 'sil';
      clearTimeout(session.guard);
      setLiveButton('connecting');
      startConnectionSound(session);
      setStatus(status, 'busy');
      session.guard = setTimeout(() => {
        if (live === session) {
          notify('The Live Talk agent did not return. Try again.');
          stopLiveTalk('timeout');
        }
      }, 30000);
    }

    function markAgentReady(session) {
      if (live !== session) return;
      const agents = trustedAgents(session.room);
      if (agents.length > 1) {
        notify('Live Talk ended because more than one agent joined the call.');
        stopLiveTalk('error');
        return;
      }
      if (agents.length === 0) {
        waitForSoleAgent(session);
        return;
      }
      session.agentReady = true;
      session.remoteAudioState = makeLiveTalkAudioState();
      clearTimeout(session.guard);
      stopConnectionSound(session);
      setLiveButton('connected');
      pttButton.disabled = true;
      sendButton.disabled = true;
      setStatus('Live Talk · connected', 'live');
      if (shell && typeof shell.setLiveTalk === 'function') shell.setLiveTalk(true);
    }

    const handleTranscript = (session, segments, participant) => {
      if (live !== session || !participant) return;
      const role = participant.isAgent ? 'assistant' : 'user';
      for (const segment of segments || []) {
        const text = String(segment.text || '').trim();
        if (!text) continue;
        if (segment.final) {
          const key = `${role}:${String(segment.id || text)}`;
          if (session.finalTranscriptIDs.has(key)) continue;
          session.finalTranscriptIDs.add(key);
          if (role === 'user') {
            appendFinalUserTurnSegment(session, text);
          } else {
            session.userTurnOpen = false;
          }
          addMessage(role, text, { readable: role === 'assistant' });
        } else if (role === 'user') {
          setStatus(`Hearing “${text.slice(0, 54)}”`, 'live');
        }
      }
    };

    const releaseAgentAudioAttachment = attachment => {
      if (!attachment) return;
      try { attachment.track.detach(attachment.element); } catch (_) { /* already detached */ }
      try { attachment.source.disconnect(); } catch (_) { /* already disconnected */ }
      try { attachment.element.pause(); } catch (_) { /* already paused */ }
      attachment.element.srcObject = null;
      attachment.element.remove();
    };

    const attachAgentAudio = (session, track, participant) => {
      if (live !== session || !participant || !participant.isAgent || !track.mediaStreamTrack) return;
      const graph = ensureAudioGraph();
      const key = track.sid || track.mediaStreamTrack.id;
      const previous = session.audioAttachments.get(key);
      if (previous) {
        releaseAgentAudioAttachment(previous);
        session.audioAttachments.delete(key);
      }
      const element = document.createElement('audio');
      element.autoplay = true;
      element.hidden = true;
      element.setAttribute('aria-hidden', 'true');
      let source = null;
      try {
        // LiveKit owns the attached element, autoplay recovery, and the sole
        // audible output. Meter the remote WebRTC track through the Web Audio
        // primitive intended for MediaStreams; a MediaElement source created
        // before LiveKit assigns srcObject can remain silent in Chromium.
        document.body.append(element);
        track.attach(element);
        const stream = new MediaStream([track.mediaStreamTrack]);
        source = graph.createMediaStreamSource(stream);
        source.connect(audioAnalyser);
        session.audioAttachments.set(key, { track, element, source, stream });
        void roomAudioReady(session);
      } catch (_) {
        releaseAgentAudioAttachment({ track, element, source });
        notify('Live Talk audio could not start. End the call and try again.');
        if (live === session && !session.ending) stopLiveTalk('error');
      }
    };

    const roomAudioReady = session => {
      if (live !== session || session.ending) return Promise.resolve(false);
      if (session.audioStartPromise) return session.audioStartPromise;
      session.audioStartPromise = (async () => {
        try {
          const graph = ensureAudioGraph();
          if (graph.state !== 'running') await graph.resume();
          await session.room.startAudio();
          if (graph.state !== 'running') throw new Error('audio_context_suspended');
          return true;
        } catch (_) {
          if (live === session && !session.ending) {
            notify('Live Talk speaker playback was blocked. Start the call again to enable audio.');
            stopLiveTalk('error');
          }
          return false;
        } finally {
          session.audioStartPromise = null;
        }
      })();
      return session.audioStartPromise;
    };

    async function startLiveTalk() {
      if (live) { stopLiveTalk('ended'); return; }
      if (ptt || turnController) { notify('Finish the current voice or chat turn before starting Live Talk.'); return; }
      const library = window.LivekitClient;
      if (!library || !library.Room) { notify('Live Talk is unavailable in this build.'); return; }
      stopSpeech();
      const session = {
        room: new library.Room({ adaptiveStream: true, dynacast: true }),
        agentReady: false,
        finalTranscriptIDs: new Set(),
        finalUserTurnSegments: [],
        userTurnOpen: false,
        latestFinalUserTranscript: '',
        replayedEmailRequests: new Set(),
        audioAttachments: new Map(),
        remoteAudioState: makeLiveTalkAudioState(),
        audioStartPromise: null,
        pendingDraft: null,
        ending: false,
        ringtone: null,
      };
      live = session;
      ensureAudioGraph();
      setLiveButton('connecting');
      pttButton.disabled = true;
      sendButton.disabled = true;
      setStatus('Calling Live Talk…', 'busy');
      startConnectionSound(session);
      if (shell && typeof shell.setLiveTalk === 'function') shell.setLiveTalk(true);
      session.guard = setTimeout(() => {
        if (live === session) {
          notify('The Live Talk agent did not answer. Try again.');
          stopLiveTalk('timeout');
        }
      }, 30000);

      const room = session.room;
      room.registerRpcMethod(EMAIL_RPC, invocation => handleEmailRPC(session, invocation));
      room.on(library.RoomEvent.ParticipantConnected, participant => {
        if (participant.isAgent) markAgentReady(session);
      });
      room.on(library.RoomEvent.ParticipantDisconnected, participant => {
        if (participant.isAgent) markAgentReady(session);
      });
      room.on(library.RoomEvent.TrackSubscribed, (track, _publication, participant) => {
        if (track.kind === library.Track.Kind.Audio) attachAgentAudio(session, track, participant);
      });
      room.on(library.RoomEvent.TrackUnsubscribed, track => {
        const key = track.sid || (track.mediaStreamTrack && track.mediaStreamTrack.id);
        const attachment = session.audioAttachments.get(key);
        if (attachment) {
          releaseAgentAudioAttachment(attachment);
          session.audioAttachments.delete(key);
          if (!session.audioAttachments.size) {
            session.remoteAudioState = makeLiveTalkAudioState();
            if (live === session && session.agentReady && !session.ending) setStatus('Live Talk · connected', 'live');
          }
        }
      });
      room.on(library.RoomEvent.AudioPlaybackStatusChanged, canPlay => {
        if (live === session && !session.ending && !canPlay) roomAudioReady(session);
      });
      room.on(library.RoomEvent.TranscriptionReceived, (segments, participant) => handleTranscript(session, segments, participant));
      room.on(library.RoomEvent.ActiveSpeakersChanged, participants => {
        if (live !== session) return;
        const nextAgentSpeaking = participants.some(participant => participant.isAgent);
        if (nextAgentSpeaking !== agentSpeaking) resumeChatSpeakingPose();
        agentSpeaking = nextAgentSpeaking;
      });
      room.on(library.RoomEvent.Reconnecting, () => {
        if (live !== session) return;
        session.agentReady = false;
        session.remoteAudioState = makeLiveTalkAudioState();
        setLiveButton('connecting');
        startConnectionSound(session);
        setStatus('Live Talk · reconnecting…', 'busy');
        clearTimeout(session.guard);
        session.guard = setTimeout(() => {
          if (live === session) {
            notify('Live Talk could not restore the connection.');
            stopLiveTalk('timeout');
          }
        }, 30000);
      });
      room.on(library.RoomEvent.Reconnected, () => {
        if (live !== session) return;
        markAgentReady(session);
      });
      room.on(library.RoomEvent.Disconnected, () => { if (live === session && !session.ending) stopLiveTalk('ended'); });

      try {
        const connection = await fetch('/api/livekit/session', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Cache-Control': 'no-store' },
        }).then(safeJSON);
        if (live !== session) return;
        await room.connect(connection.server_url, connection.participant_token);
        if (live !== session) { room.disconnect().catch(() => {}); return; }
        if (!await roomAudioReady(session) || live !== session) return;
        await room.localParticipant.setMicrophoneEnabled(true);
        markAgentReady(session);
      } catch (error) {
        if (live === session) {
          notify(liveTalkConnectionError(error));
          stopLiveTalk('error');
        }
      }
    }

    function stopLiveTalk(reason) {
      const session = live;
      live = null;
      if (!session) return;
      session.ending = true;
      clearTimeout(session.guard);
      stopConnectionSound(session);
      agentSpeaking = false;
      resumeChatSpeakingPose();
      currentViseme = 'sil';
      reactiveMouthState.viseme = 'sil';
      reactiveMouthState.audibleUntil = 0;
      for (const attachment of session.audioAttachments.values()) releaseAgentAudioAttachment(attachment);
      session.audioAttachments.clear();
      try { session.room.unregisterRpcMethod(EMAIL_RPC); } catch (_) { /* no registration */ }
      session.room.localParticipant.setMicrophoneEnabled(false).catch(() => {});
      session.room.disconnect().catch(() => {});
      // An unsent draft is useful after the call ends; keep its visible review
      // card until the user explicitly copies or dismisses it.
      setLiveButton('idle');
      pttButton.disabled = Boolean(turnController);
      if (shell && typeof shell.setLiveTalk === 'function') shell.setLiveTalk(false);
      setStatus(reason === 'timeout' ? 'Live Talk did not answer' : reason === 'error' ? 'Live Talk unavailable' : 'Ready', reason === 'error' || reason === 'timeout' ? '' : 'good');
      resizeComposer();
      reportControlRects(true);
    }

    const toggleMove = async () => {
      if (!await ensureMotion('move')) return;
      if (root.classList.contains('chat-mode')) {
        manualMotionKind = manualMotionKind === 'move' ? null : 'move';
        manualMotionStartedAt = manualMotionKind ? performance.now() : 0;
        chatWalkState = null;
        movesButton.setAttribute('aria-checked', String(manualMotionKind === 'move'));
        walkButton.setAttribute('aria-checked', 'false');
        edgeIdleButton.setAttribute('aria-checked', 'false');
        if (manualMotionKind && motion.move.video) motion.move.video.currentTime = 0;
        markActivity();
        return;
      }
      if (moveUntil > performance.now()) {
        moveUntil = 0;
        movesButton.classList.remove('showing');
      } else {
        const clip = motion.move;
        if (clip.video) clip.video.currentTime = 0;
        const duration = Math.max(1, Number(clip.frames || 1) / Math.max(1, Number(clip.fps || 1)));
        moveUntil = performance.now() + Math.min(12000, duration * 1000);
        movesButton.classList.add('showing');
        markActivity();
      }
    };

    const toggleWalk = async () => {
      if (!await ensureMotion('walk')) return;
      if (root.classList.contains('chat-mode')) {
        manualMotionKind = manualMotionKind === 'walk' ? null : 'walk';
        manualMotionStartedAt = manualMotionKind ? performance.now() : 0;
        chatWalkState = manualMotionKind
          ? createChatWalkState(manualMotionStartedAt) : null;
        walkButton.setAttribute('aria-checked', String(manualMotionKind === 'walk'));
        edgeIdleButton.setAttribute('aria-checked', 'false');
        movesButton.setAttribute('aria-checked', 'false');
        markActivity();
        return;
      }
      if (!shell || typeof shell.setPetRoam !== 'function') return;
      await shell.setPetRoam(!(shellState.pet && shellState.pet.roam));
    };

    const toggleEdgeIdle = async () => {
      const chatFallback = root.classList.contains('chat-mode') && !authoredMotion('idle');
      if (!chatFallback && !await ensureMotion('idle')) return;
      manualMotionKind = manualMotionKind === 'idle' ? null : 'idle';
      manualMotionStartedAt = manualMotionKind ? performance.now() : 0;
      chatWalkState = null;
      edgeIdleButton.setAttribute('aria-checked', String(manualMotionKind === 'idle'));
      walkButton.setAttribute('aria-checked', 'false');
      movesButton.setAttribute('aria-checked', 'false');
      markActivity();
    };

    const adjustAvatarOpacity = async direction => {
      if (!shell || typeof shell.setPetOpacity !== 'function') return;
      const current = Number(shellState.pet && shellState.pet.opacity);
      const next = steppedAvatarOpacity(current, direction);
      if (Math.abs(next - current) < .001) {
        notify(direction > 0 ? 'Avatar is already fully opaque.' : 'Avatar is at minimum opacity.');
        return;
      }
      try {
        const state = await shell.setPetOpacity(next);
        applyShellState(state);
        notify(`Avatar opacity ${Math.round(next * 100)}%.`, 1800);
      } catch (_) {
        notify('Could not change avatar opacity.');
      }
    };

    const applyShellState = value => {
      if (!value || typeof value !== 'object') return;
      const chatCloseUpChanged = Boolean(value.chatCloseUp) !== Boolean(shellState.chatCloseUp);
      const closeUpChanged = chatCloseUpChanged
        || Boolean(value.desktopCloseUp) !== Boolean(shellState.desktopCloseUp);
      shellState = value;
      if (chatCloseUpChanged) {
        const presentation = value.chatCloseUp ? 'closeUp' : 'standard';
        chatAvatarOffset = boundedChatAvatarOffset({ ...chatAvatarOffsets[presentation] });
      }
      const pet = value.pet || {};
      root.classList.toggle('chat-mode', Boolean(value.chatMode));
      root.classList.toggle('chat-open', Boolean(value.chatMode) || root.classList.contains('chat-open'));
      root.classList.toggle('pet-mode', Boolean(pet.enabled));
      root.classList.toggle('roaming', Boolean(pet.roam));
      walkButton.setAttribute('aria-checked', String(Boolean(pet.roam) || manualMotionKind === 'walk'));
      walkButton.setAttribute('aria-pressed', String(Boolean(pet.roam) || manualMotionKind === 'walk'));
      const opacity = Math.max(0, Math.min(1, Number(pet.opacity) || 0));
      canvas.style.opacity = value.chatMode ? String(opacity) : '1';
      avatarOpacityRange.value = String(Math.round(opacity * 100));
      avatarOpacityValue.textContent = `${Math.round(opacity * 100)}%`;
      if (value.chatMode) {
        applyInteractionLayer(interactionLayer);
        applyRailFold(railFolded);
      }
      if (closeUpChanged) {
        manualMotionKind = null;
        manualMotionStartedAt = 0;
        chatWalkState = null;
        walkButton.setAttribute('aria-checked', 'false');
        edgeIdleButton.setAttribute('aria-checked', 'false');
        movesButton.setAttribute('aria-checked', 'false');
        markActivity();
        lastFrame = 0;
      }
      if (motion.walk) publishMotionReadiness();
    };

    const handleGlobalPointer = point => {
      if (!point) return;
      if (!dragging) {
        const nextX = Number(point.x);
        const nextY = Number(point.y);
        const nextInside = Boolean(point.inside);
        const nextSeen = Number.isFinite(nextX) && Number.isFinite(nextY);
        const changed = nextSeen !== pointer.seen || nextInside !== pointer.inside
          || (nextSeen && (Math.abs(nextX - pointer.x) >= .5
            || Math.abs(nextY - pointer.y) >= .5));
        pointer = {
          x: nextX,
          y: nextY,
          inside: nextInside,
          seen: nextSeen,
          // Main's 250ms stationary heartbeat must not keep the renderer in
          // its fast gaze-settling lane. Only real pointer motion renews it.
          at: changed ? performance.now() : pointer.at,
        };
        if (changed) {
          lastFrame = 0;
          if (root.classList.contains('chat-mode')) markActivity();
        }
        updateHit(false);
        // Frozen Edge Idle paints only on a low-rate maintenance cadence.
        // Pointer IPC is already event-driven, so use it to engage/release a
        // hovered avatar immediately instead of waiting for that maintenance
        // frame.
        syncPetEngagement();
      }
    };

    const PET_ZOOM_RANGES = Object.freeze({
      stand: Object.freeze({ min: .25, max: 4 }),
      roam: Object.freeze({ min: .5, max: 3 }),
    });
    const AVATAR_ZOOM_SETTLE_MS = 140;

    const pinchZoomValue = (current, event, range, viewportHeight) => {
      const value = Number(current);
      const safe = Number.isFinite(value) && value > 0 ? value : 1;
      if (!event || !event.ctrlKey) return safe;
      const unit = event.deltaMode === 1 ? 16
        : event.deltaMode === 2 ? Math.max(1, Number(viewportHeight) || 1) : 1;
      const delta = Math.max(-90, Math.min(90, Number(event.deltaY || 0) * unit));
      const next = safe * Math.exp(-delta * .0075);
      return Math.max(range.min, Math.min(range.max, next));
    };

    const activeAvatarZoom = () => {
      const pet = shellState.pet || {};
      const range = pet.roam ? PET_ZOOM_RANGES.roam : PET_ZOOM_RANGES.stand;
      const value = Number(pet.roam ? pet.roamZoom : pet.zoom);
      return Math.max(range.min, Math.min(range.max,
        Number.isFinite(value) && value > 0 ? value : 1));
    };

    const holdAvatarZoom = value => {
      const pet = shellState.pet || (shellState.pet = {});
      if (pet.roam) pet.roamZoom = value; else pet.zoom = value;
    };

    const publishAvatarZoom = phase => {
      if (!shell || typeof shell.setPetZoomLive !== 'function') return;
      shell.setPetZoomLive({
        value: activeAvatarZoom(),
        phase,
        roam: Boolean(shellState.pet && shellState.pet.roam),
      });
    };

    const finishAvatarZoom = () => {
      if (!avatarZoomGesture) return;
      cancelAnimationFrame(avatarZoomGesture.frame);
      avatarZoomGesture = null;
      clearTimeout(avatarZoomSettleTimer);
      avatarZoomSettleTimer = 0;
      publishAvatarZoom('end');
      // Release the temporary interaction pin using the freshly resized
      // canvas. This restores the ordinary alpha/click-through decision even
      // when the cursor never moved during the gesture.
      updateHit(true);
    };

    const handleAvatarPinch = event => {
      const pet = shellState.pet || {};
      // Chromium exposes a macOS trackpad pinch as a modifier-wheel stream.
      // Ordinary wheel/scroll input is deliberately ignored.
      if (!event.ctrlKey || !shell || typeof shell.setPetZoomLive !== 'function'
          || pet.enabled === false || dragging) return;
      if (root.classList.contains('chat-mode')
          && (interactionLayer !== 'avatar' || Number(pet.opacity) <= .001)) return;
      event.preventDefault();
      // A pinch may continue after the first resize moves the pixels under the
      // cursor. Require an alpha hit only when the gesture starts.
      const freshAvatarHit = avatarHit || paintedAvatarAt({
        x: event.clientX, y: event.clientY, inside: true,
      });
      if (!avatarZoomGesture && !freshAvatarHit) return;
      const range = pet.roam ? PET_ZOOM_RANGES.roam : PET_ZOOM_RANGES.stand;
      const current = activeAvatarZoom();
      const next = pinchZoomValue(current, event, range, innerHeight);
      holdAvatarZoom(next);
      markActivity();
      if (!avatarZoomGesture) {
        avatarZoomGesture = { frame: 0 };
        updateHit(true);
        publishAvatarZoom('start');
      } else if (!avatarZoomGesture.frame) {
        avatarZoomGesture.frame = requestAnimationFrame(() => {
          if (!avatarZoomGesture) return;
          avatarZoomGesture.frame = 0;
          publishAvatarZoom('move');
        });
      }
      clearTimeout(avatarZoomSettleTimer);
      avatarZoomSettleTimer = setTimeout(finishAvatarZoom, AVATAR_ZOOM_SETTLE_MS);
    };

    const endCanvasGesture = event => {
      const gesture = canvasGesture;
      canvasGesture = null;
      clearTimeout(gesture && gesture.holdTimer);
      if (!gesture) return;
      if (gesture.positionAdjusting) {
        dragging = false;
        root.classList.remove('dragging', 'position-adjusting');
        if (manualMotionKind === 'walk' && manualMotionStartedAt > 0) {
          const pausedFor = Math.max(0, performance.now() - gesture.motionAt);
          manualMotionStartedAt += pausedFor;
          if (chatWalkState) {
            if (String(chatWalkState.mode).startsWith('ledge-')) {
              chatWalkState.holdUntil += pausedFor;
            } else {
              chatWalkState.segmentStartedAt += pausedFor;
            }
          }
        }
        saveChatAvatarOffset();
        updateHit(true);
        return;
      }
      if (dragging) {
        dragging = false;
        root.classList.remove('dragging', 'position-adjusting');
        if (shell && typeof shell.endPetDrag === 'function') shell.endPetDrag();
        updateHit(true);
        return;
      }
      if (gesture.talking) {
        stopRecording(false);
        return;
      }
      if (event && event.button === 0 && performance.now() - gesture.at < 420) {
        if (root.classList.contains('chat-mode')) return;
        const action = avatarTapActionAt({ x: gesture.x, y: gesture.y });
        if (!action) return;
        clearTimeout(avatarTapTimer);
        avatarTapTimer = setTimeout(() => {
          avatarTapTimer = 0;
          if (action === 'opacity-up') void adjustAvatarOpacity(1);
          else if (action === 'opacity-down') void adjustAvatarOpacity(-1);
        }, 300);
      }
    };

    canvas.addEventListener('pointerdown', event => {
      const freshAvatarHit = avatarHit || (root.classList.contains('chat-mode')
        && interactionLayer === 'avatar' && paintedAvatarAt({
          x: event.clientX, y: event.clientY, inside: true,
        }));
      if (event.button !== 0 || !freshAvatarHit) return;
      handleGlobalPointer({ x: event.clientX, y: event.clientY, inside: true });
      clearTimeout(avatarTapTimer);
      avatarTapTimer = 0;
      markActivity();
      canvas.setPointerCapture(event.pointerId);
      const gesture = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        screenX: event.screenX,
        screenY: event.screenY,
        at: performance.now(),
        talking: false,
        positionAdjusting: false,
        startOffset: { ...chatAvatarOffset },
        motionAt: performance.now(),
        holdTimer: 0,
      };
      canvasGesture = gesture;
      if (pointOnHead({ x: event.clientX, y: event.clientY })) {
        gesture.holdTimer = setTimeout(() => {
          if (canvasGesture !== gesture || dragging || live) return;
          gesture.talking = true;
          startRecording();
        }, 230);
      }
    });

    canvas.addEventListener('pointermove', event => {
      if (!shell || !canvasGesture || canvasGesture.id !== event.pointerId || canvasGesture.talking) return;
      if (root.classList.contains('chat-mode') && interactionLayer === 'avatar') {
        const deltaX = event.clientX - canvasGesture.x;
        const deltaY = event.clientY - canvasGesture.y;
        if (!canvasGesture.positionAdjusting && Math.hypot(deltaX, deltaY) > 5) {
          clearTimeout(canvasGesture.holdTimer);
          canvasGesture.positionAdjusting = true;
          root.classList.add('position-adjusting');
          dragging = true;
          root.classList.add('dragging');
        }
        if (canvasGesture.positionAdjusting) {
          chatAvatarOffset = boundedChatAvatarOffset({
            x: canvasGesture.startOffset.x + deltaX,
            y: canvasGesture.startOffset.y + deltaY,
          });
          return;
        }
      }
      if (!dragging && Math.hypot(event.clientX - canvasGesture.x, event.clientY - canvasGesture.y) > 5) {
        clearTimeout(canvasGesture.holdTimer);
        dragging = true;
        root.classList.add('dragging');
        if (typeof shell.beginPetDrag === 'function') shell.beginPetDrag({ screenX: canvasGesture.screenX, screenY: canvasGesture.screenY });
      }
      if (dragging && typeof shell.movePetDrag === 'function') shell.movePetDrag({ screenX: event.screenX, screenY: event.screenY });
    });
    canvas.addEventListener('pointerup', endCanvasGesture);
    canvas.addEventListener('pointercancel', endCanvasGesture);
    canvas.addEventListener('wheel', handleAvatarPinch, { passive: false });
    canvas.addEventListener('dblclick', event => {
      clearTimeout(avatarTapTimer);
      avatarTapTimer = 0;
      if (root.classList.contains('chat-mode') || !paintedAvatarAt({
        x: event.clientX, y: event.clientY, inside: true,
      })) return;
      event.preventDefault();
      toggleLiveTalk();
    });
    canvas.addEventListener('contextmenu', event => {
      if (root.classList.contains('chat-mode')) return;
      event.preventDefault();
      if (shell && typeof shell.showPetMenu === 'function') shell.showPetMenu();
    });

    const toggleLiveTalk = () => {
      markActivity();
      if (live) stopLiveTalk('ended');
      else startLiveTalk();
    };

    liveButton.addEventListener('click', toggleLiveTalk);
    avatarCarouselButton.addEventListener('click', cycleAvatar);
    avatarModeButton.addEventListener('click', closeChat);
    chatHeaderAvatarModeButton.addEventListener('click', closeChat);
    chatHeaderThemeButton.addEventListener('click', () => {
      applyAppTheme(root.dataset.theme === 'dark' ? 'light' : 'dark', true);
    });
    motionMenuButton.addEventListener('click', event => {
      event.stopPropagation();
      const next = motionPicker.hidden;
      closeRailPickers();
      motionPicker.hidden = !next;
      motionMenuButton.setAttribute('aria-expanded', String(next));
      reportControlRects(true);
    });
    movesButton.addEventListener('click', () => { void toggleMove(); });
    movesButton.addEventListener('click', closeRailPickers);
    walkButton.addEventListener('click', toggleWalk);
    walkButton.addEventListener('click', closeRailPickers);
    edgeIdleButton.addEventListener('click', () => { void toggleEdgeIdle(); closeRailPickers(); });
    speakerButton.addEventListener('click', () => {
      if (latestAssistantText) void readAloud(latestAssistantText);
      else notify('There is no assistant reply to read yet.');
    });
    layerButton.addEventListener('click', () => {
      closeRailPickers();
      applyInteractionLayer(interactionLayer === 'avatar' ? 'thread' : 'avatar');
      reportControlRects(true);
    });
    opacityButton.addEventListener('click', event => {
      event.stopPropagation();
      const next = opacityPanel.hidden;
      closeRailPickers();
      opacityPanel.hidden = !next;
      opacityButton.setAttribute('aria-expanded', String(next));
      reportControlRects(true);
    });
    avatarOpacityRange.addEventListener('input', () => {
      const next = Math.max(0, Math.min(1, Number(avatarOpacityRange.value) / 100));
      canvas.style.opacity = String(next);
      avatarOpacityValue.textContent = `${Math.round(next * 100)}%`;
    });
    avatarOpacityRange.addEventListener('change', async () => {
      if (!shell || typeof shell.setPetOpacity !== 'function') return;
      try { applyShellState(await shell.setPetOpacity(Number(avatarOpacityRange.value) / 100)); }
      catch (_) { notify('Could not change avatar opacity.'); }
    });
    mirrorButton.addEventListener('click', () => applyAvatarMirror(!avatarMirrored));
    railFoldButton.addEventListener('click', () => applyRailFold(!railFolded));
    chatHistoryButton.addEventListener('click', () => {
      setHistoryOpen(!root.classList.contains('history-open'));
    });
    chatHistoryScrim.addEventListener('click', () => setHistoryOpen(false));
    closeHistoryButton.addEventListener('click', () => setHistoryOpen(false));
    newChatButton.addEventListener('click', createNewChat);
    chatHeaderNewButton.addEventListener('click', createNewChat);
    historySettingsButton.addEventListener('click', () => {
      setHistoryOpen(false);
      if (shell) shell.openSettings();
    });
    settingsButton.addEventListener('click', () => shell && shell.openSettings());
    document.getElementById('emptyChat').addEventListener('click', () => openChat(true));
    document.getElementById('emptySettings').addEventListener('click', () => shell && shell.openSettings());
    closeChatButton.addEventListener('click', closeChat);
    sendButton.addEventListener('click', submitComposer);
    attachButton.addEventListener('click', event => {
      event.stopPropagation();
      setAttachmentMenuOpen(attachmentMenu.hidden);
    });
    addFilesButton.addEventListener('click', () => {
      setAttachmentMenuOpen(false);
      fileInput.click();
    });
    addPhotosButton.addEventListener('click', () => {
      setAttachmentMenuOpen(false);
      photoInput.click();
    });
    takePhotoButton.addEventListener('click', startCamera);
    fileInput.addEventListener('change', async () => {
      await uploadComposerFiles(fileInput.files);
      fileInput.value = '';
    });
    photoInput.addEventListener('change', async () => {
      await uploadComposerFiles(photoInput.files);
      photoInput.value = '';
    });
    cameraCaptureButton.addEventListener('click', captureCameraPhoto);
    cameraCloseButton.addEventListener('click', stopCamera);
    cameraDialog.addEventListener('cancel', event => {
      event.preventDefault();
      stopCamera();
    });
    filePreviewClose.addEventListener('click', () => filePreviewDialog.close());
    filePreviewSave.addEventListener('click', () => {
      if (previewResource) downloadResource(previewResource);
    });
    filePreviewShare.addEventListener('click', () => {
      if (previewResource) void shareResource(previewResource);
    });
    conversation.addEventListener('pointerdown', event => {
      selectingFeedback = Boolean(event.target && event.target.closest
        && event.target.closest('.message.assistant .bubble'));
      if (!selectingFeedback) hideSelectionActions(true);
    });
    conversation.addEventListener('pointerup', () => {
      selectingFeedback = false;
      requestAnimationFrame(refreshSelectionActions);
    });
    conversation.addEventListener('pointercancel', () => { selectingFeedback = false; });
    conversation.addEventListener('contextmenu', event => {
      const candidate = feedbackSelectionCandidate(getSelection());
      if (!candidate) return;
      event.preventDefault();
      showSelectionActions(candidate);
    });
    conversation.addEventListener('scroll', () => hideSelectionActions(false), { passive: true });
    selectionActions.addEventListener('pointerdown', event => event.preventDefault());
    selectionCopy.addEventListener('click', () => {
      const text = selectedFeedback && selectedFeedback.text;
      if (text) copyFeedbackText(text, 'selection');
    });
    selectionAskAI.addEventListener('click', askAIAboutSelectedFeedback);
    document.addEventListener('selectionchange', () => requestAnimationFrame(refreshSelectionActions));
    document.addEventListener('pointerdown', event => {
      if (!motionPicker.contains(event.target) && event.target !== motionMenuButton
          && !opacityPanel.contains(event.target) && event.target !== opacityButton) {
        closeRailPickers();
      }
      if (!attachmentMenu.contains(event.target) && event.target !== attachButton) {
        setAttachmentMenuOpen(false);
      }
      if (!selectionActions.contains(event.target) && !conversation.contains(event.target)) {
        hideSelectionActions(true);
      }
    }, true);
    composer.addEventListener('input', () => { resizeComposer(); markActivity(); });
    composer.addEventListener('pointerdown', () => {
      markActivity();
      if (shell && typeof shell.focusPetWindow === 'function') shell.focusPetWindow();
    });
    composer.addEventListener('keydown', event => {
      if (avatarOnlyMotion) { event.preventDefault(); return; }
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitComposer(); }
    });

    pttButton.addEventListener('pointerdown', event => {
      event.preventDefault();
      if (avatarOnlyMotion) return;
      pttButton.setPointerCapture(event.pointerId);
      startRecording();
    });
    pttButton.addEventListener('pointerup', () => stopRecording(false));
    pttButton.addEventListener('pointercancel', () => stopRecording(true));

    addEventListener('keydown', event => {
      if (avatarOnlyMotion) return;
      const typing = document.activeElement === composer || document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;
      if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === 'a') {
        const candidate = feedbackSelectionCandidate(getSelection());
        if (candidate) {
          event.preventDefault();
          selectedFeedback = candidate;
          askAIAboutSelectedFeedback();
          return;
        }
      }
      if ((event.metaKey || event.ctrlKey) && event.key === ',') {
        event.preventDefault();
        if (shell) shell.openSettings();
        return;
      }
      if (event.key === 'Escape') {
        if (cameraDialog.open) stopCamera();
        else if (filePreviewDialog.open) filePreviewDialog.close();
        else if (!attachmentMenu.hidden) setAttachmentMenuOpen(false);
        else if (root.classList.contains('history-open')) setHistoryOpen(false);
        else if (selectionActions.classList.contains('show')) hideSelectionActions(true);
        else if (document.querySelector('.email-review')) closeEmailReview();
        else if (live) stopLiveTalk('ended');
        else if (turnController) { turnController.abort(); turnController = null; removeWorking(); setStatus('Ready', 'good'); }
        else closeChat();
        return;
      }
      if (event.code === 'Space' && !typing && !event.repeat && !live) {
        event.preventDefault();
        startRecording();
      }
    });
    addEventListener('keyup', event => {
      if (avatarOnlyMotion) return;
      const typing = document.activeElement === composer || document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;
      if (event.code === 'Space' && !typing && ptt) { event.preventDefault(); stopRecording(false); }
    });
    addEventListener('resize', () => { hideSelectionActions(false); resizeCanvas(); reportControlRects(true); });
    addEventListener('blur', () => {
      finishAvatarZoom();
      if (ptt) stopRecording(true);
    });
    addEventListener('beforeunload', () => {
      clearTimeout(avatarTapTimer);
      finishAvatarZoom();
      if (live) stopLiveTalk('ended');
      if (ptt && ptt.stream) ptt.stream.getTracks().forEach(track => track.stop());
      stopCamera();
      stopSpeech();
      if (shell && typeof shell.setPetControlRects === 'function') shell.setPetControlRects([]);
    });

    if (shell) {
      shell.getState().then(applyShellState).catch(() => {});
      if (typeof shell.onState === 'function') shell.onState(applyShellState);
      if (typeof shell.onPetPointer === 'function') shell.onPetPointer(handleGlobalPointer);
      if (typeof shell.onPetRoamMotion === 'function') shell.onPetRoamMotion(value => {
        const nextRoamState = value && typeof value === 'object'
          ? value : { enabled: false, mode: 'idle', direction: 1, phase: 0, edge: null };
        const nextPresentationKey = roamPresentationSignature(nextRoamState);
        if (nextPresentationKey !== roamPresentationKey) lastFrame = 0;
        roamPresentationKey = nextPresentationKey;
        roamState = nextRoamState;
      });
      if (typeof shell.onPetMoves === 'function') shell.onPetMoves(() => { void toggleMove(); });
      if (typeof shell.onPetChat === 'function') shell.onPetChat(() => openChat(true));
      if (typeof shell.onLiveToggle === 'function') shell.onLiveToggle(toggleLiveTalk);
    } else {
      root.classList.add('chat-open');
    }

    const healthPoll = async () => {
      if (live || speechSource || turnController || ptt) return;
      try {
        const health = await fetch('/health', { cache: 'no-store' }).then(safeJSON);
        if (health.provider_ok || health.llm_ok) setStatus(`${manifest && manifest.avatar && manifest.avatar.name || 'OpenClam'} · ready`, 'good');
        else setStatus('Choose a language model in Character Studio', '');
      } catch (_) { setStatus('Voice engine unavailable', ''); }
    };
    setInterval(healthPoll, 12000);

    resizeCanvas();
    resizeComposer();
    reportControlRects(true);
    saveChatThreads();
    void restoreChatThread(activeChatThread());
    loadAvatar();
    loadOpenClawAgents().then(() => {
      agentModeSelect.dispatchEvent(new Event('change'));
    });
    setTimeout(healthPoll, 1600);
  })();
  </script>
</body>
</html>
