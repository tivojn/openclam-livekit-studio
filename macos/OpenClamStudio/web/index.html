      const clip = motion[kind];
      if (!clip) return false;
      const presentationKey = beginMotionPresentation(kind, edge, clip);
      const width = Number(clip.frame_width) || 720;
      const height = Number(clip.frame_height) || 1088;
      const fit = cameraFor({ bounds: clip.bounds || [0, 0, width, height] }, width, height, 'full');
      const direction = Number(roamState.direction) || 1;
      const freeIdle = kind === 'idle' && clip.anchor_mode === 'free';
      const mirror = kind === 'walk' ? direction < 0 : edge === 'right' && !freeIdle;
      const phase = kind === 'walk' && roamState.enabled
        ? motionPhaseAt(roamState, clip, performance.timeOrigin + now) : null;
      const frame = clip.video ? null : motionFrame(clip, now, phase);
      let x = fit.x;
      if (kind === 'idle' && edge && !freeIdle) {
        const anchors = clip.edge_anchors || {};
        const frameAnchors = Array.isArray(anchors.left_frames) ? anchors.left_frames : [];
        const support = Number(frameAnchors[frame ? frame.index : 0]);
        const leftSupport = Number.isFinite(support) ? support : Number(anchors.left) || 0;
        x = edge === 'left' ? 3 - leftSupport * fit.scale : innerWidth - 3 - (width - leftSupport) * fit.scale;
      }

      const videoReady = Boolean(clip.video && clip.video.readyState >= 2 && !clip.video.seeking);
      const fallback = !videoReady && !frame ? clip.posterImage : null;
      // A transient decoder state must hold the last valid transparent frame,
      // never clear the stage and expose the standing plate for one refresh.
      if (!videoReady && !frame && !fallback) return paintedMotionKey === presentationKey;

      clearStage();
      context.save();
      context.setTransform(pixelRatio * fit.scale, 0, 0, pixelRatio * fit.scale, pixelRatio * x, pixelRatio * fit.y);
      if (mirror) { context.translate(width, 0); context.scale(-1, 1); }
      if (videoReady) {
        const frozen = roamState.enabled && roamState.mode === 'stand';
        if (frozen && !clip.video.paused) clip.video.pause();
        else if (!frozen && clip.video.paused && !clip.video.ended) clip.video.play().catch(() => {});
        context.drawImage(clip.video, 0, 0, width, height);
      } else if (frame) {
        context.drawImage(frame.sheet.image, frame.sx, frame.sy, width, height, 0, 0, width, height);
      } else {
        context.drawImage(fallback, 0, 0, width, height);
      }
      context.restore();
      paintedMotionKey = presentationKey;
      return true;
    };

    // Speech should be carried by the mouth and expression bank, not by a
    // metronomic full-body rock. Keep a small, slow counter-sway and breath so
    // the plate remains alive; reduced-motion users get a completely stable
    // silhouette while lip sync itself stays available.
    const bodyMotionAt = (now, speaking, state, reduce = false) => {
      const target = speaking ? 1 : 0;
      if (reduce) {
        state.speechBlend = target;
        state.at = now;
        return { sway: 0, breathe: 1 };
      }
      const elapsed = state.at > 0 ? Math.max(1, Math.min(80, now - state.at)) : 16;
      const responseTime = target > state.speechBlend ? 260 : 420;
      const response = 1 - Math.exp(-elapsed / responseTime);
      state.speechBlend += (target - state.speechBlend) * response;
      state.speechBlend = Math.max(0, Math.min(1, state.speechBlend));
      state.at = now;
      const idle = {
        sway: Math.sin(now / 2200) * .0056,
        breathe: 1 + Math.sin(now / 1250) * .0025,
      };
      const speech = {
        sway: Math.sin(now / 1050) * .0011 + Math.sin(now / 2600) * .00025,
        breathe: 1 + Math.sin(now / 1650) * .0009,
      };
      const blend = state.speechBlend;
      return {
        sway: idle.sway + (speech.sway - idle.sway) * blend,
        breathe: idle.breathe + (speech.breathe - idle.breathe) * blend,
      };
    };

    const drawAvatar = now => {
      clearStage();
      composeHead(now);
      const hasBody = Boolean(bodyImage && manifest.body);
      const image = hasBody ? bodyImage : faceCanvas;
      const width = image.naturalWidth || image.width || portraitWidth;
      const height = image.naturalHeight || image.height || portraitHeight;
      const metadata = hasBody ? manifest.body : {
        bounds: manifest.cutout && manifest.cutout.bounds || [0, 0, width, height],
        alignment: { face_bounds: [width * .2, height * .08, width * .6, height * .64] },
      };
      const fit = cameraFor(metadata, width, height);
      const bounds = metadata.bounds || [0, 0, width, height];
      const pivotX = bounds[0] + bounds[2] * .5;
      const pivotY = bounds[1] + bounds[3];
      const liveAudioSpeaking = Boolean(
        live && live.remoteAudioState && live.remoteAudioState.speaking);
      const { sway, breathe } = bodyMotionAt(
        now, Boolean(agentSpeaking || speechSource || liveAudioSpeaking),
        bodyMotionState, reducedMotion.matches);

      context.save();
      context.setTransform(pixelRatio * fit.scale, 0, 0, pixelRatio * fit.scale, pixelRatio * fit.x, pixelRatio * fit.y);
      context.translate(pivotX, pivotY);
      context.rotate(sway);
      context.scale(breathe, 1);
      context.translate(-pivotX, -pivotY);
      context.drawImage(image, 0, 0, width, height);
      if (hasBody && headMask && Array.isArray(manifest.body.face_transform) && manifest.body.face_transform.length === 2) {
        const matrix = manifest.body.face_transform;
        context.save();
        context.transform(matrix[0][0], matrix[1][0], matrix[0][1], matrix[1][1], matrix[0][2], matrix[1][2]);
        context.drawImage(headCanvas, 0, 0, portraitWidth, portraitHeight);
        context.restore();
      }
      context.restore();

      lastBodyGeometry = { fit, width, height, metadata, pivotX, pivotY, sway, breathe, hasBody };
    };

    const edgeIdleActive = now => Boolean(motion.idle && !roamState.enabled && !root.classList.contains('chat-open') && !speechSource && !agentSpeaking && now - lastActivity > 12000);

    const roamMotionKind = (mode, presentationMode = null) => {
      const presented = mode === 'stand' ? String(presentationMode || 'walk') : String(mode || '');
      return presented === 'walk' ? 'walk' : presented.startsWith('ledge-') ? 'idle' : null;
    };

    const roamPresentationSignature = value => [
      Boolean(value && value.enabled),
      String(value && value.mode || ''),
      String(value && value.presentationMode || ''),
      Number(value && value.direction) || 1,
      String(value && value.edge || ''),
    ].join(':');

    const drawPresentedMotion = (kind, now, edge = null) => {
      const rendered = drawMotion(kind, now, edge);
      setAvatarOnlyMotion(rendered && (kind === 'walk' || kind === 'idle'));
      return rendered;
    };

    const paintFrame = now => {
      resizeCanvas();
      if (!ready) { clearStage(); setAvatarOnlyMotion(false); return; }

      if (roamState.enabled) {
        // Intentional hover pauses the roam engine in `stand`. Keep the held
        // Walk atlas frame and pure-alpha presentation instead of replacing
        // it with the static avatar and restoring the hidden chrome.
        const kind = roamMotionKind(roamState.mode, roamState.presentationMode);
        if (kind && drawPresentedMotion(kind, now, roamState.edge || side)) return;
      }
      if (now < moveUntil && drawPresentedMotion('move', now)) return;
      if (moveUntil && now >= moveUntil) {
        moveUntil = 0;
        movesButton.classList.remove('showing');
      }
      if (edgeIdleActive(now)) {
        if (!idleDocked) {
          idleDocked = true;
          if (shell && typeof shell.dockPet === 'function') shell.dockPet();
        }
        if (drawPresentedMotion('idle', now, side)) return;
      } else if (idleDocked) {
        idleDocked = false;
        if (shell && typeof shell.undockPet === 'function') shell.undockPet();
      }
      endMotionPresentation();
      setAvatarOnlyMotion(false);
      drawAvatar(now);
    };

    const motionFrameDelay = (clip, frozen = false) => {
      if (frozen) return 250;
      const fps = Math.max(1, Math.min(30, Number(clip && clip.fps) || 12));
      return 1000 / fps;
    };

    const standbyFrameDelay = (now, state = {}, onBattery = false) => {
      const pointerAt = Number(state.pointerAt);
      const gazeAnimating = Number.isFinite(pointerAt)
        && now - pointerAt >= 0 && now - pointerAt < STANDBY_GAZE_SETTLE_MS;
      const facialAnimation = Boolean(state.blink || state.micro
        || state.release || state.viseme || gazeAnimating);
      // A still avatar only needs a low-rate maintenance paint. Blink, gaze,
      // and release/crossfade windows temporarily return to conversational
      // cadence, so the power saving never makes eyes or lips visibly step.
      return facialAnimation ? (onBattery ? 50 : 32) : STANDBY_MAINTENANCE_MS;
    };

    const frameDelay = now => {
      if (document.hidden || Number(shellState.pet && shellState.pet.opacity) <= .001) return 250;
      if (roamState.enabled) {
        const kind = roamMotionKind(roamState.mode, roamState.presentationMode);
        const clip = kind && motion[kind];
        const frozen = roamState.mode === 'stand'
          || Boolean(clip && clip.video && clip.video.ended);
        return motionFrameDelay(clip, frozen);
      }
      if (now < moveUntil) {
        return motionFrameDelay(motion.move,
          Boolean(motion.move && motion.move.video && motion.move.video.ended));
      }
      if (edgeIdleActive(now)) {
        return motionFrameDelay(motion.idle,
          Boolean(motion.idle && motion.idle.video && motion.idle.video.ended));
      }
      if (dragging || avatarZoomGesture) return 16;
      const active = speechSource || hasAttachedAgentAudio() || agentSpeaking || ptt;
      if (active) return shellState.onBattery ? 50 : 32;
      const decorativeMotion = !reducedMotion.matches;
      const microElapsed = now - Number(microExpression.started || 0);
      return standbyFrameDelay(now, {
        blink: decorativeMotion && Boolean(blinkStartedAt),
        micro: decorativeMotion && microExpression.started > 0
          && microElapsed >= 0 && microElapsed < microExpression.duration,
        release: speechExpressionState.mode !== 'idle',
        viseme: currentViseme !== previousViseme
          && now - visemeChangedAt < XFADE * 1000,
        pointerAt: decorativeMotion && pointer.seen
          ? pointer.at : Number.NEGATIVE_INFINITY,
      }, shellState.onBattery);
    };

    const advanceFrameClock = (previous, now, delay) => {
      const interval = Math.max(1, Number(delay) || 1);
      const elapsed = now - previous;
      if (!(previous > 0) || elapsed < 0 || elapsed > interval * 4) {
        return { due: true, next: now };
      }
      // Keep the fractional deadline instead of resetting to `now`. At 60Hz
      // this yields the correct alternating 2/3-refresh holds for 24fps;
      // resetting rounded 41.7ms up to three refreshes and silently made the
      // source look like 20fps.
      if (elapsed + .5 < interval) return { due: false, next: previous };
      const steps = Math.max(1, Math.floor((elapsed + .5) / interval));
      return { due: true, next: previous + steps * interval };
    };

    function renderLoop(now) {
      requestAnimationFrame(renderLoop);
      if (!ready) return;
      const clock = advanceFrameClock(lastFrame, now, frameDelay(now));
      if (!clock.due) return;
      lastFrame = clock.next;
      if (audioAnalyser) {
        if (!audioTimeData || audioTimeData.length !== audioAnalyser.fftSize) audioTimeData = new Uint8Array(audioAnalyser.fftSize);
        if (!audioFrequencyData || audioFrequencyData.length !== audioAnalyser.frequencyBinCount) audioFrequencyData = new Uint8Array(audioAnalyser.frequencyBinCount);
        audioAnalyser.getByteTimeDomainData(audioTimeData);
        audioAnalyser.getByteFrequencyData(audioFrequencyData);
        const measured = measureAudioSignal(audioTimeData, audioFrequencyData, audioContext && audioContext.sampleRate);
        audioPeak = Math.max(.018, measured.rms, audioPeak * .994);
        audioSignal = { ...measured, relative: Math.min(1, measured.rms / audioPeak) };
      } else {
        audioSignal = { rms: 0, relative: 0, low: 0, mid: 0, high: 0, centroid: 0, zcr: 0 };
      }
      if (live) syncLiveTalkAudioStatus(live, now);
      if (ptt) updateRecordingMeter(now);
      paintFrame(now);
      updateHit(false);
      syncPetEngagement();
      if (!avatarOnlyMotion && now - lastControlReport > 200) {
        lastControlReport = now;
        reportControlRects();
      }
    }

    const pointInsideRect = (point, rectangle) => point.x >= rectangle.left && point.x <= rectangle.right && point.y >= rectangle.top && point.y <= rectangle.bottom;

    const controlElements = () => {
      if (avatarOnlyMotion) return [];
      const draft = document.querySelector('.email-review');
      if (draft) return [draft];
      const values = [liveButton, avatarCarouselButton, movesButton, walkButton, settingsButton];
      if (root.classList.contains('chat-open')) values.push(chatDock);
      if (emptyState.classList.contains('show')) values.push(emptyState);
      return values;
    };

    const overControls = point => controlElements().some(element => {
      if (!element) return false;
      const box = element.getBoundingClientRect();
      return box.width > 0 && box.height > 0 && pointInsideRect(point, box);
    });

    const paintedAvatarAt = point => {
      if (!ready || !point || point.inside === false
          || point.x < 0 || point.y < 0 || point.x >= innerWidth || point.y >= innerHeight) return false;
      try {
        const alpha = context.getImageData(
          Math.floor(point.x * pixelRatio), Math.floor(point.y * pixelRatio), 1, 1).data[3];
        return alpha > 18;
      } catch (_) {
        return false;
      }
    };

    function updateHit(force) {
      if (!shell || typeof shell.setPetHit !== 'function') return;
      const chromeHit = overControls(pointer);
      const figureHit = !chromeHit && paintedAvatarAt(pointer);
      // A live pinch owns interactivity until its end packet. Pinching inward
      // can move the resized figure away from a stationary cursor; dropping
      // the hit claim mid-stream would make Electron click through and lose
      // the remaining wheel events before the gesture can settle or persist.
      const hit = dragging || Boolean(ptt) || Boolean(avatarZoomGesture) || chromeHit || figureHit;
      avatarHit = figureHit;
      root.classList.toggle('avatar-hover', figureHit);
      if (hit) markActivity();
      const now = performance.now();
      if (hit !== petHit || force || now - lastHitSent > 550) {
        petHit = hit;
        lastHitSent = now;
        shell.setPetHit(hit);
      }
    }

    function syncPetEngagement() {
      if (!shell || typeof shell.setPetEngaged !== 'function') return;
      // The chat may have been open when Horizon Walk was selected. It is
      // inert and invisible during the presentation, so it must not pin the
      // roam engine in its stationary interaction state. Likewise, hovering
      // a now-hidden rail control is window interactivity, not avatar hover.
      const engaged = Boolean(shellState.pet && shellState.pet.roam
        && (avatarHit || ptt || speechSource || agentSpeaking));
      if (engaged === petEngaged) return;
      petEngaged = engaged;
      shell.setPetEngaged(engaged);
    }

    const safeUTF16Prefix = (value, maximum) => {
      const text = String(value || '');
      const limit = Math.max(0, Math.floor(Number(maximum) || 0));
      if (text.length <= limit) return text;
      let clipped = text.slice(0, limit);
      const final = clipped.charCodeAt(clipped.length - 1);
      if (final >= 0xD800 && final <= 0xDBFF) clipped = clipped.slice(0, -1);
      return clipped;
    };

    const formatSelectedFeedback = (value, maximum = 12000) => {
      const selected = String(value || '').replace(/\r\n?/g, '\n');
      const limit = Math.max(0, Math.floor(Number(maximum) || 0));
      const suffix = '\n\nAsk about this selection: ';
      if (!selected.trim() || limit <= suffix.length + 4) {
        return { text: '', truncated: Boolean(selected.trim()) };
      }
      const quoted = `> ${selected.replace(/\n/g, '\n> ')}`;
      const budget = limit - suffix.length;
      if (quoted.length <= budget) return { text: `${quoted}${suffix}`, truncated: false };
      const marker = '\n> …';
      const clipped = safeUTF16Prefix(quoted, Math.max(0, budget - marker.length))
        .replace(/[\n\s>]+$/u, '');
      return { text: `${clipped}${marker}${suffix}`, truncated: true };
    };

    const composeAskAIDraft = (current, selected, maximum = 12000) => {
      const existing = String(current || '');
      const limit = Math.max(0, Math.floor(Number(maximum) || 0));
      const separator = existing
        ? (existing.endsWith('\n\n') ? '' : existing.endsWith('\n') ? '\n' : '\n\n')
        : '';
      const room = limit - existing.length - separator.length;
      const formatted = formatSelectedFeedback(selected, room);
      if (!formatted.text) {
        return { value: existing, inserted: false, truncated: formatted.truncated };
      }
      return {
        value: `${existing}${separator}${formatted.text}`,
        inserted: true,
        truncated: formatted.truncated,
      };
    };

    const selectionToolbarPoint = (selectionRect, toolbarSize, dockBounds) => {
      const gutter = 8;
      const width = Math.max(1, Number(toolbarSize && toolbarSize.width) || 1);
      const height = Math.max(1, Number(toolbarSize && toolbarSize.height) || 1);
      const boundsWidth = Math.max(width + gutter * 2, Number(dockBounds && dockBounds.width) || width);
      const boundsHeight = Math.max(height + gutter * 2, Number(dockBounds && dockBounds.height) || height);
      const left = Number(selectionRect && selectionRect.left) || 0;
      const top = Number(selectionRect && selectionRect.top) || 0;
      const right = Number(selectionRect && selectionRect.right) || left;
      const bottom = Number(selectionRect && selectionRect.bottom) || top;
      const dockLeft = Number(dockBounds && dockBounds.left) || 0;
      const dockTop = Number(dockBounds && dockBounds.top) || 0;
      const centered = (left + right) / 2 - dockLeft - width / 2;
      const x = Math.max(gutter, Math.min(boundsWidth - width - gutter, centered));
      const above = top - dockTop - height - gutter;
      const below = bottom - dockTop + gutter;
      const y = above >= gutter
        ? above : Math.max(gutter, Math.min(boundsHeight - height - gutter, below));
      return { x, y };
    };

    const feedbackSelectionCandidate = selection => {
      if (!selection || selection.rangeCount !== 1 || selection.isCollapsed) return null;
      const elementFor = node => node && (node.nodeType === 1 ? node : node.parentElement);
      const start = elementFor(selection.anchorNode);
      const end = elementFor(selection.focusNode);
      const bubble = start && typeof start.closest === 'function'
        ? start.closest('.message.assistant .bubble') : null;
      if (!bubble || !end || !bubble.contains(selection.anchorNode)
          || !bubble.contains(selection.focusNode) || !bubble.isConnected) return null;
      const text = String(selection.toString() || '');
      if (!text.trim()) return null;
      const range = selection.getRangeAt(0);
      const measured = range.getBoundingClientRect();
      const rect = measured && (measured.width || measured.height)
        ? measured : bubble.getBoundingClientRect();
      return { bubble, text, rect };
    };

    const hideSelectionActions = (forget = false) => {
      selectionActions.classList.remove('show');
      selectionActions.setAttribute('aria-hidden', 'true');
      selectionActions.inert = true;
      if (forget) selectedFeedback = null;
    };

    const showSelectionActions = candidate => {
      if (!candidate || avatarOnlyMotion || !root.classList.contains('chat-open')) {
        hideSelectionActions(true);
        return;
      }
      selectedFeedback = candidate;
      selectionActions.inert = false;
      selectionActions.setAttribute('aria-hidden', 'false');
      selectionActions.classList.add('show');
      const dock = chatDock.getBoundingClientRect();
      const toolbar = selectionActions.getBoundingClientRect();
      const point = selectionToolbarPoint(candidate.rect, toolbar, dock);
      selectionActions.style.left = `${Math.round(point.x)}px`;
      selectionActions.style.top = `${Math.round(point.y)}px`;
    };

    const refreshSelectionActions = () => {
      if (selectingFeedback || selectionActions.matches(':focus-within')) return;
      showSelectionActions(feedbackSelectionCandidate(getSelection()));
    };

    const writeClipboardText = async value => {
      const text = String(value || '');
      if (!text) return false;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* the selection-preserving fallback remains available */ }
      if (typeof document.execCommand !== 'function') return false;
      const active = document.activeElement;
      const activeSelection = active && typeof active.selectionStart === 'number'
        ? [active.selectionStart, active.selectionEnd, active.selectionDirection] : null;
      const selection = getSelection();
      const ranges = selection
        ? Array.from({ length: selection.rangeCount }, (_, index) => selection.getRangeAt(index).cloneRange())
        : [];
      const field = document.createElement('textarea');
      field.value = text;
      field.readOnly = true;
      field.setAttribute('aria-hidden', 'true');
      Object.assign(field.style, { position: 'fixed', opacity: '0', pointerEvents: 'none' });
      document.body.appendChild(field);
      field.select();
      let copied = false;
      try { copied = Boolean(document.execCommand('copy')); } catch (_) { copied = false; }
      field.remove();
      if (active && typeof active.focus === 'function') {
        active.focus({ preventScroll: true });
        if (activeSelection && typeof active.setSelectionRange === 'function') {
          active.setSelectionRange(...activeSelection);
        }
      }
      if (selection) {
        selection.removeAllRanges();
        for (const range of ranges) selection.addRange(range);
      }
      return copied;
    };

    const copyFeedbackText = async (text, kind) => {
      if (await writeClipboardText(text)) {
        notify(kind === 'selection' ? 'Selected text copied.' : 'Response copied.');
        return;
      }
      notify('Copy was unavailable. Select the text and press ⌘C.');
    };

    const askAIAboutSelectedFeedback = () => {
      const selected = selectedFeedback && selectedFeedback.text;
      if (!selected) return;
      const drafted = composeAskAIDraft(
        composer.value,
        selected,
        Number(composer.maxLength) || 12000,
      );
      if (!drafted.inserted) {
        notify('The message draft is full. Copy the selection or shorten the draft first.');
        return;
      }
      composer.value = drafted.value;
      hideSelectionActions(true);
      const selection = getSelection();
      if (selection) selection.removeAllRanges();
      resizeComposer();
      openChat(false);
      if (shell && typeof shell.focusPetWindow === 'function') shell.focusPetWindow();
      requestAnimationFrame(() => {
        composer.focus({ preventScroll: true });
        composer.setSelectionRange(composer.value.length, composer.value.length);
      });
      notify(drafted.truncated
        ? 'Selection shortened to fit. Add your question, then send.'
        : 'Selection added. Add your question, then send.');
    };

    const responseActionButton = (label, title, pathData, handler) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'response-action';
      button.setAttribute('aria-label', label);
      button.title = title;
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      icon.appendChild(path);
      button.appendChild(icon);
      button.addEventListener('click', handler);
      return button;
    };

    let lastControlPacket = '';
    function reportControlRects(force = false) {
      if (!shell || typeof shell.setPetControlRects !== 'function') return;
      const rects = [];
      for (const element of controlElements()) {
        if (!element) continue;
        const box = element.getBoundingClientRect();
        if (box.width > 0 && box.height > 0) rects.push({ x: Math.floor(box.left), y: Math.floor(box.top), w: Math.ceil(box.width), h: Math.ceil(box.height) });
      }
      const packet = JSON.stringify(rects);
      if (force || packet !== lastControlPacket) {
        lastControlPacket = packet;
        shell.setPetControlRects(rects);
      }
    }

    const avatarLocalPoint = point => {
      const geometry = lastBodyGeometry;
      if (!geometry || !paintedAvatarAt({ ...point, inside: true })) return null;
      let x = (point.x - geometry.fit.x) / geometry.fit.scale;
      let y = (point.y - geometry.fit.y) / geometry.fit.scale;
      const dx = x - geometry.pivotX;
      const dy = y - geometry.pivotY;
      const cosine = Math.cos(-geometry.sway);
      const sine = Math.sin(-geometry.sway);
      x = (dx * cosine - dy * sine) / geometry.breathe + geometry.pivotX;
      y = dx * sine + dy * cosine + geometry.pivotY;
      return { x, y };
    };

    const pointOnHead = point => {
      if (!lastBodyGeometry) return true;
      const geometry = lastBodyGeometry;
      const local = avatarLocalPoint(point);
      if (!local) return false;
      const face = geometry.metadata && geometry.metadata.alignment && geometry.metadata.alignment.face_bounds;
      if (!Array.isArray(face)) return !geometry.hasBody;
      const margin = face[2] * .45;
      return local.x >= face[0] - margin && local.x <= face[0] + face[2] + margin
        && local.y >= face[1] - face[3] * .7 && local.y <= face[1] + face[3] * 1.3;
    };

    const avatarBodyDoubleClickAction = (local, geometry) => {
      if (!local || !geometry) return null;
      const face = geometry.metadata && geometry.metadata.alignment
        && geometry.metadata.alignment.face_bounds;
      if (!geometry.hasBody || !Array.isArray(face) || face.length < 4) return 'move';
      const headMargin = Number(face[2]) * .45;
      if (local.x >= Number(face[0]) - headMargin
          && local.x <= Number(face[0]) + Number(face[2]) + headMargin
          && local.y >= Number(face[1]) - Number(face[3]) * .7
          && local.y <= Number(face[1]) + Number(face[3]) * 1.3) return 'move';
      const rawBounds = geometry.metadata && geometry.metadata.bounds;
      const bounds = Array.isArray(rawBounds) && rawBounds.length >= 4
        ? rawBounds.map(Number) : [0, 0, geometry.width, geometry.height];
      if (!(bounds[2] > 0 && bounds[3] > 0)) return null;
      const horizontal = (local.x - bounds[0]) / bounds[2];
      const vertical = (local.y - bounds[1]) / bounds[3];
      if (horizontal >= .20 && horizontal <= .80 && vertical >= .20 && vertical < .48) {
        return 'opacity-up';
      }
      // The lower calf/foot zone owns Opacity −. The upper leg remains the
      // non-conflicting Horizon Walk gesture advertised by the pet menu.
      if (vertical >= .76 && vertical <= 1.04) return 'opacity-down';
      if (vertical >= .48 && vertical < .76) return 'walk';
      return null;
    };

    const avatarDoubleClickActionAt = point => avatarBodyDoubleClickAction(
      avatarLocalPoint(point), lastBodyGeometry);

    const steppedAvatarOpacity = (current, direction) => {
      const value = Number.isFinite(Number(current)) ? Number(current) : 1;
      const delta = direction > 0 ? .12 : -.12;
      return Math.round(Math.max(.15, Math.min(1, value + delta)) * 100) / 100;
    };

    const addMessage = (role, text, options = {}) => {
      const row = document.createElement('div');
      row.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.dir = 'auto';
      bubble.textContent = String(text || '');
      row.appendChild(bubble);
      if (role === 'assistant' && text && options.readable !== false) {
        const actions = document.createElement('div');
        actions.className = 'response-actions';
        actions.setAttribute('role', 'group');
        actions.setAttribute('aria-label', 'Response actions');
        const copy = responseActionButton(
          'Copy this response',
          'Copy response',
          'M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z',
          () => copyFeedbackText(String(text), 'response'),
        );
        copy.classList.add('copy-button');
        const read = responseActionButton(
          'Read this response aloud',
          'Read aloud',
          'M3 9v6h4l5 4V5L7 9H3zm12.5 3a3.5 3.5 0 0 0-1.5-2.9v5.8a3.5 3.5 0 0 0 1.5-2.9zm0-7.1v2.2a6 6 0 0 1 0 9.8v2.2a8 8 0 0 0 0-14.2z',
          () => readAloud(String(text)),
        );
        read.classList.add('read-button');
        actions.append(copy, read);
        row.appendChild(actions);
      }
      conversation.appendChild(row);
      conversation.scrollTop = conversation.scrollHeight;
      return { row, bubble };
    };

    const addWorking = () => {
      const item = addMessage('assistant', '•••', { readable: false });
      item.row.classList.add('working');
      thinkingNode = item.row;
    };

    const removeWorking = () => {
      if (thinkingNode && thinkingNode.isConnected) thinkingNode.remove();
      thinkingNode = null;
    };

    const appendMedia = async cards => {
      for (const card of Array.isArray(cards) ? cards : []) {
        if (!card || typeof card.url !== 'string' || !card.url.startsWith('api/generated/')) continue;
        const wrapper = document.createElement('div');
        wrapper.className = 'media-card';
        const label = document.createElement('div');
        label.className = 'media-name';
        label.textContent = String(card.name || 'Generated media');
        try {
          const response = await fetch(card.url, { cache: 'no-store' });
          if (!response.ok) throw new Error('media unavailable');
          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const element = blob.type.startsWith('video/') ? document.createElement('video') : document.createElement('img');
          if (element instanceof HTMLVideoElement) { element.controls = true; element.playsInline = true; }
          element.src = url;
          element.addEventListener(element instanceof HTMLVideoElement ? 'loadeddata' : 'load',
            () => URL.revokeObjectURL(url), { once: true });
          wrapper.append(element, label);
        } catch (_) {
          label.textContent = `${label.textContent} · unavailable`;
          wrapper.append(label);
        }
        conversation.appendChild(wrapper);
      }
      conversation.scrollTop = conversation.scrollHeight;
    };

    const ensureAudioGraph = () => {
      audioContext = audioContext || new AudioContext();
      if (!audioAnalyser) {
        audioAnalyser = audioContext.createAnalyser();
        audioAnalyser.fftSize = 1024;
        audioAnalyser.smoothingTimeConstant = .38;
        // Keep the metering graph renderable without letting its second branch
        // reach the speakers. Speech and LiveKit each retain exactly one audible
        // output path below.
        audioMonitorGain = audioContext.createGain();
        audioMonitorGain.gain.value = 0;
        audioAnalyser.connect(audioMonitorGain);
        audioMonitorGain.connect(audioContext.destination);
      }
      if (audioContext.state !== 'running') audioContext.resume().catch(() => {});
      return audioContext;
    };

    const stopSpeech = () => {
      if (speechSource) { try { speechSource.stop(); } catch (_) { /* already ended */ } }
      speechSource = null;
      speechTrack = [];
      speechTrackIndex = 0;
      currentViseme = 'sil';
      reactiveMouthState.viseme = 'sil';
      reactiveMouthState.audibleUntil = 0;
    };

    const playSpeech = async (base64, track = []) => {
      if (!base64) return;
      stopSpeech();
      const graph = ensureAudioGraph();
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      const buffer = await graph.decodeAudioData(bytes.buffer.slice(0));
      const source = graph.createBufferSource();
      source.buffer = buffer;
      source.connect(audioAnalyser);
      source.connect(graph.destination);
      speechSource = source;
      speechTrack = stabiliseTrack(
        track,
        buffer.duration,
        manifest && Array.isArray(manifest.visemes) ? manifest.visemes : [],
      );
      speechTrackIndex = 0;
      speechStart = graph.currentTime;
      source.onended = () => {
        if (speechSource === source) {
          speechSource = null;
          speechTrack = [];
          currentViseme = 'sil';
          setStatus(live ? 'Live Talk · connected' : 'Ready', live ? 'live' : 'good');
        }
      };
      source.start();
      setStatus('Speaking', 'good');
    };

    async function readAloud(text) {
      if (live) {
        notify('Hang up Live Talk before playing a separate read-aloud voice.');
        return;
      }
      try {
        setStatus('Preparing voice…', 'busy');
        const result = await postJSON('/say', { text });
        if (result.audio) await playSpeech(result.audio, result.track || []);
        else throw new Error(result.error || 'No audio was returned');
      } catch (error) {
        notify(`Could not read aloud: ${String(error.message || error).slice(0, 120)}`);
        setStatus('Ready', 'good');
      }
    }

    async function submitTurn(text) {
      const value = String(text || '').trim();
      if (!value || turnController || avatarOnlyMotion) return;
      if (live) {
        notify('Hang up Live Talk before sending a regular chat message.');
        return;
      }
      stopSpeech();
      openChat(false);
      addMessage('user', value, { readable: false });
      history.push({ role: 'user', content: value });
      addWorking();
      turnController = new AbortController();
      sendButton.disabled = true;
      pttButton.disabled = true;
      setStatus('Thinking…', 'busy');
      try {
        const result = await postJSON('/reply', { history }, turnController.signal);
        removeWorking();
        const answer = String(result.text || 'I lost that thought. Please try again.');
        addMessage('assistant', answer);
        history.push({ role: 'assistant', content: answer });
        if (history.length > 24) history.splice(0, history.length - 24);
        await appendMedia(result.media);
        if (result.audio) await playSpeech(result.audio, result.track || []);
        else setStatus('Ready', 'good');
      } catch (error) {
        removeWorking();
        if (error.name !== 'AbortError') {
          const message = `I could not answer: ${String(error.message || error).slice(0, 150)}`;
          addMessage('assistant', message, { readable: false });
          setStatus('Check model settings', '');
        }
      } finally {
        turnController = null;
        pttButton.disabled = Boolean(live);
        sendButton.disabled = !composer.value.trim();
      }
    }

    const submitComposer = () => {
      if (avatarOnlyMotion) return;
      const value = composer.value.trim();
      if (!value) return;
      if (live) {
        notify('Hang up Live Talk before sending a regular chat message.');
        return;
      }
      composer.value = '';
      resizeComposer();
      submitTurn(value);
    };

    const resizeComposer = () => {
      composer.style.height = '40px';
      composer.style.height = `${Math.min(112, Math.max(40, composer.scrollHeight))}px`;
      sendButton.disabled = !composer.value.trim() || Boolean(turnController) || Boolean(live);
      reportControlRects(true);
    };

    const recordingMime = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(type => MediaRecorder.isTypeSupported(type)) || '';

    async function startRecording() {
      if (avatarOnlyMotion || ptt || live || turnController) return;
      stopSpeech();
      openChat(false);
      markActivity();
      const session = { released: false, chunks: [], started: performance.now(), stream: null, recorder: null, meterContext: null, analyser: null };
      ptt = session;
      root.classList.add('recording');
      pttButton.classList.add('recording');
      pttButton.setAttribute('aria-label', 'Release to transcribe');
      setStatus('Listening…', 'live');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
        if (ptt !== session || session.released) { stream.getTracks().forEach(track => track.stop()); finishRecordingUI(); return; }
        session.stream = stream;
        session.meterContext = new AudioContext();
        session.analyser = session.meterContext.createAnalyser();
        session.analyser.fftSize = 512;
        session.meterContext.createMediaStreamSource(stream).connect(session.analyser);
        const type = recordingMime();
        session.recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
        session.recorder.ondataavailable = event => { if (event.data && event.data.size) session.chunks.push(event.data); };
        session.recorder.onstop = () => transcribeRecording(session);
        session.recorder.start(180);
      } catch (error) {
        if (ptt === session) ptt = null;
        finishRecordingUI();
        notify(`Microphone unavailable: ${String(error.message || error).slice(0, 110)}`);
        setStatus('Ready', 'good');
      }
    }

    function stopRecording(cancel = false) {
      const session = ptt;
      if (!session) return;
      session.released = true;
      session.cancelled = cancel;
      if (session.recorder && session.recorder.state !== 'inactive') session.recorder.stop();
      else if (!session.stream) {
        ptt = null;
        finishRecordingUI();
      }
    }

    const finishRecordingUI = () => {
      root.classList.remove('recording');
      pttButton.classList.remove('recording');
      pttButton.setAttribute('aria-label', 'Hold to talk');
      recordingClock.textContent = '0:00.0';
      recordingBars.forEach(bar => { bar.style.height = '3px'; });
      reportControlRects(true);
    };

    async function transcribeRecording(session) {
      if (ptt === session) ptt = null;
      finishRecordingUI();
      if (session.stream) session.stream.getTracks().forEach(track => track.stop());
      if (session.meterContext) session.meterContext.close().catch(() => {});
      if (session.cancelled || performance.now() - session.started < 220 || !session.chunks.length) {
        setStatus('Ready', 'good');
        return;
      }
      setStatus('Transcribing…', 'busy');
      try {
        const blob = new Blob(session.chunks, { type: session.recorder && session.recorder.mimeType || 'audio/webm' });
        const form = new FormData();
        form.append('audio', blob, blob.type.includes('mp4') ? 'take.m4a' : 'take.webm');
        const result = await fetch('/stt', { method: 'POST', body: form }).then(safeJSON);
        const heard = String(result.text || '').trim();
        if (!heard) throw new Error(result.error || 'I did not catch that');
        await submitTurn(heard);
      } catch (error) {
        notify(`Could not transcribe: ${String(error.message || error).slice(0, 120)}`);
        setStatus('Ready', 'good');
      }
    }

    const updateRecordingMeter = now => {
      if (!ptt) return;
      const elapsed = Math.max(0, (now - ptt.started) / 1000);
      recordingClock.textContent = `${Math.floor(elapsed / 60)}:${(elapsed % 60).toFixed(1).padStart(4, '0')}`;
      let level = 0;
      if (ptt.analyser) {
        const samples = new Uint8Array(ptt.analyser.fftSize);
        ptt.analyser.getByteTimeDomainData(samples);
        let sum = 0;
        for (const sample of samples) { const value = (sample - 128) / 128; sum += value * value; }
        level = Math.min(1, Math.sqrt(sum / samples.length) * 7);
      }
      recordingBars.forEach((bar, index) => {
        const shape = .38 + .62 * Math.sin(Math.PI * (index + .5) / recordingBars.length);
        bar.style.height = `${Math.round(3 + level * 13 * shape)}px`;
      });
    };

    const EMAIL_RPC = 'openclam.prepareEmailDraft.v1';
    const MAX_RPC_BYTES = 12000;
    const utf8Size = value => new TextEncoder().encode(String(value || '')).length;
    const canonicalWords = value => String(value || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
    const containsWord = (value, term) => (` ${value} `).includes(` ${term} `);
    const looksQuoted = value => {
      const text = String(value || '').trim();
      if (!text) return false;
      const edgeQuotes = new Set(['"', "'", '`', '>', '«', '»', '‘', '’', '“', '”']);
      if (edgeQuotes.has(text[0]) || edgeQuotes.has(text[text.length - 1])) return true;
      return (text.match(/"/g) || []).length >= 2 || (text.match(/`/g) || []).length >= 2;
    };

    const explicitEmailRequest = (value, recipientName) => {
      let request = canonicalWords(value);
      const recipient = canonicalWords(recipientName);
      if (!request || !recipient || looksQuoted(value)) return false;
      const followups = new Set(['approve', 'approve it', 'confirm', 'confirm it', 'do it', 'go ahead', 'ok send it', 'okay send it', 'send', 'send it', 'yes', 'yes send it']);
      if (followups.has(request)) return false;
      const blocked = [
        'can t', 'cannot', 'do not', 'don t', 'dont', 'must not', 'mustn t',
        'never', 'should not', 'shouldn t', 'won t', 'asked', 'avoid', 'cancel',
        'check', 'drafted', 'emailed', 'find', 'forwarded', 'mentioned', 'no',
        'not', 'open', 'pasted', 'prepared', 'quoted', 'read', 'received',
        'reported', 'said', 'says', 'search', 'sent', 'show', 'stop',
        'summarise', 'summarize', 'told', 'wrote',
      ];
      if (blocked.some(term => containsWord(request, term))) return false;
      for (const prefix of ['please would you', 'please could you', 'please can you', 'would you', 'could you', 'i want to', 'i need to', 'i d like to', 'will you', 'help me', 'please', 'let s', 'can you', 'lets']) {
        if (request.startsWith(`${prefix} `)) { request = request.slice(prefix.length + 1); break; }
      }
      const candidates = [`email ${recipient}`, `email to ${recipient}`];
      for (const action of ['compose', 'create', 'draft', 'prepare', 'send', 'write']) {
        candidates.push(`${action} an email to ${recipient}`, `${action} a email to ${recipient}`, `${action} email to ${recipient}`, `${action} an email for ${recipient}`, `${action} a email for ${recipient}`, `${action} email for ${recipient}`, `${action} ${recipient} an email`, `${action} ${recipient} a email`, `${action} ${recipient} email`);
      }
      return candidates.some(candidate => request === candidate || request.startsWith(`${candidate} `));
    };

    const exactObject = (value, keys) => value && typeof value === 'object' && !Array.isArray(value)
      && Object.keys(value).sort().join('|') === keys.slice().sort().join('|');

    const parseEmailRequest = payload => {
      if (typeof payload !== 'string' || utf8Size(payload) > MAX_RPC_BYTES) return null;
      let rootValue;
      try { rootValue = JSON.parse(payload); } catch (_) { return null; }
      if (!exactObject(rootValue, ['schema_version', 'request_id', 'spoken_request', 'tool'])
          || !exactObject(rootValue.tool, ['name', 'arguments'])
          || !exactObject(rootValue.tool.arguments, ['recipient_name', 'subject', 'body'])) return null;
      const values = rootValue.tool.arguments;
      if (rootValue.schema_version !== 1 || rootValue.tool.name !== 'prepare_email_draft'
          || !/^[0-9a-f]{64}$/.test(rootValue.request_id)
          || ![rootValue.spoken_request, values.recipient_name, values.subject, values.body].every(item => typeof item === 'string')
          || !rootValue.spoken_request.trim() || utf8Size(rootValue.spoken_request) > 8000
          || !values.recipient_name.trim() || [...values.recipient_name].length > 320
          || [...values.subject].length > 240 || utf8Size(values.body) > 6000
          || !explicitEmailRequest(rootValue.spoken_request, values.recipient_name)) return null;
      return { request_id: rootValue.request_id, spoken_request: rootValue.spoken_request, recipient_name: values.recipient_name, subject: values.subject, body: values.body };
    };

    const emailDraftText = (recipient, subject, body) => [
      'Unsent email draft',
      `To: ${String(recipient || '')}`,
      `Subject: ${String(subject || '')}`,
      '',
      String(body || ''),
    ].join('\n');

    const retainEmailDraft = (historyEntries, recipient, subject, body, limit = 24) => {
      const content = emailDraftText(recipient, subject, body);
      historyEntries.push({ role: 'assistant', content });
      if (historyEntries.length > limit) historyEntries.splice(0, historyEntries.length - limit);
      return content;
    };

    const closeEmailReview = () => {
      const state = emailReviewState;
      const panel = state && state.panel ? state.panel : document.querySelector('.email-review');
      if (panel) panel.remove();
      if (state) {
        for (const entry of state.background) {
          if (!entry.element.isConnected) continue;
          entry.element.inert = entry.inert || (avatarOnlyMotion && motionChrome.includes(entry.element));
        }
      }
      emailReviewState = null;
      if (live) live.pendingDraft = null;
      reportControlRects(true);
      const previousFocus = state && state.previousFocus;
      if (!avatarOnlyMotion && previousFocus && previousFocus.isConnected && !previousFocus.inert) {
        requestAnimationFrame(() => previousFocus.focus({ preventScroll: true }));
      }
    };

    const presentEmailReview = request => {
      if (document.querySelector('.email-review')) return 'busy';
      openChat(false);
      const panel = document.createElement('section');
      panel.className = 'email-review';
      panel.setAttribute('role', 'dialog');
      panel.setAttribute('aria-modal', 'true');
      panel.setAttribute('aria-labelledby', 'emailReviewTitle');
      panel.inert = avatarOnlyMotion;
      const title = document.createElement('h2');
      title.id = 'emailReviewTitle';
      title.textContent = 'Review email draft';
      const warning = document.createElement('div');
      warning.className = 'unsent';
      warning.textContent = 'Unsent · this draft stays on screen until you copy it or keep it in the conversation.';
      panel.append(title, warning);
      const makeField = (labelText, value, multiline) => {
        const label = document.createElement('label');
        label.append(document.createTextNode(labelText));
        const input = document.createElement(multiline ? 'textarea' : 'input');
        input.value = value;
        input.dir = 'auto';
        input.autocomplete = 'off';
        input.maxLength = multiline ? 6000 : labelText === 'Recipient' ? 320 : 240;
        label.append(input);
        panel.append(label);
        return input;
      };
      const recipient = makeField('Recipient', request.recipient_name, false);
      const subject = makeField('Subject', request.subject, false);
      const body = makeField('Message', request.body, true);
      const actions = document.createElement('div');
      actions.className = 'email-actions';
      const keep = document.createElement('button');
      keep.type = 'button';
      keep.textContent = 'Keep in chat';
      keep.addEventListener('click', () => {
        const retained = retainEmailDraft(history, recipient.value, subject.value, body.value);
        closeEmailReview();
        addMessage('assistant', retained);
        openChat(false);
        notify('Unsent draft kept in this conversation.');
      });
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.textContent = 'Copy draft';
      copy.addEventListener('click', async () => {
        const text = [`To: ${recipient.value}`, `Subject: ${subject.value}`, '', body.value].join('\n');
        try {
          await navigator.clipboard.writeText(text);
          copy.textContent = 'Copied';
        } catch (_) { copy.textContent = 'Copy failed'; }
        setTimeout(() => { if (copy.isConnected) copy.textContent = 'Copy draft'; }, 1500);
      });
      actions.append(keep, copy);
      panel.append(actions);
      document.body.append(panel);
      const previousFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      const background = [...document.body.children]
        .filter(element => element !== panel && element instanceof HTMLElement)
        .map(element => ({ element, inert: element.inert }));
      for (const entry of background) entry.element.inert = true;
      emailReviewState = { panel, background, previousFocus };
      panel.addEventListener('keydown', event => {
        if (event.code === 'Space') event.stopPropagation();
        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopPropagation();
          closeEmailReview();
          return;
        }
        if (event.key !== 'Tab') return;
        const focusable = [...panel.querySelectorAll('input, textarea, button:not([disabled])')]
          .filter(element => !element.inert && element.getClientRects().length);
        if (!focusable.length) { event.preventDefault(); return; }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      });
      panel.addEventListener('keyup', event => {
        if (event.code === 'Space') event.stopPropagation();
      });
      if (live) live.pendingDraft = panel;
      reportControlRects(true);
      if (!avatarOnlyMotion) recipient.focus();
      return 'presented_for_review';
    };

    const trustedAgents = room => [...room.remoteParticipants.values()].filter(participant => participant.isAgent);

    const trustedEmailInvocation = (session, invocation, timeout) => {
      const agents = trustedAgents(session.room);
      return live === session && session.agentReady && document.visibilityState === 'visible'
        && agents.length === 1 && agents[0].identity === invocation.callerIdentity
        && Number.isFinite(timeout) && timeout >= 1000 && timeout <= 20000;
    };

    const waitForMatchingFinalUserTurn = async (session, spokenRequest, timeout) => {
      const expected = canonicalWords(spokenRequest);
      if (!expected) return false;
      const deadline = performance.now() + Math.min(5000, Math.max(0, timeout - 1500));
      do {
        if (live !== session) return false;
        if (canonicalWords(session.latestFinalUserTranscript) === expected) return true;
        await new Promise(resolve => setTimeout(resolve, 25));
      } while (performance.now() < deadline);
      return canonicalWords(session.latestFinalUserTranscript) === expected;
    };

    const appendFinalUserTurnSegment = (session, text) => {
      if (!session.userTurnOpen) {
        session.finalUserTurnSegments = [];
        session.userTurnOpen = true;
      }
      session.finalUserTurnSegments.push(text);
      session.latestFinalUserTranscript = session.finalUserTurnSegments.join(' ');
      return session.latestFinalUserTranscript;
    };

    const handleEmailRPC = async (session, invocation) => {
      const answer = status => JSON.stringify({ schema_version: 1, status });
      const timeout = Number(invocation.responseTimeout);
      if (!trustedEmailInvocation(session, invocation, timeout)) return answer('rejected');
      const request = parseEmailRequest(invocation.payload);
      if (!request || !await waitForMatchingFinalUserTurn(session, request.spoken_request, timeout)
          || !trustedEmailInvocation(session, invocation, timeout)) return answer('rejected');
      if (session.replayedEmailRequests.has(request.request_id)) return answer('rejected');
      session.replayedEmailRequests.add(request.request_id);
      while (session.replayedEmailRequests.size > 64) {
        session.replayedEmailRequests.delete(session.replayedEmailRequests.values().next().value);
      }
      return answer(presentEmailReview(request));
    };

    const setLiveButton = state => {
      liveButton.dataset.state = state;
      const label = state === 'connected' ? 'Hang up Live Talk' : state === 'connecting' ? 'Cancel Live Talk call' : 'Start Live Talk';
      liveButton.setAttribute('aria-label', label);
      liveButton.title = label;
    };

    const startConnectionSound = session => {
      if (session.ringtone) return;
      const ringtone = new Audio('/live-talk-connection.wav');
      ringtone.loop = true;
      ringtone.volume = .5;
      session.ringtone = ringtone;
      ringtone.play().catch(() => {});
    };

    const stopConnectionSound = session => {
      if (!session || !session.ringtone) return;
      session.ringtone.pause();
      session.ringtone.currentTime = 0;
      session.ringtone = null;
    };

    function waitForSoleAgent(session, status = 'Live Talk · waiting for agent…') {
      if (live !== session) return;
      session.agentReady = false;
      session.remoteAudioState = makeLiveTalkAudioState();
      agentSpeaking = false;
      currentViseme = 'sil';
      clearTimeout(session.guard);
      setLiveButton('connecting');
      startConnectionSound(session);
      setStatus(status, 'busy');
      session.guard = setTimeout(() => {
        if (live === session) {
          notify('The Live Talk agent did not return. Try again.');
          stopLiveTalk('timeout');
        }
      }, 30000);
    }

    function markAgentReady(session) {
      if (live !== session) return;
      const agents = trustedAgents(session.room);
      if (agents.length > 1) {
        notify('Live Talk ended because more than one agent joined the call.');
        stopLiveTalk('error');
        return;
      }
      if (agents.length === 0) {
        waitForSoleAgent(session);
        return;
      }
      session.agentReady = true;
      session.remoteAudioState = makeLiveTalkAudioState();
      clearTimeout(session.guard);
      stopConnectionSound(session);
      setLiveButton('connected');
      pttButton.disabled = true;
      sendButton.disabled = true;
      setStatus('Live Talk · connected', 'live');
      openChat(false);
      if (shell && typeof shell.setLiveTalk === 'function') shell.setLiveTalk(true);
    }

    const handleTranscript = (session, segments, participant) => {
      if (live !== session || !participant) return;
      const role = participant.isAgent ? 'assistant' : 'user';
      for (const segment of segments || []) {
        const text = String(segment.text || '').trim();
        if (!text) continue;
        if (segment.final) {
          const key = `${role}:${String(segment.id || text)}`;
          if (session.finalTranscriptIDs.has(key)) continue;
          session.finalTranscriptIDs.add(key);
          if (role === 'user') {
            appendFinalUserTurnSegment(session, text);
          } else {
            session.userTurnOpen = false;
          }
          addMessage(role, text, { readable: role === 'assistant' });
          openChat(false);
        } else if (role === 'user') {
          setStatus(`Hearing “${text.slice(0, 54)}”`, 'live');
        }
      }
    };

    const releaseAgentAudioAttachment = attachment => {
      if (!attachment) return;
      try { attachment.track.detach(attachment.element); } catch (_) { /* already detached */ }
      try { attachment.source.disconnect(); } catch (_) { /* already disconnected */ }
      try { attachment.element.pause(); } catch (_) { /* already paused */ }
      attachment.element.srcObject = null;
      attachment.element.remove();
    };

    const attachAgentAudio = (session, track, participant) => {
      if (live !== session || !participant || !participant.isAgent || !track.mediaStreamTrack) return;
      const graph = ensureAudioGraph();
      const key = track.sid || track.mediaStreamTrack.id;
      const previous = session.audioAttachments.get(key);
      if (previous) {
        releaseAgentAudioAttachment(previous);
        session.audioAttachments.delete(key);
      }
      const element = document.createElement('audio');
      element.autoplay = true;
      element.hidden = true;
      element.setAttribute('aria-hidden', 'true');
      let source = null;
      try {
        // LiveKit owns the attached element, autoplay recovery, and the sole
        // audible output. Meter the remote WebRTC track through the Web Audio
        // primitive intended for MediaStreams; a MediaElement source created
        // before LiveKit assigns srcObject can remain silent in Chromium.
        document.body.append(element);
        track.attach(element);
        const stream = new MediaStream([track.mediaStreamTrack]);
        source = graph.createMediaStreamSource(stream);
        source.connect(audioAnalyser);
        session.audioAttachments.set(key, { track, element, source, stream });
        void roomAudioReady(session);
      } catch (_) {
        releaseAgentAudioAttachment({ track, element, source });
        notify('Live Talk audio could not start. End the call and try again.');
        if (live === session && !session.ending) stopLiveTalk('error');
      }
    };

    const roomAudioReady = session => {
      if (live !== session || session.ending) return Promise.resolve(false);
      if (session.audioStartPromise) return session.audioStartPromise;
      session.audioStartPromise = (async () => {
        try {
          const graph = ensureAudioGraph();
          if (graph.state !== 'running') await graph.resume();
          await session.room.startAudio();
          if (graph.state !== 'running') throw new Error('audio_context_suspended');
          return true;
        } catch (_) {
          if (live === session && !session.ending) {
            notify('Live Talk speaker playback was blocked. Start the call again to enable audio.');
            stopLiveTalk('error');
          }
          return false;
        } finally {
          session.audioStartPromise = null;
        }
      })();
      return session.audioStartPromise;
    };

    async function startLiveTalk() {
      if (live) { stopLiveTalk('ended'); return; }
      if (ptt || turnController) { notify('Finish the current voice or chat turn before starting Live Talk.'); return; }
      const library = window.LivekitClient;
      if (!library || !library.Room) { notify('Live Talk is unavailable in this build.'); return; }
      stopSpeech();
      const session = {
        room: new library.Room({ adaptiveStream: true, dynacast: true }),
        agentReady: false,
        finalTranscriptIDs: new Set(),
        finalUserTurnSegments: [],
        userTurnOpen: false,
        latestFinalUserTranscript: '',
        replayedEmailRequests: new Set(),
        audioAttachments: new Map(),
        remoteAudioState: makeLiveTalkAudioState(),
        audioStartPromise: null,
        pendingDraft: null,
        ending: false,
        ringtone: null,
      };
      live = session;
      ensureAudioGraph();
      setLiveButton('connecting');
      pttButton.disabled = true;
      sendButton.disabled = true;
      setStatus('Calling Live Talk…', 'busy');
      startConnectionSound(session);
      openChat(false);
      if (shell && typeof shell.setLiveTalk === 'function') shell.setLiveTalk(true);
      session.guard = setTimeout(() => {
        if (live === session) {
          notify('The Live Talk agent did not answer. Try again.');
          stopLiveTalk('timeout');
        }
      }, 30000);

      const room = session.room;
      room.registerRpcMethod(EMAIL_RPC, invocation => handleEmailRPC(session, invocation));
      room.on(library.RoomEvent.ParticipantConnected, participant => {
        if (participant.isAgent) markAgentReady(session);
      });
      room.on(library.RoomEvent.ParticipantDisconnected, participant => {
        if (participant.isAgent) markAgentReady(session);
      });
      room.on(library.RoomEvent.TrackSubscribed, (track, _publication, participant) => {
        if (track.kind === library.Track.Kind.Audio) attachAgentAudio(session, track, participant);
      });
      room.on(library.RoomEvent.TrackUnsubscribed, track => {
        const key = track.sid || (track.mediaStreamTrack && track.mediaStreamTrack.id);
        const attachment = session.audioAttachments.get(key);
        if (attachment) {
          releaseAgentAudioAttachment(attachment);
          session.audioAttachments.delete(key);
          if (!session.audioAttachments.size) {
            session.remoteAudioState = makeLiveTalkAudioState();
            if (live === session && session.agentReady && !session.ending) setStatus('Live Talk · connected', 'live');
          }
        }
      });
      room.on(library.RoomEvent.AudioPlaybackStatusChanged, canPlay => {
        if (live === session && !session.ending && !canPlay) roomAudioReady(session);
      });
      room.on(library.RoomEvent.TranscriptionReceived, (segments, participant) => handleTranscript(session, segments, participant));
      room.on(library.RoomEvent.ActiveSpeakersChanged, participants => {
        if (live !== session) return;
        agentSpeaking = participants.some(participant => participant.isAgent);
      });
      room.on(library.RoomEvent.Reconnecting, () => {
        if (live !== session) return;
        session.agentReady = false;
        session.remoteAudioState = makeLiveTalkAudioState();
        setLiveButton('connecting');
        startConnectionSound(session);
        setStatus('Live Talk · reconnecting…', 'busy');
        clearTimeout(session.guard);
        session.guard = setTimeout(() => {
          if (live === session) {
            notify('Live Talk could not restore the connection.');
            stopLiveTalk('timeout');
          }
        }, 30000);
      });
      room.on(library.RoomEvent.Reconnected, () => {
        if (live !== session) return;
        markAgentReady(session);
      });
      room.on(library.RoomEvent.Disconnected, () => { if (live === session && !session.ending) stopLiveTalk('ended'); });

      try {
        const connection = await fetch('/api/livekit/session', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Cache-Control': 'no-store' },
        }).then(safeJSON);
        if (live !== session) return;
        await room.connect(connection.server_url, connection.participant_token);
        if (live !== session) { room.disconnect().catch(() => {}); return; }
        if (!await roomAudioReady(session) || live !== session) return;
        await room.localParticipant.setMicrophoneEnabled(true);
        markAgentReady(session);
      } catch (error) {
        if (live === session) {
          notify(liveTalkConnectionError(error));
          stopLiveTalk('error');
        }
      }
    }

    function stopLiveTalk(reason) {
      const session = live;
      live = null;
      if (!session) return;
      session.ending = true;
      clearTimeout(session.guard);
      stopConnectionSound(session);
      agentSpeaking = false;
      currentViseme = 'sil';
      reactiveMouthState.viseme = 'sil';
      reactiveMouthState.audibleUntil = 0;
      for (const attachment of session.audioAttachments.values()) releaseAgentAudioAttachment(attachment);
      session.audioAttachments.clear();
      try { session.room.unregisterRpcMethod(EMAIL_RPC); } catch (_) { /* no registration */ }
      session.room.localParticipant.setMicrophoneEnabled(false).catch(() => {});
      session.room.disconnect().catch(() => {});
      // An unsent draft is useful after the call ends; keep its visible review
      // card until the user explicitly copies or dismisses it.
      setLiveButton('idle');
      pttButton.disabled = Boolean(turnController);
      if (shell && typeof shell.setLiveTalk === 'function') shell.setLiveTalk(false);
      setStatus(reason === 'timeout' ? 'Live Talk did not answer' : reason === 'error' ? 'Live Talk unavailable' : 'Ready', reason === 'error' || reason === 'timeout' ? '' : 'good');
      resizeComposer();
      reportControlRects(true);
    }

    const toggleMove = () => {
      if (!motion.move) { notify('Build a Moves clip in Character Studio first.'); return; }
      if (moveUntil > performance.now()) {
        moveUntil = 0;
        movesButton.classList.remove('showing');
      } else {
        const clip = motion.move;
        if (clip.video) clip.video.currentTime = 0;
        const duration = Math.max(1, Number(clip.frames || 1) / Math.max(1, Number(clip.fps || 1)));
        moveUntil = performance.now() + Math.min(12000, duration * 1000);
        movesButton.classList.add('showing');
        markActivity();
      }
    };

    const toggleWalk = async () => {
      if (!shell || typeof shell.setPetRoam !== 'function') return;
      if (!motion.walk) { notify('Build a Walk clip in Character Studio first.'); return; }
      await shell.setPetRoam(!(shellState.pet && shellState.pet.roam));
    };

    const adjustAvatarOpacity = async direction => {
      if (!shell || typeof shell.setPetOpacity !== 'function') return;
      const current = Number(shellState.pet && shellState.pet.opacity);
      const next = steppedAvatarOpacity(current, direction);
      if (Math.abs(next - current) < .001) {
        notify(direction > 0 ? 'Avatar is already fully opaque.' : 'Avatar is at minimum opacity.');
        return;
      }
      try {
        const state = await shell.setPetOpacity(next);
        applyShellState(state);
        notify(`Avatar opacity ${Math.round(next * 100)}%.`, 1800);
      } catch (_) {
        notify('Could not change avatar opacity.');
      }
    };

    const applyShellState = value => {
      if (!value || typeof value !== 'object') return;
      shellState = value;
      const pet = value.pet || {};
      root.classList.toggle('pet-mode', Boolean(pet.enabled));
      root.classList.toggle('roaming', Boolean(pet.roam));
      walkButton.setAttribute('aria-pressed', String(Boolean(pet.roam)));
      walkButton.setAttribute('aria-label', pet.roam ? 'Stop walking' : 'Start walking');
      walkButton.title = pet.roam ? 'Stop walking' : 'Start walking';
      if (motion.walk) publishMotionReadiness();
    };

    const handleGlobalPointer = point => {
      if (!point) return;
      if (!dragging) {
        const nextX = Number(point.x);
        const nextY = Number(point.y);
        const nextInside = Boolean(point.inside);
        const nextSeen = Number.isFinite(nextX) && Number.isFinite(nextY);
        const changed = nextSeen !== pointer.seen || nextInside !== pointer.inside
          || (nextSeen && (Math.abs(nextX - pointer.x) >= .5
            || Math.abs(nextY - pointer.y) >= .5));
        pointer = {
          x: nextX,
          y: nextY,
          inside: nextInside,
          seen: nextSeen,
          // Main's 250ms stationary heartbeat must not keep the renderer in
          // its fast gaze-settling lane. Only real pointer motion renews it.
          at: changed ? performance.now() : pointer.at,
        };
        if (changed) lastFrame = 0;
        updateHit(false);
        // Frozen Edge Idle paints only on a low-rate maintenance cadence.
        // Pointer IPC is already event-driven, so use it to engage/release a
        // hovered avatar immediately instead of waiting for that maintenance
        // frame.
        syncPetEngagement();
      }
    };

    const PET_ZOOM_RANGES = Object.freeze({
      stand: Object.freeze({ min: .25, max: 4 }),
      roam: Object.freeze({ min: .5, max: 3 }),
    });
    const AVATAR_ZOOM_SETTLE_MS = 140;

    const pinchZoomValue = (current, event, range, viewportHeight) => {
      const value = Number(current);
      const safe = Number.isFinite(value) && value > 0 ? value : 1;
      if (!event || !event.ctrlKey) return safe;
      const unit = event.deltaMode === 1 ? 16
        : event.deltaMode === 2 ? Math.max(1, Number(viewportHeight) || 1) : 1;
      const delta = Math.max(-90, Math.min(90, Number(event.deltaY || 0) * unit));
      const next = safe * Math.exp(-delta * .0075);
      return Math.max(range.min, Math.min(range.max, next));
    };

    const activeAvatarZoom = () => {
      const pet = shellState.pet || {};
      const range = pet.roam ? PET_ZOOM_RANGES.roam : PET_ZOOM_RANGES.stand;
      const value = Number(pet.roam ? pet.roamZoom : pet.zoom);
      return Math.max(range.min, Math.min(range.max,
        Number.isFinite(value) && value > 0 ? value : 1));
    };

    const holdAvatarZoom = value => {
      const pet = shellState.pet || (shellState.pet = {});
      if (pet.roam) pet.roamZoom = value; else pet.zoom = value;
    };

    const publishAvatarZoom = phase => {
      if (!shell || typeof shell.setPetZoomLive !== 'function') return;
      shell.setPetZoomLive({
        value: activeAvatarZoom(),
        phase,
        roam: Boolean(shellState.pet && shellState.pet.roam),
      });
    };

    const finishAvatarZoom = () => {
      if (!avatarZoomGesture) return;
      cancelAnimationFrame(avatarZoomGesture.frame);
      avatarZoomGesture = null;
      clearTimeout(avatarZoomSettleTimer);
      avatarZoomSettleTimer = 0;
      publishAvatarZoom('end');
      // Release the temporary interaction pin using the freshly resized
      // canvas. This restores the ordinary alpha/click-through decision even
      // when the cursor never moved during the gesture.
      updateHit(true);
    };

    const handleAvatarPinch = event => {
      const pet = shellState.pet || {};
      // Chromium exposes a macOS trackpad pinch as a modifier-wheel stream.
      // Ordinary wheel/scroll input is deliberately ignored.
      if (!event.ctrlKey || !shell || typeof shell.setPetZoomLive !== 'function'
          || pet.enabled === false || dragging) return;
      event.preventDefault();
      // A pinch may continue after the first resize moves the pixels under the
      // cursor. Require an alpha hit only when the gesture starts.
      const freshAvatarHit = avatarHit || paintedAvatarAt({
        x: event.clientX, y: event.clientY, inside: true,
      });
      if (!avatarZoomGesture && !freshAvatarHit) return;
      const range = pet.roam ? PET_ZOOM_RANGES.roam : PET_ZOOM_RANGES.stand;
      const current = activeAvatarZoom();
      const next = pinchZoomValue(current, event, range, innerHeight);
      holdAvatarZoom(next);
      markActivity();
      if (!avatarZoomGesture) {
        avatarZoomGesture = { frame: 0 };
        updateHit(true);
        publishAvatarZoom('start');
      } else if (!avatarZoomGesture.frame) {
        avatarZoomGesture.frame = requestAnimationFrame(() => {
          if (!avatarZoomGesture) return;
          avatarZoomGesture.frame = 0;
          publishAvatarZoom('move');
        });
      }
      clearTimeout(avatarZoomSettleTimer);
      avatarZoomSettleTimer = setTimeout(finishAvatarZoom, AVATAR_ZOOM_SETTLE_MS);
    };

    const endCanvasGesture = event => {
      const gesture = canvasGesture;
      canvasGesture = null;
      clearTimeout(gesture && gesture.holdTimer);
      if (!gesture) return;
      if (dragging) {
        dragging = false;
        root.classList.remove('dragging');
        if (shell && typeof shell.endPetDrag === 'function') shell.endPetDrag();
        updateHit(true);
        return;
      }
      if (gesture.talking) {
        stopRecording(false);
        return;
      }
      if (event && event.button === 0 && performance.now() - gesture.at < 420) {
        clearTimeout(avatarTapTimer);
        avatarTapTimer = setTimeout(() => {
          avatarTapTimer = 0;
          if (root.classList.contains('chat-open')) closeChat(); else openChat(false);
        }, 300);
      }
    };

    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0 || !avatarHit) return;
      clearTimeout(avatarTapTimer);
      avatarTapTimer = 0;
      markActivity();
      canvas.setPointerCapture(event.pointerId);
      const gesture = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        screenX: event.screenX,
        screenY: event.screenY,
        at: performance.now(),
        talking: false,
        holdTimer: 0,
      };
      canvasGesture = gesture;
      if (pointOnHead({ x: event.clientX, y: event.clientY })) {
        gesture.holdTimer = setTimeout(() => {
          if (canvasGesture !== gesture || dragging || live) return;
          gesture.talking = true;
          startRecording();
        }, 230);
      }
    });

    canvas.addEventListener('pointermove', event => {
      if (!shell || !canvasGesture || canvasGesture.id !== event.pointerId || canvasGesture.talking) return;
      if (!dragging && Math.hypot(event.clientX - canvasGesture.x, event.clientY - canvasGesture.y) > 5) {
        clearTimeout(canvasGesture.holdTimer);
        dragging = true;
        root.classList.add('dragging');
        if (typeof shell.beginPetDrag === 'function') shell.beginPetDrag({ screenX: canvasGesture.screenX, screenY: canvasGesture.screenY });
      }
      if (dragging && typeof shell.movePetDrag === 'function') shell.movePetDrag({ screenX: event.screenX, screenY: event.screenY });
    });
    canvas.addEventListener('pointerup', endCanvasGesture);
    canvas.addEventListener('pointercancel', endCanvasGesture);
    canvas.addEventListener('wheel', handleAvatarPinch, { passive: false });
    canvas.addEventListener('dblclick', event => {
      clearTimeout(avatarTapTimer);
      avatarTapTimer = 0;
      const action = avatarDoubleClickActionAt({ x: event.clientX, y: event.clientY });
      if (!action) return;
      event.preventDefault();
      markActivity();
      if (action === 'move') toggleMove();
      else if (action === 'walk') void toggleWalk();
      else if (action === 'opacity-up') void adjustAvatarOpacity(1);
      else if (action === 'opacity-down') void adjustAvatarOpacity(-1);
    });
    canvas.addEventListener('contextmenu', event => {
      event.preventDefault();
      if (shell && typeof shell.showPetMenu === 'function') shell.showPetMenu();
    });

    liveButton.addEventListener('click', () => { markActivity(); if (live) stopLiveTalk('ended'); else startLiveTalk(); });
    avatarCarouselButton.addEventListener('click', cycleAvatar);
    movesButton.addEventListener('click', toggleMove);
    walkButton.addEventListener('click', toggleWalk);
    settingsButton.addEventListener('click', () => shell && shell.openSettings());
    document.getElementById('emptyChat').addEventListener('click', () => openChat(true));
    document.getElementById('emptySettings').addEventListener('click', () => shell && shell.openSettings());
    closeChatButton.addEventListener('click', closeChat);
    sendButton.addEventListener('click', submitComposer);
    conversation.addEventListener('pointerdown', event => {
      selectingFeedback = Boolean(event.target && event.target.closest
        && event.target.closest('.message.assistant .bubble'));
      if (!selectingFeedback) hideSelectionActions(true);
    });
    conversation.addEventListener('pointerup', () => {
      selectingFeedback = false;
      requestAnimationFrame(refreshSelectionActions);
    });
    conversation.addEventListener('pointercancel', () => { selectingFeedback = false; });
    conversation.addEventListener('contextmenu', event => {
      const candidate = feedbackSelectionCandidate(getSelection());
      if (!candidate) return;
      event.preventDefault();
      showSelectionActions(candidate);
    });
    conversation.addEventListener('scroll', () => hideSelectionActions(false), { passive: true });
    selectionActions.addEventListener('pointerdown', event => event.preventDefault());
    selectionCopy.addEventListener('click', () => {
      const text = selectedFeedback && selectedFeedback.text;
      if (text) copyFeedbackText(text, 'selection');
    });
    selectionAskAI.addEventListener('click', askAIAboutSelectedFeedback);
    document.addEventListener('selectionchange', () => requestAnimationFrame(refreshSelectionActions));
    document.addEventListener('pointerdown', event => {
      if (!selectionActions.contains(event.target) && !conversation.contains(event.target)) {
        hideSelectionActions(true);
      }
    }, true);
    composer.addEventListener('input', () => { resizeComposer(); markActivity(); });
    composer.addEventListener('pointerdown', () => {
      markActivity();
      if (shell && typeof shell.focusPetWindow === 'function') shell.focusPetWindow();
    });
    composer.addEventListener('keydown', event => {
      if (avatarOnlyMotion) { event.preventDefault(); return; }
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submitComposer(); }
    });

    pttButton.addEventListener('pointerdown', event => {
      event.preventDefault();
      if (avatarOnlyMotion) return;
      pttButton.setPointerCapture(event.pointerId);
      startRecording();
    });
    pttButton.addEventListener('pointerup', () => stopRecording(false));
    pttButton.addEventListener('pointercancel', () => stopRecording(true));

    addEventListener('keydown', event => {
      if (avatarOnlyMotion) return;
      const typing = document.activeElement === composer || document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;
      if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === 'a') {
        const candidate = feedbackSelectionCandidate(getSelection());
        if (candidate) {
          event.preventDefault();
          selectedFeedback = candidate;
          askAIAboutSelectedFeedback();
          return;
        }
      }
      if ((event.metaKey || event.ctrlKey) && event.key === ',') {
        event.preventDefault();
        if (shell) shell.openSettings();
        return;
      }
      if (event.key === 'Escape') {
        if (selectionActions.classList.contains('show')) hideSelectionActions(true);
        else if (document.querySelector('.email-review')) closeEmailReview();
        else if (live) stopLiveTalk('ended');
        else if (turnController) { turnController.abort(); turnController = null; removeWorking(); setStatus('Ready', 'good'); }
        else closeChat();
        return;
      }
      if (event.code === 'Space' && !typing && !event.repeat && !live) {
        event.preventDefault();
        startRecording();
      }
    });
    addEventListener('keyup', event => {
      if (avatarOnlyMotion) return;
      const typing = document.activeElement === composer || document.activeElement instanceof HTMLInputElement || document.activeElement instanceof HTMLTextAreaElement;
      if (event.code === 'Space' && !typing && ptt) { event.preventDefault(); stopRecording(false); }
    });
    addEventListener('resize', () => { hideSelectionActions(false); resizeCanvas(); reportControlRects(true); });
    addEventListener('blur', () => {
      finishAvatarZoom();
      if (ptt) stopRecording(true);
    });
    addEventListener('beforeunload', () => {
      clearTimeout(avatarTapTimer);
      finishAvatarZoom();
      if (live) stopLiveTalk('ended');
      if (ptt && ptt.stream) ptt.stream.getTracks().forEach(track => track.stop());
      stopSpeech();
      if (shell && typeof shell.setPetControlRects === 'function') shell.setPetControlRects([]);
    });

    if (shell) {
      shell.getState().then(applyShellState).catch(() => {});
      if (typeof shell.onState === 'function') shell.onState(applyShellState);
      if (typeof shell.onPetPointer === 'function') shell.onPetPointer(handleGlobalPointer);
      if (typeof shell.onPetRoamMotion === 'function') shell.onPetRoamMotion(value => {
        const nextRoamState = value && typeof value === 'object'
          ? value : { enabled: false, mode: 'idle', direction: 1, phase: 0, edge: null };
        const nextPresentationKey = roamPresentationSignature(nextRoamState);
        if (nextPresentationKey !== roamPresentationKey) lastFrame = 0;
        roamPresentationKey = nextPresentationKey;
        roamState = nextRoamState;
      });
      if (typeof shell.onPetMoves === 'function') shell.onPetMoves(toggleMove);
      if (typeof shell.onPetChat === 'function') shell.onPetChat(() => openChat(true));
      if (typeof shell.onLiveToggle === 'function') shell.onLiveToggle(() => { if (live) stopLiveTalk('ended'); else startLiveTalk(); });
    } else {
      root.classList.add('chat-open');
    }

    const healthPoll = async () => {
      if (live || speechSource || turnController || ptt) return;
      try {
        const health = await fetch('/health', { cache: 'no-store' }).then(safeJSON);
        if (health.provider_ok || health.llm_ok) setStatus(`${manifest && manifest.avatar && manifest.avatar.name || 'OpenClam'} · ready`, 'good');
        else setStatus('Choose a language model in Character Studio', '');
      } catch (_) { setStatus('Voice engine unavailable', ''); }
    };
    setInterval(healthPoll, 12000);

    resizeCanvas();
    resizeComposer();
    reportControlRects(true);
    loadAvatar();
    setTimeout(healthPoll, 1600);
  })();
  </script>
</body>
</html>
