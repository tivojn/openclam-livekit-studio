<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>OpenClam Studio</title>
  <script src="/livekit-client.js"></script>
  <style>
    :root {
      --ink: #f7f4ef;
      --muted: #a9a5a0;
      --glass: rgba(18, 20, 25, .84);
      --glass-strong: rgba(12, 14, 18, .94);
      --line: rgba(255, 255, 255, .13);
      --line-strong: rgba(255, 255, 255, .24);
      --accent: #f45d62;
      --accent-soft: rgba(244, 93, 98, .18);
      --good: #66d69a;
      --warning: #f4bd62;
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #0c0e12;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    html.is-electron body { background: transparent; }
    button, textarea, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
    }

    html.dragging #stage { cursor: grabbing; }

    #topline {
      position: fixed;
      z-index: 20;
      top: 14px;
      left: 16px;
      max-width: calc(100vw - 118px);
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 17, 21, .68);
      backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .16);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .015em;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    #statusDot {
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: #717782;
    }

    #topline[data-tone="good"] #statusDot { background: var(--good); box-shadow: 0 0 11px rgba(102, 214, 154, .65); }
    #topline[data-tone="busy"] #statusDot { background: var(--warning); box-shadow: 0 0 11px rgba(244, 189, 98, .5); }
    #topline[data-tone="live"] #statusDot { background: var(--accent); box-shadow: 0 0 12px rgba(244, 93, 98, .7); animation: callPulse 1.2s ease-in-out infinite; }
    #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #rail {
      position: fixed;
      z-index: 30;
      top: 14px;
      right: 14px;
      display: grid;
      gap: 8px;
    }

    .round-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(15, 17, 21, .74);
      backdrop-filter: blur(18px) saturate(1.12);
      color: #d5d1cb;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
      cursor: pointer;
      transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
    }

    .round-button:hover { transform: translateY(-1px); color: #fff; border-color: var(--line-strong); background: rgba(29, 32, 39, .9); }
    .round-button:active { transform: scale(.95); }
    .round-button svg { width: 19px; height: 19px; fill: currentColor; }
    .round-button[disabled] { opacity: .36; cursor: default; transform: none; }

    #liveTalkButton[data-state="connecting"] { color: var(--warning); border-color: rgba(244, 189, 98, .4); animation: callPulse 1.15s ease-in-out infinite; }
    #liveTalkButton[data-state="connected"] { color: white; background: rgba(190, 42, 55, .88); border-color: rgba(255, 150, 150, .55); }
    #walkButton[aria-pressed="true"], #movesButton.showing { color: var(--good); border-color: rgba(102, 214, 154, .4); }

    @keyframes callPulse { 50% { opacity: .52; } }

    #chatDock {
      position: fixed;
      z-index: 35;
      left: 50%;
      bottom: 14px;
      width: min(680px, calc(100vw - 28px));
      transform: translate(-50%, 12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .22s ease, transform .28s cubic-bezier(.2, .8, .2, 1), visibility .22s;
    }

    html.chat-open #chatDock {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #conversation {
      max-height: min(42vh, 350px);
      overflow: auto;
      margin: 0 0 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.12);
      box-shadow: var(--shadow);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.25) transparent;
      overscroll-behavior: contain;
    }

    #conversation:empty { display: none; }
    .message { display: flex; align-items: flex-end; gap: 7px; margin: 4px 0; }
    .message.user { justify-content: flex-end; }
    .bubble {
      min-width: 0;
      max-width: min(82%, 530px);
      padding: 9px 12px;
      border-radius: 14px;
      color: #f4f1ec;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
      user-select: text;
    }

    .message.assistant .bubble { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.08); border-bottom-left-radius: 5px; }
    .message.user .bubble { background: #ef625f; color: #180c0c; border-bottom-right-radius: 5px; }
    .message.working .bubble { color: var(--muted); letter-spacing: .12em; }

    .response-actions {
      display: flex;
      flex: none;
      align-items: center;
      align-self: flex-end;
      gap: 1px;
    }

    .response-action {
      width: 28px;
      height: 28px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #aaa6a0;
      cursor: pointer;
    }

    .response-action:hover { color: white; background: rgba(255,255,255,.08); }
    .response-action svg { width: 15px; height: 15px; fill: currentColor; }

    #selectionActions {
      position: absolute;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(35, 37, 42, .98);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .34);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .12s ease, visibility .12s ease;
    }

    #selectionActions.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .selection-action {
      min-height: 30px;
      padding: 5px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 560;
      white-space: nowrap;
    }

    .selection-action:hover { background: rgba(255,255,255,.09); }

    .media-card { margin: 8px 0 4px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #080a0d; }
    .media-card img, .media-card video { width: 100%; max-height: 260px; display: block; object-fit: contain; }
    .media-card .media-name { padding: 7px 9px; color: var(--muted); font-size: 11px; }

    #composerRow {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(1.14);
      box-shadow: var(--shadow);
    }

    #composer {
      flex: 1;
      min-width: 0;
      height: 40px;
      min-height: 40px;
      max-height: 112px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 9px 7px;
      line-height: 1.42;
      unicode-bidi: plaintext;
      user-select: text;
    }

    #composer::placeholder { color: #817e7a; }
    .composer-button {
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 13px;
      background: rgba(255,255,255,.08);
      color: #d8d4ce;
      cursor: pointer;
      transition: transform .13s ease, background .2s ease, color .2s ease;
    }

    .composer-button:hover { background: rgba(255,255,255,.14); color: white; }
    .composer-button:active { transform: scale(.95); }
    .composer-button svg { width: 19px; height: 19px; fill: currentColor; }
    #sendButton { background: var(--accent); color: #1e090b; }
    #sendButton[disabled] { opacity: .35; cursor: default; }
    #pttButton.recording { color: white; background: #bd2b3a; animation: callPulse .9s ease-in-out infinite; }
    #closeChatButton { background: transparent; }

    #recordingChip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      display: none;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
      padding: 7px 11px;
      border: 1px solid rgba(244, 93, 98, .34);
      border-radius: 11px;
      background: rgba(22, 12, 16, .92);
      color: #ffd9d9;
      font-size: 12px;
      white-space: nowrap;
    }

    html.recording #recordingChip { display: flex; }
    #recordingLevel { display: flex; align-items: center; gap: 2px; height: 16px; }
    #recordingLevel i { width: 2px; height: 3px; border-radius: 2px; background: currentColor; transition: height 70ms ease; }

    #toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      top: 60px;
      max-width: min(440px, calc(100vw - 36px));
      transform: translate(-50%, -8px);
      opacity: 0;
      pointer-events: none;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 18, 22, .92);
      color: #e9e5df;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      transition: opacity .2s ease, transform .2s ease;
    }

    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #emptyState {
      position: fixed;
      z-index: 25;
      inset: 0;
      display: none;
      place-items: end center;
      /* The always-available right rail occupies the last 52px. Keep the
         onboarding card in the remaining canvas so Settings never sits on
         its border in a compact pet window. */
      padding: 30px 68px 24px 24px;
      background: radial-gradient(circle at 50% 35%, rgba(244, 93, 98, .14), transparent 45%), #0c0e12;
    }

    #emptyState.show { display: grid; }
    #emptyCard {
      width: min(430px, 100%);
      padding: 31px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(18, 20, 25, .95);
      text-align: center;
      box-shadow: var(--shadow);
      transition: opacity .2s ease, transform .2s ease;
    }

    #emptyCard h1 { margin: 0 0 9px; font-size: 25px; letter-spacing: -.035em; }
    #emptyCard p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    .empty-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; }
    .empty-actions button {
      height: 43px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.08);
      color: var(--ink);
      font-weight: 650;
      cursor: pointer;
    }
    #emptySettings { border-color: transparent; background: var(--accent); color: #220a0c; }
    html.chat-open #emptyCard { opacity: 0; transform: translateY(8px); pointer-events: none; }

    .email-review {
      position: fixed;
      z-index: 70;
      left: 50%;
      top: 50%;
      width: min(500px, calc(100vw - 28px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      transform: translate(-50%, -50%);
      padding: 20px;
      border: 1px solid var(--line-strong);
      border-radius: 21px;
      background: #15171c;
      box-shadow: 0 34px 100px rgba(0,0,0,.55);
      user-select: text;
    }

    .email-review h2 { margin: 0 0 5px; font-size: 20px; letter-spacing: -.025em; }
    .email-review .unsent { margin-bottom: 16px; color: var(--warning); font-size: 12px; line-height: 1.45; }
    .email-review label { display: grid; gap: 5px; margin: 11px 0; color: var(--muted); font-size: 12px; }
    .email-review input, .email-review textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: 0;
      background: #0e1014;
      color: var(--ink);
      padding: 9px 11px;
      user-select: text;
    }

    .email-review textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    .email-review input:focus, .email-review textarea:focus { border-color: rgba(244, 93, 98, .62); }
    .email-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .email-actions button { height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.07); color: var(--ink); cursor: pointer; }
    .email-actions button:last-child { background: var(--accent); color: #21090b; border-color: transparent; }

    :focus-visible { outline: 2px solid rgba(255, 151, 154, .9); outline-offset: 2px; }

    html.pet-mode #topline { opacity: .72; }
    html.pet-mode:not(.chat-open) #topline { transform: translateY(-5px); opacity: 0; }
    /* Moves and Walk are primary desktop controls, not hover decoration. Keep
       their hit targets stable even when the pointer is over transparent
       canvas or macOS Reduced Motion removes transition feedback. */
    html.pet-mode #rail .secondary {
      opacity: 1;
      visibility: visible;
      transform: none;
      pointer-events: auto;
    }
    @media (max-width: 520px) {
      #topline { max-width: calc(100vw - 78px); }
      #rail { right: 9px; }
      .round-button { width: 39px; height: 39px; border-radius: 13px; }
      #conversation { max-height: 34vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* Codex macOS visual contract. These values mirror the installed Codex
       app's graphite surfaces, text opacities, separators, focus blue, and
       radius scale while leaving OpenClam's avatar runtime fully independent. */
    :root {
      color-scheme: dark;
      --codex-surface: #181818;
      --codex-editor: #212121;
      --codex-elevated: #282828;
      --codex-control: #303030;
      --codex-under: #0d0d0d;
      --codex-text: #ffffff;
      --codex-text-secondary: rgba(255, 255, 255, .70);
      --codex-text-tertiary: rgba(255, 255, 255, .50);
      --codex-border: rgba(255, 255, 255, .08);
      --codex-border-heavy: rgba(255, 255, 255, .16);
      --codex-border-light: rgba(255, 255, 255, .04);
      --codex-focus: #339cff;
      --ink: var(--codex-text);
      --muted: var(--codex-text-secondary);
      --glass: rgba(33, 33, 33, .96);
      --glass-strong: rgba(40, 40, 40, .96);
      --line: var(--codex-border);
      --line-strong: var(--codex-border-heavy);
      --accent: var(--codex-text);
      --accent-soft: rgba(255, 255, 255, .07);
      --good: #40c977;
      --warning: #ff8549;
      --shadow: 0 16px 48px rgba(0, 0, 0, .32);
      --pet-edge: 12px;
      --pet-rail-size: 40px;
      --pet-rail-gap: 10px;
      --pet-rail-reserve: calc(var(--pet-edge) + var(--pet-rail-size) + var(--pet-rail-gap));
      --pet-surface-radius: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body { background: var(--codex-surface); }
    html.is-electron, html.is-electron body { background: transparent; }

    #topline {
      top: 12px;
      left: 12px;
      min-height: 30px;
      padding: 6px 10px;
      border-color: var(--codex-border);
      border-radius: 10px;
      background: rgba(33, 33, 33, .96);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .20);
      color: var(--codex-text-secondary);
      font-size: 12px;
      font-weight: 430;
      letter-spacing: 0;
    }

    #topline[data-tone="good"] #statusDot { box-shadow: none; }
    #topline[data-tone="busy"] #statusDot { box-shadow: none; }
    #topline[data-tone="live"] #statusDot { background: #ff6764; box-shadow: none; }

    #rail {
      z-index: 40;
      top: var(--pet-edge);
      right: var(--pet-edge);
      gap: 6px;
    }
    .round-button {
      width: 40px;
      height: 40px;
      border-color: var(--codex-border);
      border-radius: 10px;
      background: rgba(33, 33, 33, .96);
      backdrop-filter: blur(16px);
      color: var(--codex-text-secondary);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
    }
    .round-button:hover {
      transform: none;
      color: var(--codex-text);
      border-color: var(--codex-border-heavy);
      background: rgba(255, 255, 255, .08);
    }
    .round-button:active { transform: scale(.96); background: rgba(255, 255, 255, .12); }
    .round-button svg { width: 18px; height: 18px; }
    #liveTalkButton[data-state="connecting"] { color: var(--warning); border-color: rgba(255, 133, 73, .4); }
    #liveTalkButton[data-state="connected"] { color: var(--codex-under); background: #ff6764; border-color: #ff6764; }

    #chatDock {
      left: var(--pet-edge);
      right: var(--pet-rail-reserve);
      bottom: var(--pet-edge);
      width: auto;
      max-width: 720px;
      margin-inline: auto;
      padding: 7px;
      border: 1px solid var(--codex-border);
      border-radius: var(--pet-surface-radius);
      /* Chromium's backdrop-filter backing surface is rectangular in a
         transparent Electron window. It painted the large grey square seen
         around this otherwise rounded dock. The near-opaque dock already has
         sufficient contrast, so keep the rounded surface and remove only the
         compositor halo. */
      background: rgba(24, 24, 24, .985);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      box-shadow: none;
      transform: translateY(12px);
    }
    html.chat-open #chatDock { transform: translateY(0); }
    #conversation {
      max-height: min(31dvh, 280px, calc(100dvh - 152px));
      margin: 0 2px 4px;
      padding: 8px 8px 7px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      backdrop-filter: none;
      box-shadow: none;
      scrollbar-color: rgba(255, 255, 255, .16) transparent;
    }
    .message { gap: 6px; margin: 5px 0; }
    .bubble {
      color: var(--codex-text);
      font-size: 14px;
      font-weight: 430;
      line-height: 1.5;
    }
    .message.assistant .bubble {
      max-width: 100%;
      padding: 8px 4px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .message.user .bubble {
      padding: 9px 12px;
      border: 1px solid var(--codex-border-light);
      border-radius: 14px;
      border-bottom-right-radius: 6px;
      background: var(--codex-control);
      color: var(--codex-text);
    }
    .response-action { color: var(--codex-text-tertiary); border-radius: 8px; }
    .response-action:hover { color: var(--codex-text); background: rgba(255, 255, 255, .08); }
    #selectionActions {
      border-color: var(--codex-border-heavy);
      background: rgba(40, 40, 40, .99);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .42);
    }
    .selection-action { color: var(--codex-text); }
    .selection-action:hover { background: rgba(255, 255, 255, .08); }
    .media-card { border-color: var(--codex-border); border-radius: 12px; background: var(--codex-under); }

    #composerRow {
      gap: 5px;
      padding: 6px;
      border-color: var(--codex-border);
      border-radius: 22px;
      background: rgba(40, 40, 40, .98);
      backdrop-filter: blur(16px);
      box-shadow: none;
    }
    #composer {
      height: 40px;
      min-height: 40px;
      padding: 9px 8px;
      color: var(--codex-text);
      font-size: 14px;
      font-weight: 430;
    }
    #composer::placeholder { color: var(--codex-text-tertiary); }
    .composer-button {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: transparent;
      color: var(--codex-text-secondary);
    }
    .composer-button:hover { background: rgba(255, 255, 255, .08); color: var(--codex-text); }
    .composer-button:active { transform: scale(.96); background: rgba(255, 255, 255, .12); }
    .composer-button svg { width: 18px; height: 18px; }
    #sendButton { background: var(--codex-text); color: var(--codex-under); }
    #sendButton:hover { background: rgba(255, 255, 255, .88); color: var(--codex-under); }
    #pttButton.recording { color: var(--codex-under); background: #ff6764; }

    #recordingChip {
      border-color: rgba(255, 103, 100, .32);
      border-radius: 10px;
      background: rgba(33, 33, 33, .98);
      color: #ffd9d9;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .24);
    }
    #toast {
      border-color: var(--codex-border);
      border-radius: 10px;
      background: rgba(40, 40, 40, .98);
      color: var(--codex-text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    }

    #emptyState {
      inset: 8px;
      padding: 22px calc(var(--pet-rail-reserve) - 8px) 16px 16px;
      overflow: hidden;
      border: 1px solid var(--codex-border);
      border-radius: var(--pet-surface-radius);
      background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .035), transparent 42%), var(--codex-surface);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .24);
    }
    #emptyCard {
      width: min(440px, 100%);
      padding: 24px;
      border-color: var(--codex-border);
      border-radius: 16px;
      background: rgba(33, 33, 33, .98);
      text-align: left;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .28);
    }
    #emptyCard h1 { margin-bottom: 7px; font-size: 21px; font-weight: 600; letter-spacing: -.025em; }
    #emptyCard p { margin-bottom: 20px; color: var(--codex-text-secondary); font-size: 13px; line-height: 1.55; }
    .empty-actions { justify-content: flex-start; gap: 8px; }
    .empty-actions button {
      height: 36px;
      padding: 0 13px;
      border-color: var(--codex-border-heavy);
      border-radius: 8px;
      background: rgba(255, 255, 255, .05);
      color: var(--codex-text);
      font-size: 13px;
      font-weight: 500;
    }
    .empty-actions button:hover { background: rgba(255, 255, 255, .08); }
    #emptySettings { border-color: var(--codex-text); background: var(--codex-text); color: var(--codex-under); }

    .email-review {
      padding: 20px;
      border-color: var(--codex-border-heavy);
      border-radius: 16px;
      background: var(--codex-editor);
      box-shadow: 0 24px 72px rgba(0, 0, 0, .52);
    }
    .email-review h2 { font-size: 19px; font-weight: 600; }
    .email-review .unsent { color: var(--warning); }
    .email-review input, .email-review textarea {
      border-color: var(--codex-border-heavy);
      border-radius: 8px;
      background: var(--codex-control);
      color: var(--codex-text);
    }
    .email-review input:focus, .email-review textarea:focus { border-color: var(--codex-focus); }
    .email-actions button { border-color: var(--codex-border-heavy); border-radius: 8px; background: rgba(255, 255, 255, .05); }
    .email-actions button:last-child { background: var(--codex-text); color: var(--codex-under); }

    :focus-visible { outline-color: var(--codex-focus); }

    @media (max-width: 520px) {
      :root {
        --pet-edge: 10px;
        --pet-rail-gap: 8px;
      }
      #composerRow { border-radius: 20px; }
      #emptyState {
        inset: 6px;
        padding: 14px calc(var(--pet-rail-reserve) - 6px) 12px 12px;
        border-radius: 22px;
      }
      #emptyCard { padding: 20px; }
    }

    /* Horizon Walk and Edge Idle are presentation states: the avatar remains
       interactive, while every piece of window chrome yields to the desktop.
       Opacity and transform keep the handoff paint-only; JS owns inertness so
       hidden controls never keep receiving focus or hit rectangles. */
    #topline,
    #rail,
    #emptyState,
    #toast,
    .email-review {
      transition-property: opacity, transform;
      transition-duration: 160ms;
      transition-timing-function: cubic-bezier(.65, 0, .35, 1);
    }
    #chatDock {
      transition: opacity 160ms cubic-bezier(.65, 0, .35, 1),
        transform 160ms cubic-bezier(.65, 0, .35, 1),
        visibility 0s linear 160ms;
    }
    html.chat-open #chatDock { transition-delay: 0s, 0s, 0s; }
    html.avatar-only-motion #topline {
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }
    html.avatar-only-motion #rail {
      opacity: 0;
      transform: translateX(5px);
      pointer-events: none;
    }
    html.avatar-only-motion #chatDock,
    html.avatar-only-motion.chat-open #chatDock {
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
    }
    html.avatar-only-motion #emptyState {
      opacity: 0;
      transform: scale(.995);
      pointer-events: none;
    }
    html.avatar-only-motion #toast {
      opacity: 0;
      transform: translate(-50%, -4px);
      pointer-events: none;
    }
    html.avatar-only-motion .email-review {
      opacity: 0;
      transform: translate(-50%, calc(-50% + 4px));
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      html.avatar-only-motion #topline,
      html.avatar-only-motion #rail,
      html.avatar-only-motion #chatDock,
      html.avatar-only-motion #emptyState,
      html.avatar-only-motion #toast,
      html.avatar-only-motion .email-review { transform: none; }
      html.avatar-only-motion #toast { transform: translateX(-50%); }
      html.avatar-only-motion .email-review { transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Active OpenClam avatar"></canvas>

  <div id="topline" role="status" aria-live="polite" data-tone="busy">
    <span id="statusDot" aria-hidden="true"></span>
    <span id="statusText">Preparing your avatar…</span>
  </div>

  <nav id="rail" aria-label="Avatar controls">
    <button id="liveTalkButton" class="round-button" type="button" data-state="idle" aria-label="Start Live Talk" title="Start Live Talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 10.8a15.7 15.7 0 0 0 6.5 6.5l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.7 21 3 13.3 3 3.8c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.2 1.1l-2.2 2.1z"/></svg>
    </button>
    <button id="avatarCarouselButton" class="round-button" type="button" aria-label="Switch to next avatar" title="Switch to next avatar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.1 11.1a3.45 3.45 0 1 0 0-6.9 3.45 3.45 0 0 0 0 6.9Zm0-5a1.55 1.55 0 1 1 0 3.1 1.55 1.55 0 0 1 0-3.1ZM2.4 18.8c.35-3.15 2.2-5.2 5.7-5.2 1.27 0 2.35.27 3.2.8l-1.02 1.62c-.55-.34-1.27-.52-2.18-.52-2.23 0-3.38 1.03-3.7 3.3h-2Zm13.5-7.7a3.45 3.45 0 1 0 0-6.9 3.45 3.45 0 0 0 0 6.9Zm0-5a1.55 1.55 0 1 1 0 3.1 1.55 1.55 0 0 1 0-3.1Zm-1.04 7.56c.34-.04.69-.06 1.04-.06 3.5 0 5.35 2.05 5.7 5.2h-2c-.32-2.27-1.47-3.3-3.7-3.3-.35 0-.67.03-.96.08l-.08-1.92ZM10 19.2l2.2-2.2h-1.7v-1.8h4.8V20h-1.8v-1.7l-2.2 2.2L10 19.2Z"/></svg>
    </button>
    <button id="movesButton" class="round-button secondary" type="button" aria-label="Show avatar move" title="Show avatar move">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.45 4.55L18 8l-4.55 1.45L12 14l-1.45-4.55L6 8l4.55-1.45L12 2zm6 10 .9 2.8L22 16l-3.1 1.2L18 20l-.9-2.8L14 16l3.1-1.2L18 12zM6 14l1.15 3.35L10.5 18.5l-3.35 1.15L6 23l-1.15-3.35L1.5 18.5l3.35-1.15L6 14z"/></svg>
    </button>
    <button id="walkButton" class="round-button secondary" type="button" aria-pressed="false" aria-label="Start walking" title="Start walking">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 4.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zm-1.2 4.4 2.2 2.1v4.1h2v-5l-2-2 1.1-2.3c1.2 1.4 2.9 2.3 4.9 2.3v-2c-1.7 0-3.1-.9-3.9-2.2l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.2L8 3.4v5.2h2V4.7l1.8-.7-3.2 6.5-5.1-1-.4 1.9 6.5 1.3 1-2.1-1.6 4.9-4.7 4.2L5.6 21l5.2-4.7 1.5-4.5 1.2 1.2v5h2v-5.8l-3.2-3.6z"/></svg>
    </button>
    <button id="settingsButton" class="round-button" type="button" aria-label="Open Character Studio" title="Open Character Studio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 .05-1 7.5 7.5 0 0 0-.05-1l2.1-1.64-2-3.46-2.53 1a7.7 7.7 0 0 0-1.72-1L14.86 3h-4l-.4 2.9a7.7 7.7 0 0 0-1.72 1l-2.53-1-2 3.46L6.3 11a7.5 7.5 0 0 0-.05 1 7.5 7.5 0 0 0 .05 1l-2.1 1.64 2 3.46 2.53-1a7.7 7.7 0 0 0 1.72 1l.4 2.9h4l.4-2.9a7.7 7.7 0 0 0 1.72-1l2.53 1 2-3.46L19.4 13zM12.85 15.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z"/></svg>
    </button>
  </nav>

  <section id="chatDock" aria-label="Conversation">
    <div id="recordingChip" role="status" aria-live="polite">
      <span>Listening</span>
      <span id="recordingLevel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span id="recordingClock">0:00.0</span>
    </div>
    <div id="conversation" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div id="selectionActions" role="toolbar" aria-label="Selected response actions" aria-hidden="true" inert>
      <button id="selectionCopy" class="selection-action" type="button">Copy</button>
      <button id="selectionAskAI" class="selection-action" type="button" aria-keyshortcuts="Meta+Shift+A Control+Shift+A">Ask AI</button>
    </div>
    <div id="composerRow">
      <button id="pttButton" class="composer-button" type="button" aria-label="Hold to talk" title="Hold to talk · Space">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <textarea id="composer" rows="1" maxlength="12000" autocomplete="off" dir="auto" aria-label="Message" placeholder="Ask anything…"></textarea>
      <button id="sendButton" class="composer-button" type="button" aria-label="Send message" title="Send" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-7 8-1-8-1-3-7z"/></svg>
      </button>
      <button id="closeChatButton" class="composer-button" type="button" aria-label="Close conversation" title="Close conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5z"/></svg>
      </button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>

  <section id="emptyState" aria-labelledby="emptyTitle">
    <div id="emptyCard">
      <h1 id="emptyTitle">Build your first avatar</h1>
      <p>Chat, push to talk, and Live Talk work now. Add a portrait whenever you want a full-body desktop avatar.</p>
      <div class="empty-actions">
        <button id="emptyChat" type="button">Chat &amp; Push to Talk</button>
        <button id="emptySettings" type="button">Open Character Studio</button>
      </div>
    </div>
  </section>

  <script>
  (() => {
    'use strict';

    const root = document.documentElement;
    const shell = window.openclam && window.openclam.isElectron ? window.openclam : null;
    const query = new URLSearchParams(location.search);
    const side = query.get('side') === 'left' ? 'left' : 'right';
    const isCompanion = query.get('companion') === '1';
    if (shell) root.classList.add('is-electron');

    const canvas = document.getElementById('stage');
    const context = canvas.getContext('2d', { alpha: true, desynchronized: true });
    const statusLine = document.getElementById('topline');
    const statusText = document.getElementById('statusText');
    const rail = document.getElementById('rail');
    const liveButton = document.getElementById('liveTalkButton');
    const avatarCarouselButton = document.getElementById('avatarCarouselButton');
    const movesButton = document.getElementById('movesButton');
    const walkButton = document.getElementById('walkButton');
    const settingsButton = document.getElementById('settingsButton');
    const chatDock = document.getElementById('chatDock');
    const conversation = document.getElementById('conversation');
    const selectionActions = document.getElementById('selectionActions');
    const selectionCopy = document.getElementById('selectionCopy');
    const selectionAskAI = document.getElementById('selectionAskAI');
    const composer = document.getElementById('composer');
    const sendButton = document.getElementById('sendButton');
    const closeChatButton = document.getElementById('closeChatButton');
    const pttButton = document.getElementById('pttButton');
    const emptyState = document.getElementById('emptyState');
    const toast = document.getElementById('toast');
    const recordingClock = document.getElementById('recordingClock');
    const recordingBars = [...document.querySelectorAll('#recordingLevel i')];

    let manifest = null;
    let ready = false;
    let portraitWidth = 1;
    let portraitHeight = 1;
    let bodyImage = null;
    let headMask = null;
    let cutoutImage = null;
    const visemeImages = new Map();
    const layers = { eyes: {}, gaze: {}, brow: {}, cheek: {}, eyebag: {} };
    const motion = {};
    let assetRevision = Date.now();
    let pixelRatio = 1;
    let shellState = { onBattery: false, pet: { enabled: true, view: 'full', roam: false, roamZoom: .6, zoom: .6 } };
    let roamState = { enabled: false, mode: 'idle', direction: 1, phase: 0, edge: null };
    let roamPresentationKey = '';
    let moveUntil = 0;
    let idleDocked = false;
    let presentedMotionKey = '';
    let paintedMotionKey = '';
    let avatarOnlyMotion = false;
    let composerFocusBeforeMotion = null;
    let lastActivity = performance.now();
    let lastFrame = 0;
    let lastControlReport = 0;
    let pointer = { x: -1, y: -1, inside: false, seen: false, at: 0 };
    let avatarHit = false;
    let petHit = false;
    let lastHitSent = 0;
    let petEngaged = false;
    let dragging = false;
    let canvasGesture = null;
    let avatarTapTimer = 0;
    let avatarZoomGesture = null;
    let avatarZoomSettleTimer = 0;
    let avatarCarouselBusy = false;
    let toastTimer = 0;
    let emailReviewState = null;
    let selectedFeedback = null;
    let selectingFeedback = false;
    let turnController = null;
    let thinkingNode = null;
    let ptt = null;
    let live = null;
    let audioContext = null;
    let audioAnalyser = null;
    let audioMonitorGain = null;
    let audioSignal = { rms: 0, relative: 0, low: 0, mid: 0, high: 0, centroid: 0, zcr: 0 };
    let audioPeak = .018;
    let audioTimeData = null;
    let audioFrequencyData = null;
    let speechSource = null;
    let speechTrack = [];
    let speechStart = 0;
    let speechTrackIndex = 0;
    let agentSpeaking = false;
    const history = [];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    const faceCanvas = document.createElement('canvas');
    const faceContext = faceCanvas.getContext('2d', { alpha: true });
    const headCanvas = document.createElement('canvas');
    const headContext = headCanvas.getContext('2d', { alpha: true });
    let lastBodyGeometry = null;

    let currentViseme = 'sil';
    let previousViseme = 'sil';
    let visemeChangedAt = 0;
    let nextBlinkAt = performance.now() + 1800 + Math.random() * 2200;
    let blinkStartedAt = 0;
    let nextMicroExpression = performance.now() + 2800;
    let microExpression = { value: 0, started: 0, duration: 1 };
    // Upper-face speech life is deliberately slower than the viseme bank.
    // A held random target (rather than a new random number each frame) keeps
    // brows and the infraorbital band alive without reading as jitter.
    const speechExpressionState = {
      mode: 'idle', started: 0, duration: 1, nextAt: 0,
      from: { brow: 0, underEye: 0, squeeze: 0, asymmetry: 0 },
      to: { brow: 0, underEye: 0, squeeze: 0, asymmetry: 0 },
      value: { brow: 0, underEye: 0, squeeze: 0, asymmetry: 0 },
    };
    const gazeState = { x: 0, y: 0, at: 0 };
    const bodyMotionState = { speechBlend: 0, at: 0 };
    const LIVE_RIG_KEY = 'openclam-live-rig';
    let liveRigOverride = {};

    const setStatus = (text, tone = '') => {
      statusText.textContent = text;
      statusLine.dataset.tone = tone;
    };

    const notify = (text, duration = 4200) => {
      clearTimeout(toastTimer);
      toast.textContent = String(text || '');
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    };

    const markActivity = () => {
      lastActivity = performance.now();
      if (idleDocked) {
        idleDocked = false;
        if (shell && typeof shell.undockPet === 'function') shell.undockPet();
      }
    };

    const motionChrome = [statusLine, rail, chatDock, emptyState, toast];
    const setAvatarOnlyMotion = active => {
      const next = Boolean(active);
      if (next === avatarOnlyMotion) return;
      if (next && !composerFocusBeforeMotion && document.activeElement === composer) {
        composerFocusBeforeMotion = {
          start: composer.selectionStart,
          end: composer.selectionEnd,
          direction: composer.selectionDirection,
        };
      }
      avatarOnlyMotion = next;
      root.classList.toggle('avatar-only-motion', next);
      for (const element of [...motionChrome, ...document.querySelectorAll('.email-review')]) element.inert = next;
      if (next) {
        if (ptt) stopRecording(true);
        if (document.activeElement === composer) composer.blur();
      } else if (composerFocusBeforeMotion) {
        requestAnimationFrame(() => {
          if (avatarOnlyMotion) return;
          const focus = composerFocusBeforeMotion;
          composerFocusBeforeMotion = null;
          if (!focus || !root.classList.contains('chat-open')) return;
          composer.focus({ preventScroll: true });
          composer.setSelectionRange(focus.start, focus.end, focus.direction);
        });
      }
      reportControlRects(true);
    };

    const openChat = (focus = false) => {
      root.classList.add('chat-open');
      markActivity();
      if (focus && !avatarOnlyMotion) {
        if (shell && typeof shell.focusPetWindow === 'function') shell.focusPetWindow();
        requestAnimationFrame(() => composer.focus());
      }
      reportControlRects(true);
    };

    const closeChat = () => {
      if (ptt) return;
      hideSelectionActions(true);
      root.classList.remove('chat-open');
      composer.blur();
      reportControlRects(true);
    };

    const safeJSON = async response => {
      const contentType = response.headers.get('content-type') || '';
      if (!response.ok) {
        let detail = `Request failed (${response.status})`;
        try {
          detail = contentType.includes('json')
            ? String((await response.json()).detail || detail)
            : String((await response.text()).slice(0, 180) || detail);
        } catch (_) { /* the status is still useful */ }
        throw new Error(detail);
      }
      return response.json();
    };

    const liveTalkConnectionError = error => {
      const detail = String(error && error.message || error || '');
      if (detail.includes('livekit_selection_not_allowed')) {
        return 'This saved Live Talk combination is no longer supported. Choose one approved option for each stage, then save Live Talk.';
      }
      if (detail.includes('livekit_pilot_token_missing')) {
        return 'Live Talk access is not set up on this Mac. Add the pilot access token in Settings.';
      }
      if (detail.includes('livekit_not_configured')) {
        return 'Live Talk is not configured in this build.';
      }
      if (/\blivekit_[a-z0-9_]+\b/i.test(detail)) {
        return 'Live Talk could not connect. Check the Live Talk choices and credentials in Settings, then try again.';
      }
      return `Live Talk could not connect: ${detail.slice(0, 110) || 'Try again.'}`;
    };

    const postJSON = (path, body, signal) => fetch(path, {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'Cache-Control': 'no-store' },
      body: JSON.stringify(body),
      signal,
    }).then(safeJSON);

    const avatarCarouselCandidates = listing => (Array.isArray(listing && listing.avatars)
      ? listing.avatars : [])
      .filter(avatar => avatar && avatar.status === 'ready' && avatar.has_runtime === true
        && typeof avatar.slug === 'string' && avatar.slug.length > 0)
      .sort((left, right) => left.slug.localeCompare(right.slug));

    const nextAvatarInCarousel = (listing, companion = false) => {
      const avatars = avatarCarouselCandidates(listing).filter(avatar => (
        companion ? avatar.slug !== String(listing && listing.active || '') : true));
      if (!avatars.length) return null;
      const current = String(companion
        ? listing && listing.companion || '' : listing && listing.active || '');
      const index = avatars.findIndex(avatar => avatar.slug === current);
      if (avatars.length === 1 && index === 0) return null;
      return avatars[(index + 1 + avatars.length) % avatars.length];
    };

    const setAvatarCarouselAvailability = listing => {
      const next = nextAvatarInCarousel(listing, isCompanion);
      const current = String(isCompanion
        ? listing && listing.companion || '' : listing && listing.active || '');
      avatarCarouselButton.disabled = avatarCarouselBusy || !next;
      avatarCarouselButton.setAttribute('aria-busy', String(avatarCarouselBusy));
      const nextName = next && String(next.name || next.slug);
      const label = avatarCarouselBusy ? 'Switching avatar'
        : nextName ? `Switch to ${nextName}`
          : current ? 'No other ready avatar' : 'No ready avatar to switch to';
      avatarCarouselButton.setAttribute('aria-label', label);
      avatarCarouselButton.title = label;
      return next;
    };

    const fetchAvatarCarousel = () => fetch('/api/avatars', {
      headers: { 'Accept': 'application/json', 'Cache-Control': 'no-store' },
      cache: 'no-store',
    }).then(safeJSON);

    const refreshAvatarCarousel = async () => {
      try {
        const listing = await fetchAvatarCarousel();
        setAvatarCarouselAvailability(listing);
        return listing;
      } catch (_) {
        avatarCarouselButton.disabled = avatarCarouselBusy;
        avatarCarouselButton.setAttribute('aria-busy', String(avatarCarouselBusy));
        avatarCarouselButton.setAttribute('aria-label', 'Switch to next avatar');
        avatarCarouselButton.title = 'Switch to next avatar';
        return null;
      }
    };

    const cycleAvatar = async () => {
      if (avatarCarouselBusy) return;
      markActivity();
      avatarCarouselBusy = true;
      avatarCarouselButton.disabled = true;
      avatarCarouselButton.setAttribute('aria-busy', 'true');
      avatarCarouselButton.setAttribute('aria-label', 'Switching avatar');
      avatarCarouselButton.title = 'Switching avatar';
      try {
        const listing = await fetchAvatarCarousel();
        const next = setAvatarCarouselAvailability(listing);
        if (!next) {
          notify('Build another avatar before using the carousel.');
          return;
        }
        const path = isCompanion ? '/api/avatar/companion' : '/api/avatar/activate';
        await postJSON(path, { slug: next.slug });
        notify(`Switching to ${String(next.name || next.slug)}…`);
        if (shell) {
          const changed = isCompanion ? shell.companionChanged : shell.avatarChanged;
          if (typeof changed === 'function') {
            await changed.call(shell);
            return;
          }
        }
        location.reload();
      } catch (error) {
        notify(`Could not switch avatar: ${String(error && error.message || error || 'Try again.').slice(0, 120)}`);
      } finally {
        avatarCarouselBusy = false;
        if (document.visibilityState !== 'hidden') void refreshAvatarCarousel();
      }
    };

    const loadImage = src => new Promise(resolve => {
      if (!src) { resolve(null); return; }
      const image = new Image();
      image.decoding = 'async';
      image.onload = () => resolve(image);
      image.onerror = () => resolve(null);
      const joiner = String(src).includes('?') ? '&' : '?';
      image.src = `${src}${joiner}v=${assetRevision}`;
    });

    const nearestIndex = (values, target) => {
      if (!Array.isArray(values) || !values.length) return 0;
      let best = 0;
      let distance = Infinity;
      values.forEach((value, index) => {
        const next = Math.abs(Number(value) - target);
        if (next < distance) { distance = next; best = index; }
      });
      return best;
    };

    const boundedRigTarget = (value, fallback) => {
      const numeric = Number(value);
      return Number.isFinite(numeric)
        ? Math.max(0, Math.min(150, numeric)) : fallback;
    };

    const syncLiveRigOverride = raw => {
      let candidate = {};
      try {
        const parsed = raw === undefined
          ? JSON.parse(localStorage.getItem(LIVE_RIG_KEY) || 'null')
          : JSON.parse(raw || 'null');
        const activeSlug = String(manifest && manifest.avatar && manifest.avatar.slug || '');
        if (parsed && typeof parsed === 'object' && activeSlug
            && String(parsed.slug || '') === activeSlug) {
          for (const key of ['brows', 'eyebags']) {
            const value = Number(parsed[key]);
            if (Number.isFinite(value)) candidate[key] = boundedRigTarget(value, 0);
          }
        }
      } catch (_) { /* an old/corrupt settings draft never affects the avatar */ }
      liveRigOverride = candidate;
    };

    const rigTarget = (key, fallback) => {
      if (Object.prototype.hasOwnProperty.call(liveRigOverride, key)) {
        return boundedRigTarget(liveRigOverride[key], fallback);
      }
      const profile = manifest && manifest.rig_profile;
      return boundedRigTarget(profile && profile[key], fallback);
    };

    // The historical calibrated Brow 10% target is the natural talking
    // reference, so its gain stays legible. The square-root curve keeps the
    // zero position fully still while preventing experimental values from
    // becoming theatrical at the top of the slider.
    const rigExpressionGain = (key, fallback, reference, ceiling = 1.35) =>
      Math.min(ceiling, Math.sqrt(rigTarget(key, fallback) / reference));

    addEventListener('storage', event => {
      if (event.key === LIVE_RIG_KEY) syncLiveRigOverride(event.newValue);
    });

    const loadMotion = async kind => {
      const clip = manifest && manifest.motion && manifest.motion[kind];
      if (!clip) return;
      const loaded = { ...clip, sheets: [] };
      if (kind !== 'walk' && clip.alpha_stream) {
        const video = document.createElement('video');
        video.muted = true;
        // Edge Idle and Moves are authored one-shot clips. Looping Edge Idle
        // crossed Ara's known last-to-first seam while the nine-second ledge
        // hold was still active, and Chromium could expose a decoder gap on
        // that seek. Freeze the final decoded frame until the next state.
        video.loop = false;
        video.playsInline = true;
        video.preload = 'auto';
        video.src = `${clip.alpha_stream}?v=${assetRevision}`;
        await new Promise(resolve => {
          const timer = setTimeout(resolve, 3500);
          video.oncanplay = () => { clearTimeout(timer); resolve(); };
          video.onerror = () => { clearTimeout(timer); resolve(); };
          video.load();
        });
        if (video.videoWidth) loaded.video = video;
      }
      if (clip.poster) {
        const poster = await loadImage(clip.poster);
        if (poster) loaded.posterImage = poster;
      }
      if (!loaded.video || kind === 'walk') {
        for (const sheet of clip.sheets || []) {
          const image = await loadImage(sheet.image);
          if (image) loaded.sheets.push({ ...sheet, image });
        }
      }
      if (loaded.video || loaded.sheets.length) motion[kind] = loaded;
    };

    const motionPlaybackProfile = () => {
      const clip = motion.walk;
      if (!clip) return { ready: false };
      const bounds = clip.bounds || [0, 0, clip.frame_width || 256, clip.frame_height || 384];
      const zoom = Math.max(.5, Math.min(3, Number(shellState.pet && shellState.pet.roamZoom) || .6));
      const scale = Math.min(250 * zoom / Math.max(1, bounds[2]), 340 * zoom / Math.max(1, bounds[3])) * .985;
      const cycleSeconds = Number(clip.cycle_seconds) || Math.max(.1, Number(clip.frames || 1) / Math.max(1, Number(clip.fps || 1)));
      const sourceSpeed = Number(clip.ground_speed) || 64 / scale;
      const cycleDistance = (Number(clip.cycle_distance) || sourceSpeed * cycleSeconds) * scale;
      const travelOffsets = Array.isArray(clip.travel_offsets)
        ? clip.travel_offsets.map(value => Number(value) * scale).filter(Number.isFinite)
        : [];
      return { ready: true, walkSpeed: sourceSpeed * scale, cycleSeconds, cycleDistance, travelOffsets };
    };

    const publishMotionReadiness = () => {
      if (!shell || typeof shell.setPetMotionReady !== 'function') return;
      shell.setPetMotionReady(motion.walk ? motionPlaybackProfile() : { ready: false });
    };

    async function loadAvatar() {
      setStatus('Loading avatar…', 'busy');
      try {
        const response = await fetch(`assets/manifest.json?v=${assetRevision}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('missing avatar');
        manifest = await response.json();
        if (!manifest || !Array.isArray(manifest.visemes) || !manifest.frames) throw new Error('invalid avatar');
        syncLiveRigOverride();

        const firstFrame = manifest.frames.sil || manifest.frames[manifest.visemes[0]];
        const first = await loadImage(firstFrame && (firstFrame.open || firstFrame.shut));
        if (!first) throw new Error('avatar image failed to load');
        portraitWidth = Number(manifest.w) || first.naturalWidth || first.width;
        portraitHeight = Number(manifest.h) || first.naturalHeight || first.height;
        faceCanvas.width = portraitWidth;
        faceCanvas.height = portraitHeight;
        headCanvas.width = portraitWidth;
        headCanvas.height = portraitHeight;

        await Promise.all((manifest.visemes || []).map(async name => {
          const frame = manifest.frames[name] || {};
          const image = name === 'sil' && first ? first : await loadImage(frame.open || frame.shut);
          if (image) visemeImages.set(name, image);
        }));

        const layerJobs = [];
        for (const kind of ['eyes', 'gaze', 'brow', 'cheek', 'eyebag']) {
          const spec = manifest[kind];
          if (!spec) continue;
          for (const key of ['l', 'r']) {
            if (spec[key] && spec[key].src) {
              layerJobs.push(loadImage(spec[key].src).then(image => { layers[kind][key] = image; }));
            }
          }
        }
        if (manifest.body) {
          layerJobs.push(loadImage(manifest.body.image).then(image => { bodyImage = image; }));
          layerJobs.push(loadImage(manifest.body.head_mask).then(image => { headMask = image; }));
        }
        if (manifest.cutout && manifest.cutout.src) {
          layerJobs.push(loadImage(manifest.cutout.src).then(image => { cutoutImage = image; }));
        }
        await Promise.all(layerJobs);
        await Promise.all(['walk', 'idle', 'move'].map(loadMotion));
        publishMotionReadiness();
        ready = true;
        emptyState.classList.remove('show');
        setStatus(`${manifest.avatar && manifest.avatar.name ? manifest.avatar.name : 'OpenClam'} · ready`, 'good');
        void refreshAvatarCarousel();
        requestAnimationFrame(renderLoop);
      } catch (_) {
        manifest = null;
        ready = false;
        setAvatarOnlyMotion(false);
        emptyState.classList.add('show');
        setStatus('No active avatar', '');
        if (shell && typeof shell.setPetHit === 'function') shell.setPetHit(true);
        void refreshAvatarCarousel();
        reportControlRects(true);
      }
    }

    const resizeCanvas = () => {
      pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const width = Math.max(1, Math.round(innerWidth * pixelRatio));
      const height = Math.max(1, Math.round(innerHeight * pixelRatio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    };

    const viewCrop = (meta, width, height, forcedView = null) => {
      const bounds = Array.isArray(meta && meta.bounds) && meta.bounds.length >= 4
        ? meta.bounds.map(Number) : [0, 0, width, height];
      const full = { x: bounds[0], y: bounds[1], w: Math.max(1, bounds[2]), h: Math.max(1, bounds[3]) };
      const view = forcedView || (shellState.pet && shellState.pet.view) || 'full';
      if (view === 'full') return full;
      if (view === 'face' || view === 'head' || view === 'bust') {
        const face = meta && meta.alignment && meta.alignment.face_bounds;
        if (Array.isArray(face) && face.length >= 4) {
          const marginX = face[2] * .7;
          const top = face[1] - face[3] * .65;
          const bottom = view === 'bust' ? face[1] + face[3] * 2.15 : face[1] + face[3] * 1.25;
          return {
            x: Math.max(0, face[0] - marginX),
            y: Math.max(0, top),
            w: Math.min(width, face[2] + marginX * 2),
            h: Math.min(height, bottom - Math.max(0, top)),
          };
        }
      }
      const portion = view === 'half' ? .66 : .82;
      return { x: full.x, y: full.y, w: full.w, h: Math.max(1, full.h * portion) };
    };

    const cameraFor = (meta, width, height, forcedView = null) => {
      const crop = viewCrop(meta, width, height, forcedView);
      const chatReserve = root.classList.contains('chat-open') && !(shellState.pet && shellState.pet.roam)
        ? Math.min(innerHeight * .38, chatDock.getBoundingClientRect().height + 24) : 0;
      const availableHeight = Math.max(160, innerHeight - chatReserve);
      const margin = shellState.pet && shellState.pet.roam ? .995 : .94;
      const scale = Math.min(innerWidth / crop.w, availableHeight / crop.h) * margin;
      return {
        scale,
        x: innerWidth * .5 - (crop.x + crop.w * .5) * scale,
        y: shellState.pet && shellState.pet.roam
          ? availableHeight - (crop.y + crop.h) * scale
          : availableHeight * .5 - (crop.y + crop.h * .5) * scale,
        crop,
      };
    };

    /* track-stabiliser:start */
    const XFADE = .070;
    const STANDBY_MAINTENANCE_MS = 250;
    const STANDBY_GAZE_SETTLE_MS = 420;
    const MIN_POSE = .020;
    const VISUAL_LEAD = XFADE * .5;
    const LOCKED_POSES = new Set(['sil', 'PP']);
    const VIS_ALT = {
      aa: ['aa', 'E'], E: ['E', 'aa', 'ih'], ih: ['ih', 'E'],
      oh: ['oh', 'ou'], ou: ['ou', 'oh'], oo: ['ou', 'oh'],
      PP: ['PP', 'FF', 'nn', 'sil'], FF: ['FF', 'PP', 'TH'],
      TH: ['TH', 'nn'], DD: ['nn', 'TH'], nn: ['nn', 'RR'],
      kk: ['nn', 'ih', 'E'], CH: ['ih', 'TH'], SS: ['ih', 'TH', 'E'],
      RR: ['RR', 'nn', 'ou'], sil: ['sil'], closed: ['sil'],
    };
    const nearestViseme = (name, valid) => {
      const value = String(name || '');
      if (valid.has(value)) return value;
      for (const alternative of VIS_ALT[value] || []) {
        if (valid.has(alternative)) return alternative;
      }
      return null;
    };
    const stabiliseTrack = (raw, duration, validNames = []) => {
      const fallback = (Array.isArray(raw) ? raw : []).map(event => String(
        Array.isArray(event) ? event[1] || '' : '')).filter(Boolean);
      const valid = new Set((Array.isArray(validNames) && validNames.length)
        ? validNames.map(String) : fallback);
      const compact = events => {
        const output = [];
        for (const event of events) {
          if (output.length && Math.abs(event[0] - output[output.length - 1][0]) < .0001) {
            output[output.length - 1] = event;
          } else if (!output.length || output[output.length - 1][1] !== event[1]) {
            output.push(event);
          }
        }
        return output;
      };
      let events = (Array.isArray(raw) ? raw : [])
        .filter(event => Array.isArray(event) && Number.isFinite(Number(event[0])))
        .map(event => {
          const viseme = nearestViseme(event[1], valid);
          return viseme ? [Math.max(0, Number(event[0])), viseme] : null;
        })
        .filter(Boolean)
        .sort((left, right) => left[0] - right[0]);
      events = compact(events);
      for (let pass = 0; pass < 5; pass += 1) {
        let changed = false;
        for (let index = 0; index + 1 < events.length; index += 1) {
          const dwell = events[index + 1][0] - events[index][0];
          const viseme = events[index][1];
          if (dwell >= MIN_POSE || LOCKED_POSES.has(viseme)) continue;
          const before = index ? events[index - 1][1] : null;
          const after = events[index + 1][1];
          const replacement = after && after !== 'sil' ? after : before;
          if (replacement && replacement !== viseme) {
            events[index][1] = replacement;
            changed = true;
          }
        }
        events = compact(events);
        if (!changed) break;
      }
      if (events.length && duration > 0 && events[events.length - 1][0] > duration) {
        events[events.length - 1][0] = duration;
      }
      return events;
    };
    /* track-stabiliser:end */

    /* live-mouth-sync:start */
    const LIVE_MOUTH_OPEN_RMS = .0065;
    const LIVE_MOUTH_CLOSE_RMS = .0035;
    const LIVE_MOUTH_RELEASE_MS = 48;
    const LIVE_MOUTH_DWELL_MS = 72;
    const LIVE_TALK_STATUS_RELEASE_MS = 520;
    const makeReactiveMouthState = () => ({ viseme: 'sil', changedAt: 0, audibleUntil: 0 });
    const makeLiveTalkAudioState = () => ({ speaking: false, audibleUntil: 0 });
    const reactiveMouthState = makeReactiveMouthState();

    const liveTalkAudioTransition = (state, signal, now) => {
      const rms = Math.max(0, Number(signal && signal.rms) || 0);
      const threshold = state.speaking ? LIVE_MOUTH_CLOSE_RMS : LIVE_MOUTH_OPEN_RMS;
      if (rms >= threshold) {
        state.speaking = true;
        state.audibleUntil = now + LIVE_TALK_STATUS_RELEASE_MS;
        return 'speaking';
      }
      if (!state.speaking) return null;
      if (now < state.audibleUntil) return 'speaking';
      state.speaking = false;
      state.audibleUntil = 0;
      return 'connected';
    };

    const measureAudioSignal = (timeData, frequencyData, sampleRate) => {
      const samples = timeData && timeData.length ? timeData : [];
      let squareSum = 0;
      let crossings = 0;
      let previous = 0;
      for (let index = 0; index < samples.length; index += 1) {
        const value = (Number(samples[index]) - 128) / 128;
        squareSum += value * value;
        if (index && ((value >= 0) !== (previous >= 0))) crossings += 1;
        previous = value;
      }
      const rms = samples.length ? Math.sqrt(squareSum / samples.length) : 0;
      const bands = { low: [80, 520], mid: [520, 2200], high: [2200, 7200] };
      const totals = { low: 0, mid: 0, high: 0 };
      const counts = { low: 0, mid: 0, high: 0 };
      let weightedFrequency = 0;
      let spectralEnergy = 0;
      const spectrum = frequencyData && frequencyData.length ? frequencyData : [];
      const nyquist = Math.max(1, Number(sampleRate) || 48000) * .5;
      for (let index = 1; index < spectrum.length; index += 1) {
        const frequency = index / spectrum.length * nyquist;
        if (frequency > bands.high[1]) break;
        const magnitude = Math.max(0, Number(spectrum[index]) || 0) / 255;
        const energy = magnitude * magnitude;
        spectralEnergy += energy;
        weightedFrequency += frequency * energy;
        for (const name of ['low', 'mid', 'high']) {
          if (frequency >= bands[name][0] && frequency < bands[name][1]) {
            totals[name] += energy;
            counts[name] += 1;
            break;
          }
        }
      }
      return {
        rms,
        relative: 0,
        low: Math.sqrt(totals.low / Math.max(1, counts.low)),
        mid: Math.sqrt(totals.mid / Math.max(1, counts.mid)),
        high: Math.sqrt(totals.high / Math.max(1, counts.high)),
        centroid: spectralEnergy ? Math.min(1, weightedFrequency / spectralEnergy / bands.high[1]) : 0,
        zcr: samples.length > 1 ? crossings / (samples.length - 1) : 0,
      };
    };

    const firstAvailableViseme = (valid, names) => {
      for (const name of names) if (valid.has(name)) return name;
      return valid.has('sil') ? 'sil' : [...valid][0] || 'sil';
    };

    const classifyAudioViseme = (signal, validNames) => {
      const valid = new Set((Array.isArray(validNames) ? validNames : []).map(String));
      const intensity = Math.max(0, Math.min(1, Number(signal.relative) || 0));
      const low = Number(signal.low) || 0;
      const mid = Number(signal.mid) || 0;
      const high = Number(signal.high) || 0;
      const centroid = Number(signal.centroid) || 0;
      const zcr = Number(signal.zcr) || 0;
      if ((zcr > .145 && high > low * .82) || high > Math.max(low, mid) * 1.22) {
        return firstAvailableViseme(valid, ['SS', 'FF', 'TH', 'ih']);
      }
      if (centroid < .31 && low > high * 1.12) {
        return firstAvailableViseme(valid, intensity > .72 ? ['oh', 'aa', 'ou'] : ['ou', 'RR', 'oh']);
      }
      if (intensity > .78) return firstAvailableViseme(valid, ['aa', 'oh', 'E']);
      if (centroid > .55) return firstAvailableViseme(valid, intensity > .46 ? ['E', 'ih', 'SS'] : ['ih', 'nn']);
      if (intensity > .48) return firstAvailableViseme(valid, ['E', 'oh', 'aa']);
      return firstAvailableViseme(valid, ['ih', 'nn', 'RR']);
    };

    const reactiveAudioViseme = (state, signal, now, validNames) => {
      const rms = Math.max(0, Number(signal && signal.rms) || 0);
      const threshold = state.viseme === 'sil' ? LIVE_MOUTH_OPEN_RMS : LIVE_MOUTH_CLOSE_RMS;
      const audible = rms >= threshold;
      if (audible) state.audibleUntil = now + LIVE_MOUTH_RELEASE_MS;
      if (!audible) {
        if (now >= state.audibleUntil) {
          state.viseme = 'sil';
          state.changedAt = now;
        }
        return state.viseme;
      }
      const candidate = classifyAudioViseme(signal, validNames);
      if (state.viseme === 'sil' || (candidate !== state.viseme && now - state.changedAt >= LIVE_MOUTH_DWELL_MS)) {
        state.viseme = candidate;
        state.changedAt = now;
      }
      return state.viseme;
    };
    /* live-mouth-sync:end */

    const speechTime = () => audioContext ? audioContext.currentTime - speechStart : 0;

    const hasAttachedAgentAudio = () => Boolean(live && live.audioAttachments && live.audioAttachments.size);

    const syncLiveTalkAudioStatus = (session, now) => {
      if (live !== session || session.ending || !session.agentReady || !session.audioAttachments.size) return;
      const state = session.remoteAudioState || (session.remoteAudioState = makeLiveTalkAudioState());
      const status = liveTalkAudioTransition(state, audioSignal, now);
      if (status === 'speaking') setStatus('Live Talk · speaking', 'live');
      else if (status === 'connected') setStatus('Live Talk · connected', 'live');
    };

    const desiredViseme = now => {
      if (speechSource && speechTrack.length) {
        const time = speechTime() + VISUAL_LEAD;
        while (speechTrackIndex + 1 < speechTrack.length && Number(speechTrack[speechTrackIndex + 1][0]) <= time) speechTrackIndex += 1;
        return String((speechTrack[speechTrackIndex] && speechTrack[speechTrackIndex][1]) || 'sil');
      }
      if (speechSource || hasAttachedAgentAudio()) {
        const available = manifest && manifest.visemes ? manifest.visemes : ['sil'];
        return reactiveAudioViseme(reactiveMouthState, audioSignal, now, available);
      }
      reactiveMouthState.viseme = 'sil';
      reactiveMouthState.audibleUntil = 0;
      return 'sil';
    };

    const blinkAmount = (now, reduce = false) => {
      // A blink and its dependent lower-lid/under-eye strip are decorative
      // renderer motion.  Respect Reduced Motion immediately, including in
      // the middle of a blink, and defer the next one until motion is allowed
      // again instead of resuming an in-progress close.
      if (reduce) {
        blinkStartedAt = 0;
        nextBlinkAt = Math.max(nextBlinkAt, now + 1000);
        return 0;
      }
      if (!blinkStartedAt && now >= nextBlinkAt) blinkStartedAt = now;
      if (!blinkStartedAt) return 0;
      const elapsed = now - blinkStartedAt;
      if (elapsed < 90) return elapsed / 90;
      if (elapsed < 135) return 1;
      if (elapsed < 250) return 1 - (elapsed - 135) / 115;
      blinkStartedAt = 0;
      nextBlinkAt = now + 1900 + Math.random() * 4300;
      return 0;
    };

    const microBrow = (now, reduce = false) => {
      if (reduce) return 0;
      if (now >= nextMicroExpression) {
        microExpression = { value: Math.random() * 2 - 1, started: now, duration: 900 + Math.random() * 900 };
        nextMicroExpression = now + 2800 + Math.random() * 4300;
      }
      const phase = (now - microExpression.started) / microExpression.duration;
      return phase > 0 && phase < 1 ? microExpression.value * Math.sin(Math.PI * phase) : 0;
    };

    const speechExpressionAt = (now, speaking, state, reduce = false) => {
      const zero = { brow: 0, underEye: 0, squeeze: 0, asymmetry: 0 };
      const interpolate = (from, to, amount) => {
        const t = Math.max(0, Math.min(1, amount));
        const eased = t * t * (3 - 2 * t);
        return Object.fromEntries(Object.keys(zero).map(key => [key,
          Number(from[key] || 0) + (Number(to[key] || 0) - Number(from[key] || 0)) * eased,
        ]));
      };
      if (reduce) {
        state.mode = 'idle';
        state.value = zero;
        return zero;
      }
      if (!speaking) {
        if (state.mode === 'speaking') {
          state.from = { ...state.value };
          state.to = zero;
          state.started = now;
          state.duration = 280;
          state.mode = 'release';
        }
        if (state.mode !== 'release') return zero;
        const value = interpolate(state.from, state.to,
          (now - state.started) / Math.max(1, state.duration));
        state.value = value;
        if (now - state.started >= state.duration) state.mode = 'idle';
        return value;
      }
      if (state.mode !== 'speaking' || now >= state.nextAt) {
        state.from = { ...(state.value || zero) };
        state.to = {
          // Tiny semi-random phrases: a soft knit/raise and an under-eye
          // bunch follow speech together, but never repeat on a metronome.
          brow: .22 + Math.random() * .48,
          underEye: .24 + Math.random() * .44,
          squeeze: Math.random() < .28 ? 1.35 : 0,
          asymmetry: (Math.random() * 2 - 1) * .14,
        };
        state.started = now;
        state.duration = 480 + Math.random() * 540;
        state.nextAt = now + state.duration + 120 + Math.random() * 260;
        state.mode = 'speaking';
      }
      const value = interpolate(state.from, state.to,
        (now - state.started) / Math.max(1, state.duration));
      state.value = value;
      return value;
    };

    // Cursor attention is measured from the avatar's eyes rather than from the
    // centre of its transparent window. The tanh curve is lively nearby and
    // asymptotically bounded to the calibrated atlas, so a cursor on another
    // display still reads clearly without ever asking the eyes for an
    // anatomically impossible pose.
    const cursorGazeTarget = (point, anchor, ranges, viewport) => {
      const eye = anchor && Number.isFinite(anchor.x) && Number.isFinite(anchor.y)
        ? anchor : { x: 0, y: 0 };
      const tracked = point && point.seen && Number.isFinite(point.x) && Number.isFinite(point.y)
        ? point : eye;
      const width = Math.max(1, Number(viewport && viewport.width) || 1);
      const height = Math.max(1, Number(viewport && viewport.height) || 1);
      const limitX = Math.max(0, Number(ranges && ranges.x) || 0);
      const limitY = Math.max(0, Number(ranges && ranges.y) || 0);
      const directionX = Math.tanh((tracked.x - eye.x) / Math.max(64, width * .12));
      const directionY = Math.tanh((tracked.y - eye.y) / Math.max(84, height * .16));
      return {
        x: Math.max(-limitX, Math.min(limitX, directionX * limitX * .84)),
        y: Math.max(-limitY, Math.min(limitY, directionY * limitY * .78)),
      };
    };

    const smoothCursorGaze = (state, target, now, reduce = false) => {
      const elapsed = state.at > 0 ? Math.max(1, Math.min(80, now - state.at)) : 16;
      const response = reduce ? 1 : 1 - Math.exp(-elapsed / 72);
      state.x += (target.x - state.x) * response;
      state.y += (target.y - state.y) * response;
      state.at = now;
      return { x: state.x, y: state.y };
    };

    const avatarFaceAnchor = () => {
      const geometry = lastBodyGeometry;
      const face = geometry && geometry.metadata && geometry.metadata.alignment
        && geometry.metadata.alignment.face_bounds;
      if (!geometry || !Array.isArray(face) || face.length < 4) {
        return { x: innerWidth * .5, y: innerHeight * .42 };
      }
      return {
        x: geometry.fit.x + (Number(face[0]) + Number(face[2]) * .5) * geometry.fit.scale,
        y: geometry.fit.y + (Number(face[1]) + Number(face[3]) * .5) * geometry.fit.scale,
      };
    };

    const drawStripState = (target, image, geometry, values, value, row = 0) => {
      if (!target || !image || !geometry || !Array.isArray(geometry.box)) return;
      const box = geometry.box.map(Number);
      const width = box[2];
      const height = box[3];
      if (!(width > 0 && height > 0)) return;
      const index = nearestIndex(values, value);
      const states = Math.max(1, values.length);
      const sourceY = (index + row * states) * height;
      target.drawImage(image, 0, sourceY, width, height, box[0], box[1], width, height);
    };

    const composeHead = now => {
      const wanted = desiredViseme(now);
      if (wanted !== currentViseme && visemeImages.has(wanted)) {
        previousViseme = currentViseme;
        currentViseme = wanted;
        // A timed local track can lead its sound to centre the blend. Live Talk
        // sees the exact samples being played, so begin halfway through the
        // crossfade instead of adding another full texture-frame of latency.
        visemeChangedAt = hasAttachedAgentAudio() && !speechTrack.length
          ? now - XFADE * 500 : now;
      }
      const oldImage = visemeImages.get(previousViseme) || visemeImages.get('sil') || [...visemeImages.values()][0];
      const newImage = visemeImages.get(currentViseme) || oldImage;
      const blend = Math.max(0, Math.min(1, (now - visemeChangedAt) / (XFADE * 1000)));
      faceContext.setTransform(1, 0, 0, 1, 0, 0);
      faceContext.globalCompositeOperation = 'source-over';
      faceContext.globalAlpha = 1;
      faceContext.clearRect(0, 0, portraitWidth, portraitHeight);
      if (oldImage) faceContext.drawImage(oldImage, 0, 0, portraitWidth, portraitHeight);
      if (newImage && newImage !== oldImage) {
        faceContext.globalAlpha = blend;
        faceContext.drawImage(newImage, 0, 0, portraitWidth, portraitHeight);
        faceContext.globalAlpha = 1;
      }

      const blink = blinkAmount(now, reducedMotion.matches);
      const gazeXValues = manifest.gaze && manifest.gaze.dxs || [0];
      const gazeYValues = manifest.gaze && manifest.gaze.dys || [0];
      const gazeTarget = cursorGazeTarget(pointer, avatarFaceAnchor(), {
        x: Math.max(...gazeXValues.map(value => Math.abs(Number(value))), 0),
        y: Math.max(...gazeYValues.map(value => Math.abs(Number(value))), 0),
      }, { width: innerWidth, height: innerHeight });
      const gaze = smoothCursorGaze(gazeState, gazeTarget, now, reducedMotion.matches);
      const browValues = manifest.brow && manifest.brow.dys || [0];
      const browTop = Math.max(...browValues.map(value => Math.abs(Number(value))), 0);
      const liveAudioSpeaking = Boolean(
        live && live.remoteAudioState && live.remoteAudioState.speaking);
      const speaking = Boolean(agentSpeaking || speechSource || liveAudioSpeaking);
      const upperFaceSpeaking = speaking && !reducedMotion.matches;
      const expression = speechExpressionAt(now, upperFaceSpeaking,
        speechExpressionState, reducedMotion.matches);
      const browGain = rigExpressionGain('brows', 10, 10);
      const eyebagGain = rigExpressionGain('eyebags', 35, 35);
      const browValue = (upperFaceSpeaking
        ? -(.24 + expression.brow * .48) * browGain
        : -.18 * microBrow(now, reducedMotion.matches) * browGain) * browTop;

      if (manifest.brow) {
        const squeeze = manifest.brow.sqs || [0];
        const row = nearestIndex(squeeze, upperFaceSpeaking ? expression.squeeze : 0);
        for (const key of ['l', 'r']) {
          const side = key === 'l' ? 1 - expression.asymmetry : 1 + expression.asymmetry;
          drawStripState(faceContext, layers.brow[key], manifest.brow[key], browValues,
            browValue * side, row);
        }
      }
      if (manifest.cheek) {
        const values = manifest.cheek.ups || [0];
        const value = speaking ? Number(values[values.length - 1] || 0) * .35 : 0;
        for (const key of ['l', 'r']) drawStripState(faceContext, layers.cheek[key], manifest.cheek[key], values, value);
      }
      if (manifest.eyebag) {
        const values = manifest.eyebag.ups || [0];
        const maximum = Number(values[values.length - 1] || 0);
        const blinkValue = blink * maximum * .3;
        const speechValue = upperFaceSpeaking
          ? (.20 + expression.underEye * .42) * eyebagGain * maximum : 0;
        for (const key of ['l', 'r']) {
          const side = key === 'l' ? 1 - expression.asymmetry : 1 + expression.asymmetry;
          drawStripState(faceContext, layers.eyebag[key], manifest.eyebag[key], values,
            Math.max(blinkValue, speechValue * side));
        }
      }
      if (manifest.gaze) {
        const row = nearestIndex(gazeYValues, gaze.y);
        for (const key of ['l', 'r']) drawStripState(faceContext, layers.gaze[key], manifest.gaze[key], gazeXValues, gaze.x, row);
      }
      if (manifest.eyes && Array.isArray(manifest.eyes.states)) {
        const states = manifest.eyes.states;
        for (const key of ['l', 'r']) {
          const image = layers.eyes[key];
          const geometry = manifest.eyes[key];
          if (!image || !geometry || !Array.isArray(geometry.box) || blink <= .004) continue;
          const box = geometry.box.map(Number);
          let high = 0;
          while (high < states.length - 1 && Number(states[high]) < blink) high += 1;
          const low = high - 1;
          const lowValue = low >= 0 ? Number(states[low]) : 0;
          const highValue = Number(states[high]) || 1;
          const blendValue = Math.max(0, Math.min(1, (blink - lowValue) / Math.max(.0001, highValue - lowValue)));
          if (low >= 0) faceContext.drawImage(image, 0, low * box[3], box[2], box[3], box[0], box[1], box[2], box[3]);
          faceContext.globalAlpha = blendValue;
          faceContext.drawImage(image, 0, high * box[3], box[2], box[3], box[0], box[1], box[2], box[3]);
          faceContext.globalAlpha = 1;
        }
      }

      if (cutoutImage) {
        faceContext.globalCompositeOperation = 'destination-in';
        faceContext.drawImage(cutoutImage, 0, 0, portraitWidth, portraitHeight);
        faceContext.globalCompositeOperation = 'source-over';
      }

      headContext.setTransform(1, 0, 0, 1, 0, 0);
      headContext.globalCompositeOperation = 'source-over';
      headContext.globalAlpha = 1;
      headContext.clearRect(0, 0, portraitWidth, portraitHeight);
      headContext.drawImage(faceCanvas, 0, 0);
      if (headMask) {
        headContext.globalCompositeOperation = 'destination-in';
        headContext.drawImage(headMask, 0, 0, portraitWidth, portraitHeight);
        headContext.globalCompositeOperation = 'source-over';
      }
    };

    const motionPhaseAt = (state, clip, epochMs) => {
      const wrapped = (((Number(state && state.phase) || 0) % 1) + 1) % 1;
      if (!state || !state.enabled || state.mode !== 'walk') return wrapped;
      const sampledAt = Number(state.sampledAt);
      if (!Number.isFinite(sampledAt) || !Number.isFinite(epochMs)) return wrapped;
      const cycleSeconds = Number(clip && clip.cycle_seconds)
        || Math.max(.1, Number(clip && clip.frames || 1) / Math.max(1, Number(clip && clip.fps || 1)));
      // Main owns screen travel and periodically phase-locks this clock. Fill
      // only the short interval between IPC packets so a 24fps atlas follows
      // the display clock instead of inheriting 16–67ms packet jitter.
      const elapsedMs = Math.max(0, Math.min(100, epochMs - sampledAt));
      return (wrapped + elapsedMs / (cycleSeconds * 1000)) % 1;
    };

    const motionFrame = (clip, now, phase = null) => {
      if (!clip || !clip.frames || !clip.sheets || !clip.sheets.length) return null;
      const raw = phase === null
        ? Math.floor(now / 1000 * (Number(clip.fps) || 12)) % clip.frames
        : Math.min(clip.frames - 1, Math.floor((((phase % 1) + 1) % 1) * clip.frames));
      const sheet = clip.sheets.find(value => raw >= value.first && raw < value.first + value.count);
      if (!sheet) return null;
      const local = raw - sheet.first;
      return {
        sheet,
        index: raw,
        sx: (local % sheet.columns) * clip.frame_width,
        sy: Math.floor(local / sheet.columns) * clip.frame_height,
      };
    };

    const clearStage = () => {
      context.setTransform(1, 0, 0, 1, 0, 0);
      context.clearRect(0, 0, canvas.width, canvas.height);
    };

    const beginMotionPresentation = (kind, edge, clip) => {
      const key = `${kind}:${edge || ''}`;
      if (key === presentedMotionKey) return key;
      presentedMotionKey = key;
      paintedMotionKey = '';
      for (const otherClip of Object.values(motion)) {
        if (otherClip !== clip && otherClip.video && !otherClip.video.paused) otherClip.video.pause();
      }
      if (clip.video) {
        clip.video.pause();
        try { clip.video.currentTime = 0; } catch (_) { /* poster covers a pending seek */ }
        clip.video.play().catch(() => {});
      }
      return key;
    };

    const endMotionPresentation = () => {
      if (!presentedMotionKey) return;
      presentedMotionKey = '';
      paintedMotionKey = '';
      for (const clip of Object.values(motion)) {
        if (clip.video && !clip.video.paused) clip.video.pause();
      }
    };

    const drawMotion = (kind, now, edge = null) => {
