        const video = document.createElement('video');
        video.muted = true;
        // Native looping crosses Ara's known last-to-first seam and Chromium
        // can expose a decoder gap on that seek. Keep the media one-shot; a
        // warm second decoder dissolves Edge Idle across the seam below while
        // Moves still ends on its authored final frame.
        video.loop = false;
        video.playsInline = true;
        video.preload = 'auto';
        video.src = `${clip.alpha_stream}?v=${assetRevision}`;
        await new Promise(resolve => {
          const timer = setTimeout(resolve, 3500);
          video.oncanplay = () => { clearTimeout(timer); resolve(); };
          video.onerror = () => { clearTimeout(timer); resolve(); };
          video.load();
        });
        if (video.videoWidth) loaded.video = video;
        if (kind === 'idle' && loaded.video) {
          const loopVideo = document.createElement('video');
          loopVideo.muted = true;
          loopVideo.loop = false;
          loopVideo.playsInline = true;
          loopVideo.preload = 'auto';
          loopVideo.src = video.src;
          await new Promise(resolve => {
            const timer = setTimeout(resolve, 3500);
            loopVideo.oncanplay = () => { clearTimeout(timer); resolve(); };
            loopVideo.onerror = () => { clearTimeout(timer); resolve(); };
            loopVideo.load();
          });
          if (loopVideo.videoWidth) loaded.loopVideo = loopVideo;
        }
      }
      if (clip.poster) {
        const poster = await loadImage(clip.poster);
        if (poster) loaded.posterImage = poster;
      }
      if (!loaded.video || kind === 'walk') {
        for (const sheet of clip.sheets || []) {
          const image = await loadImage(sheet.image);
          if (image) loaded.sheets.push({ ...sheet, image });
        }
      }
      if (loaded.video || loaded.sheets.length) motion[kind] = loaded;
      else delete motion[kind];
      updateMotionControlsAvailability();
      return Boolean(motion[kind]);
    };

    const ensureMotion = async kind => {
      if (motion[kind]) return true;
      if (!authoredMotion(kind)) {
        updateMotionControlsAvailability();
        return false;
      }
      if (!motionLoadTasks[kind]) {
        motionLoadTasks[kind] = loadMotion(kind).finally(() => {
          delete motionLoadTasks[kind];
        });
      }
      return Boolean(await motionLoadTasks[kind]);
    };

    const motionPlaybackProfile = () => {
      const clip = motion.walk;
      if (!clip) return { ready: false };
      const bounds = clip.bounds || [0, 0, clip.frame_width || 256, clip.frame_height || 384];
      const zoom = Math.max(.5, Math.min(3, Number(shellState.pet && shellState.pet.roamZoom) || .6));
      const scale = Math.min(250 * zoom / Math.max(1, bounds[2]), 340 * zoom / Math.max(1, bounds[3])) * .985;
      const cycleSeconds = Number(clip.cycle_seconds) || Math.max(.1, Number(clip.frames || 1) / Math.max(1, Number(clip.fps || 1)));
      const sourceSpeed = Number(clip.ground_speed) || 64 / scale;
      const cycleDistance = (Number(clip.cycle_distance) || sourceSpeed * cycleSeconds) * scale;
      const travelOffsets = Array.isArray(clip.travel_offsets)
        ? clip.travel_offsets.map(value => Number(value) * scale).filter(Number.isFinite)
        : [];
      return { ready: true, walkSpeed: sourceSpeed * scale, cycleSeconds, cycleDistance, travelOffsets };
    };

    const publishMotionReadiness = () => {
      if (!shell || typeof shell.setPetMotionReady !== 'function') return;
      shell.setPetMotionReady(motion.walk ? motionPlaybackProfile() : { ready: false });
    };

    async function loadAvatar() {
      setStatus('Loading avatar…', 'busy');
      try {
        const response = await fetch(`assets/manifest.json?v=${assetRevision}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('missing avatar');
        manifest = await response.json();
        if (!manifest || !Array.isArray(manifest.visemes) || !manifest.frames) throw new Error('invalid avatar');
        syncLiveRigOverride();

        const firstFrame = manifest.frames.sil || manifest.frames[manifest.visemes[0]];
        const first = await loadImage(firstFrame && (firstFrame.open || firstFrame.shut));
        if (!first) throw new Error('avatar image failed to load');
        portraitWidth = Number(manifest.w) || first.naturalWidth || first.width;
        portraitHeight = Number(manifest.h) || first.naturalHeight || first.height;
        faceCanvas.width = portraitWidth;
        faceCanvas.height = portraitHeight;
        headCanvas.width = portraitWidth;
        headCanvas.height = portraitHeight;

        await Promise.all((manifest.visemes || []).map(async name => {
          const frame = manifest.frames[name] || {};
          const image = name === 'sil' && first ? first : await loadImage(frame.open || frame.shut);
          if (image) visemeImages.set(name, image);
        }));

        const layerJobs = [];
        for (const kind of ['eyes', 'gaze', 'brow', 'cheek', 'eyebag']) {
          const spec = manifest[kind];
          if (!spec) continue;
          for (const key of ['l', 'r']) {
            if (spec[key] && spec[key].src) {
              layerJobs.push(loadImage(spec[key].src).then(image => { layers[kind][key] = image; }));
            }
          }
        }
        if (manifest.body) {
          layerJobs.push(loadImage(manifest.body.image).then(image => { bodyImage = image; }));
          layerJobs.push(loadImage(manifest.body.head_mask).then(image => { headMask = image; }));
        }
        if (manifest.cutout && manifest.cutout.src) {
          layerJobs.push(loadImage(manifest.cutout.src).then(image => { cutoutImage = image; }));
        }
        await Promise.all(layerJobs);
        updateMotionControlsAvailability();
        // The authored atlas sheets are large. Loading one motion at a time
        // avoids a transient Chromium image-decoder spike that could leave
        // Walk missing even though the avatar bundle contains it.
        for (const kind of ['walk', 'idle', 'move']) await loadMotion(kind);
        publishMotionReadiness();
        ready = true;
        emptyState.classList.remove('show');
        setStatus(`${manifest.avatar && manifest.avatar.name ? manifest.avatar.name : 'OpenClam'} · ready`, 'good');
        void refreshAvatarCarousel();
        requestAnimationFrame(renderLoop);
      } catch (_) {
        manifest = null;
        for (const kind of Object.keys(motion)) delete motion[kind];
        updateMotionControlsAvailability();
        ready = false;
        setAvatarOnlyMotion(false);
        emptyState.classList.add('show');
        setStatus('No active avatar', '');
        if (shell && typeof shell.setPetHit === 'function') shell.setPetHit(true);
        void refreshAvatarCarousel();
        reportControlRects(true);
      }
    }

    const resizeCanvas = () => {
      pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const width = Math.max(1, Math.round(innerWidth * pixelRatio));
      const height = Math.max(1, Math.round(innerHeight * pixelRatio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    };

    const viewCrop = (meta, width, height, forcedView = null) => {
      const bounds = Array.isArray(meta && meta.bounds) && meta.bounds.length >= 4
        ? meta.bounds.map(Number) : [0, 0, width, height];
      const full = { x: bounds[0], y: bounds[1], w: Math.max(1, bounds[2]), h: Math.max(1, bounds[3]) };
      const view = forcedView || (shellState.pet && shellState.pet.view) || 'full';
      if (view === 'full') return full;
      if (view === 'face' || view === 'head' || view === 'bust') {
        const face = meta && meta.alignment && meta.alignment.face_bounds;
        if (Array.isArray(face) && face.length >= 4) {
          const marginX = face[2] * .7;
          const top = face[1] - face[3] * .65;
          const bottom = view === 'bust' ? face[1] + face[3] * 2.15 : face[1] + face[3] * 1.25;
          return {
            x: Math.max(0, face[0] - marginX),
            y: Math.max(0, top),
            w: Math.min(width, face[2] + marginX * 2),
            h: Math.min(height, bottom - Math.max(0, top)),
          };
        }
      }
      const portion = view === 'half' ? .66 : .82;
      return { x: full.x, y: full.y, w: full.w, h: Math.max(1, full.h * portion) };
    };

    const chatCloseUpGeometry = (crop, viewportWidth, viewportHeight, zoom = 1) => {
      const safeWidth = Math.max(1, Number(viewportWidth) || 1);
      const safeHeight = Math.max(1, Number(viewportHeight) || 1);
      const targetWidth = Math.max(240, safeWidth * .4);
      const targetHeight = Math.max(300, safeHeight * .72);
      const adjustment = Math.max(.42, Math.min(2.4, Number(zoom) || 1));
      const scale = Math.min(targetWidth / crop.w, targetHeight / crop.h) * adjustment;
      const rightOverflow = crop.w * scale * .035;
      const bottomOverflow = crop.h * scale * .08;
      return {
        scale,
        x: safeWidth + rightOverflow - (crop.x + crop.w) * scale,
        y: safeHeight + bottomOverflow - (crop.y + crop.h) * scale,
        crop,
      };
    };

    const cameraFor = (meta, width, height, forcedView = null) => {
      const fullChat = root.classList.contains('chat-mode');
      const requestedZoom = Number(shellState.pet && shellState.pet.zoom);
      if (fullChat && shellState.chatCloseUp) {
        const closeUpCrop = viewCrop(meta, width, height, 'bust');
        const baseZoom = Number(shellState.chatCloseUpBaseZoom);
        const closeUpZoom = Number.isFinite(requestedZoom) && Number.isFinite(baseZoom) && baseZoom > 0
          ? requestedZoom / baseZoom : 1;
        const fit = chatCloseUpGeometry(closeUpCrop, innerWidth, innerHeight, closeUpZoom);
        const offset = boundedChatAvatarOffset(chatAvatarOffset);
        return { ...fit, x: fit.x + offset.x, y: fit.y + offset.y };
      }
      if (!fullChat && shellState.desktopCloseUp) {
        const closeUpCrop = viewCrop(meta, width, height, 'bust');
        return chatCloseUpGeometry(closeUpCrop, innerWidth, innerHeight, 1);
      }
      const crop = viewCrop(meta, width, height, forcedView);
      const chatReserve = root.classList.contains('chat-open') && !fullChat
        && !(shellState.pet && shellState.pet.roam)
        ? Math.min(innerHeight * .38, chatDock.getBoundingClientRect().height + 24) : 0;
      const availableHeight = Math.max(160, innerHeight - chatReserve);
      const margin = shellState.pet && shellState.pet.roam ? .995 : .94;
      const baseScale = Math.min(innerWidth / crop.w, availableHeight / crop.h) * margin;
      const chatZoom = fullChat
        ? Math.max(.42, Math.min(2.4, (Number.isFinite(requestedZoom) ? requestedZoom : .6) / .6))
        : 1;
      const scale = baseScale * chatZoom;
      const offset = fullChat ? boundedChatAvatarOffset(chatAvatarOffset) : { x: 0, y: 0 };
      return {
        scale,
        x: innerWidth * .5 - (crop.x + crop.w * .5) * scale + offset.x,
        y: shellState.pet && shellState.pet.roam
          ? availableHeight - (crop.y + crop.h) * scale + offset.y
          : availableHeight * .5 - (crop.y + crop.h * .5) * scale + offset.y,
        crop,
      };
    };

    const motionTravelAtPhase = (clip, phase) => {
      const cycleSeconds = Number(clip && clip.cycle_seconds)
        || Math.max(.1, Number(clip && clip.frames || 1)
          / Math.max(1, Number(clip && clip.fps || 1)));
      const cycleDistance = Number(clip && clip.cycle_distance)
        || Number(clip && clip.ground_speed) * cycleSeconds || 64 * cycleSeconds;
      const offsets = Array.isArray(clip && clip.travel_offsets)
        ? clip.travel_offsets.map(Number).filter(Number.isFinite) : [];
      const wrapped = ((Number(phase) || 0) % 1 + 1) % 1;
      if (offsets.length < 2) return wrapped * cycleDistance;
      const position = wrapped * offsets.length;
      const index = Math.min(offsets.length - 1, Math.floor(position));
      const fraction = position - index;
      const current = offsets[index];
      const next = index + 1 < offsets.length ? offsets[index + 1] : cycleDistance;
      return current + (next - current) * fraction;
    };

    const motionCycleSeconds = clip => Number(clip && clip.cycle_seconds)
      || Math.max(.1, Number(clip && clip.frames || 1)
        / Math.max(1, Number(clip && clip.fps || 1)));

    const motionRoundSeconds = clip => {
      const authored = Number(clip && clip.frames) / Math.max(1, Number(clip && clip.fps));
      if (Number.isFinite(authored) && authored > 0) return authored;
      const decoded = Number(clip && clip.video && clip.video.duration);
      if (Number.isFinite(decoded) && decoded > 0) return decoded;
      return 9;
    };

    const motionTravelSincePhase = (clip, startPhase, elapsedSeconds) => {
      const cycleSeconds = motionCycleSeconds(clip);
      const cycleDistance = Number(clip && clip.cycle_distance)
        || Number(clip && clip.ground_speed) * cycleSeconds || 64 * cycleSeconds;
      const initial = ((Number(startPhase) || 0) % 1 + 1) % 1;
      const progress = initial + Math.max(0, Number(elapsedSeconds) || 0) / cycleSeconds;
      const completedCycles = Math.floor(progress);
      const phase = progress - completedCycles;
      const travelled = completedCycles * cycleDistance
        + motionTravelAtPhase(clip, phase) - motionTravelAtPhase(clip, initial);
      return { phase, travelled: Math.max(0, travelled) };
    };

    const createChatWalkState = now => ({
      mode: 'walk',
      direction: 1,
      edge: null,
      segmentStartedAt: Math.max(0, Number(now) || 0),
      holdUntil: 0,
      phaseStart: 0,
      phase: 0,
    });

    // Chat/Talk owns a renderer-local roam engine because the chat window is
    // the canvas. It mirrors Avatar mode's walk/ledge state machine: touch an
    // edge, play one complete authored Edge Idle round, turn, and cross to the
    // opposite edge without resetting the gait phase.
    const advanceChatWalkState = (state, now, walkClip, idleClip, span) => {
      const runtime = state || createChatWalkState(now);
      const sampledAt = Math.max(0, Number(now) || 0);
      const safeSpan = Math.max(1, Number(span) || 1);
      if (String(runtime.mode).startsWith('ledge-')) {
        const edge = runtime.mode === 'ledge-left' ? 'left' : 'right';
        if (sampledAt < Number(runtime.holdUntil)) {
          return {
            state: runtime, kind: 'idle', edge,
            direction: runtime.direction, phase: runtime.phase,
            position: edge === 'left' ? 0 : safeSpan,
          };
        }
        runtime.direction = edge === 'right' ? -1 : 1;
        runtime.mode = 'walk';
        runtime.edge = null;
        runtime.phaseStart = runtime.phase;
        runtime.segmentStartedAt = sampledAt;
      }
      const elapsed = Math.max(0, (sampledAt - Number(runtime.segmentStartedAt)) / 1000);
      const travel = motionTravelSincePhase(walkClip, runtime.phaseStart, elapsed);
      runtime.phase = travel.phase;
      if (travel.travelled >= safeSpan) {
        const edge = runtime.direction < 0 ? 'left' : 'right';
        runtime.mode = `ledge-${edge}`;
        runtime.edge = edge;
        runtime.holdUntil = sampledAt + motionRoundSeconds(idleClip) * 1000;
        return {
          state: runtime, kind: 'idle', edge,
          direction: runtime.direction, phase: runtime.phase,
          position: edge === 'left' ? 0 : safeSpan,
        };
      }
      return {
        state: runtime, kind: 'walk', edge: null,
        direction: runtime.direction, phase: runtime.phase,
        position: runtime.direction < 0 ? safeSpan - travel.travelled : travel.travelled,
      };
    };

    const chatWindowMotionFit = (kind, meta, width, height, now, clip = null, edge = 'right') => {
      const crop = viewCrop(meta, width, height, 'full');
      const floor = Math.max(190, innerHeight - 4);
      const requestedZoom = Number(shellState.pet && shellState.pet.zoom);
      const zoom = Math.max(.45, Math.min(2.4,
        (Number.isFinite(requestedZoom) ? requestedZoom : .6) / .6));
      const targetHeight = Math.max(150, Math.min(floor * .48, innerHeight * .46));
      const targetWidth = Math.max(110, innerWidth * .24);
      const scale = Math.min(targetWidth / crop.w, targetHeight / crop.h) * zoom;
      const left = 3;
      const right = Math.max(left, innerWidth - 3 - crop.w * scale);
      let figureLeft = right;
      let direction = -1;
      let phase = null;
      let motionKind = kind;
      let motionEdge = kind === 'idle' ? edge : null;
      if (kind === 'idle') {
        figureLeft = edge === 'left' ? 3 : innerWidth - 3 - crop.w * scale;
      }
      if (kind === 'walk') {
        const motionNow = canvasGesture && canvasGesture.positionAdjusting
          ? canvasGesture.motionAt : Number(now) || 0;
        const span = Math.max(1, right - left);
        const presentation = advanceChatWalkState(
          chatWalkState, motionNow, clip, motion.idle, span / scale);
        chatWalkState = presentation.state;
        motionKind = presentation.kind;
        motionEdge = presentation.edge;
        direction = presentation.direction;
        phase = presentation.phase;
        figureLeft = left + presentation.position * scale;
      }
      // Motion owns the chat-window lane just as Avatar mode owns the screen
      // lane. A saved conversational drag must not shift Walk past either
      // edge or lift its feet away from the chat-window floor.
      const offset = { x: 0, y: 0 };
      return {
        scale,
        x: figureLeft - crop.x * scale + offset.x,
        y: floor - (crop.y + crop.h) * scale + offset.y,
        crop,
        direction,
        phase,
        motionKind,
        motionEdge,
        offset,
      };
    };

    const chatWalkPresentationAt = now => {
      const clip = motion.walk;
      if (!clip) return { kind: 'walk', edge: null };
      const width = Number(clip.frame_width) || 720;
      const height = Number(clip.frame_height) || 1088;
      const metadata = { bounds: clip.bounds || [0, 0, width, height] };
      const fit = chatWindowMotionFit('walk', metadata, width, height, now, clip);
      return { kind: fit.motionKind || 'walk', edge: fit.motionEdge || null };
    };

    /* track-stabiliser:start */
    const XFADE = .070;
    const STANDBY_MAINTENANCE_MS = 250;
    const STANDBY_GAZE_SETTLE_MS = 420;
    const MIN_POSE = .020;
    const VISUAL_LEAD = XFADE * .5;
    const LOCKED_POSES = new Set(['sil', 'PP']);
    const VIS_ALT = {
      aa: ['aa', 'E'], E: ['E', 'aa', 'ih'], ih: ['ih', 'E'],
      oh: ['oh', 'ou'], ou: ['ou', 'oh'], oo: ['ou', 'oh'],
      PP: ['PP', 'FF', 'nn', 'sil'], FF: ['FF', 'PP', 'TH'],
      TH: ['TH', 'nn'], DD: ['nn', 'TH'], nn: ['nn', 'RR'],
      kk: ['nn', 'ih', 'E'], CH: ['ih', 'TH'], SS: ['ih', 'TH', 'E'],
      RR: ['RR', 'nn', 'ou'], sil: ['sil'], closed: ['sil'],
    };
    const nearestViseme = (name, valid) => {
      const value = String(name || '');
      if (valid.has(value)) return value;
      for (const alternative of VIS_ALT[value] || []) {
        if (valid.has(alternative)) return alternative;
      }
      return null;
    };
    const stabiliseTrack = (raw, duration, validNames = []) => {
      const fallback = (Array.isArray(raw) ? raw : []).map(event => String(
        Array.isArray(event) ? event[1] || '' : '')).filter(Boolean);
      const valid = new Set((Array.isArray(validNames) && validNames.length)
        ? validNames.map(String) : fallback);
      const compact = events => {
        const output = [];
        for (const event of events) {
          if (output.length && Math.abs(event[0] - output[output.length - 1][0]) < .0001) {
            output[output.length - 1] = event;
          } else if (!output.length || output[output.length - 1][1] !== event[1]) {
            output.push(event);
          }
        }
        return output;
      };
      let events = (Array.isArray(raw) ? raw : [])
        .filter(event => Array.isArray(event) && Number.isFinite(Number(event[0])))
        .map(event => {
          const viseme = nearestViseme(event[1], valid);
          return viseme ? [Math.max(0, Number(event[0])), viseme] : null;
        })
        .filter(Boolean)
        .sort((left, right) => left[0] - right[0]);
      events = compact(events);
      for (let pass = 0; pass < 5; pass += 1) {
        let changed = false;
        for (let index = 0; index + 1 < events.length; index += 1) {
          const dwell = events[index + 1][0] - events[index][0];
          const viseme = events[index][1];
          if (dwell >= MIN_POSE || LOCKED_POSES.has(viseme)) continue;
          const before = index ? events[index - 1][1] : null;
          const after = events[index + 1][1];
          const replacement = after && after !== 'sil' ? after : before;
          if (replacement && replacement !== viseme) {
            events[index][1] = replacement;
            changed = true;
          }
        }
        events = compact(events);
        if (!changed) break;
      }
      if (events.length && duration > 0 && events[events.length - 1][0] > duration) {
        events[events.length - 1][0] = duration;
      }
      return events;
    };
    /* track-stabiliser:end */

    /* live-mouth-sync:start */
    const LIVE_MOUTH_OPEN_RMS = .0065;
    const LIVE_MOUTH_CLOSE_RMS = .0035;
    const LIVE_MOUTH_RELEASE_MS = 48;
    const LIVE_MOUTH_DWELL_MS = 72;
    const LIVE_TALK_STATUS_RELEASE_MS = 520;
    const makeReactiveMouthState = () => ({ viseme: 'sil', changedAt: 0, audibleUntil: 0 });
    const makeLiveTalkAudioState = () => ({ speaking: false, audibleUntil: 0 });
    const reactiveMouthState = makeReactiveMouthState();

    const liveTalkAudioTransition = (state, signal, now) => {
      const rms = Math.max(0, Number(signal && signal.rms) || 0);
      const threshold = state.speaking ? LIVE_MOUTH_CLOSE_RMS : LIVE_MOUTH_OPEN_RMS;
      if (rms >= threshold) {
        state.speaking = true;
        state.audibleUntil = now + LIVE_TALK_STATUS_RELEASE_MS;
        return 'speaking';
      }
      if (!state.speaking) return null;
      if (now < state.audibleUntil) return 'speaking';
      state.speaking = false;
      state.audibleUntil = 0;
      return 'connected';
    };

    const measureAudioSignal = (timeData, frequencyData, sampleRate) => {
      const samples = timeData && timeData.length ? timeData : [];
      let squareSum = 0;
      let crossings = 0;
      let previous = 0;
      for (let index = 0; index < samples.length; index += 1) {
        const value = (Number(samples[index]) - 128) / 128;
        squareSum += value * value;
        if (index && ((value >= 0) !== (previous >= 0))) crossings += 1;
        previous = value;
      }
      const rms = samples.length ? Math.sqrt(squareSum / samples.length) : 0;
      const bands = { low: [80, 520], mid: [520, 2200], high: [2200, 7200] };
      const totals = { low: 0, mid: 0, high: 0 };
      const counts = { low: 0, mid: 0, high: 0 };
      let weightedFrequency = 0;
      let spectralEnergy = 0;
      const spectrum = frequencyData && frequencyData.length ? frequencyData : [];
      const nyquist = Math.max(1, Number(sampleRate) || 48000) * .5;
      for (let index = 1; index < spectrum.length; index += 1) {
        const frequency = index / spectrum.length * nyquist;
        if (frequency > bands.high[1]) break;
        const magnitude = Math.max(0, Number(spectrum[index]) || 0) / 255;
        const energy = magnitude * magnitude;
        spectralEnergy += energy;
        weightedFrequency += frequency * energy;
        for (const name of ['low', 'mid', 'high']) {
          if (frequency >= bands[name][0] && frequency < bands[name][1]) {
            totals[name] += energy;
            counts[name] += 1;
            break;
          }
        }
      }
      return {
        rms,
        relative: 0,
        low: Math.sqrt(totals.low / Math.max(1, counts.low)),
        mid: Math.sqrt(totals.mid / Math.max(1, counts.mid)),
        high: Math.sqrt(totals.high / Math.max(1, counts.high)),
        centroid: spectralEnergy ? Math.min(1, weightedFrequency / spectralEnergy / bands.high[1]) : 0,
        zcr: samples.length > 1 ? crossings / (samples.length - 1) : 0,
      };
    };

    const firstAvailableViseme = (valid, names) => {
      for (const name of names) if (valid.has(name)) return name;
      return valid.has('sil') ? 'sil' : [...valid][0] || 'sil';
    };

    const classifyAudioViseme = (signal, validNames) => {
      const valid = new Set((Array.isArray(validNames) ? validNames : []).map(String));
      const intensity = Math.max(0, Math.min(1, Number(signal.relative) || 0));
      const low = Number(signal.low) || 0;
      const mid = Number(signal.mid) || 0;
      const high = Number(signal.high) || 0;
      const centroid = Number(signal.centroid) || 0;
      const zcr = Number(signal.zcr) || 0;
      if ((zcr > .145 && high > low * .82) || high > Math.max(low, mid) * 1.22) {
        return firstAvailableViseme(valid, ['SS', 'FF', 'TH', 'ih']);
      }
      if (centroid < .31 && low > high * 1.12) {
        return firstAvailableViseme(valid, intensity > .72 ? ['oh', 'aa', 'ou'] : ['ou', 'RR', 'oh']);
      }
      if (intensity > .78) return firstAvailableViseme(valid, ['aa', 'oh', 'E']);
      if (centroid > .55) return firstAvailableViseme(valid, intensity > .46 ? ['E', 'ih', 'SS'] : ['ih', 'nn']);
      if (intensity > .48) return firstAvailableViseme(valid, ['E', 'oh', 'aa']);
      return firstAvailableViseme(valid, ['ih', 'nn', 'RR']);
    };

    const reactiveAudioViseme = (state, signal, now, validNames) => {
      const rms = Math.max(0, Number(signal && signal.rms) || 0);
      const threshold = state.viseme === 'sil' ? LIVE_MOUTH_OPEN_RMS : LIVE_MOUTH_CLOSE_RMS;
      const audible = rms >= threshold;
      if (audible) state.audibleUntil = now + LIVE_MOUTH_RELEASE_MS;
      if (!audible) {
        if (now >= state.audibleUntil) {
          state.viseme = 'sil';
          state.changedAt = now;
        }
        return state.viseme;
      }
      const candidate = classifyAudioViseme(signal, validNames);
      if (state.viseme === 'sil' || (candidate !== state.viseme && now - state.changedAt >= LIVE_MOUTH_DWELL_MS)) {
        state.viseme = candidate;
        state.changedAt = now;
      }
      return state.viseme;
    };
    /* live-mouth-sync:end */

    const speechTime = () => audioContext ? audioContext.currentTime - speechStart : 0;

    const hasAttachedAgentAudio = () => Boolean(live && live.audioAttachments && live.audioAttachments.size);

    const syncLiveTalkAudioStatus = (session, now) => {
      if (live !== session || session.ending || !session.agentReady || !session.audioAttachments.size) return;
      const state = session.remoteAudioState || (session.remoteAudioState = makeLiveTalkAudioState());
      const status = liveTalkAudioTransition(state, audioSignal, now);
      if (status === 'speaking') setStatus('Live Talk · speaking', 'live');
      else if (status === 'connected') setStatus('Live Talk · connected', 'live');
    };

    const desiredViseme = now => {
      if (speechSource && speechTrack.length) {
        const time = speechTime() + VISUAL_LEAD;
        while (speechTrackIndex + 1 < speechTrack.length && Number(speechTrack[speechTrackIndex + 1][0]) <= time) speechTrackIndex += 1;
        return String((speechTrack[speechTrackIndex] && speechTrack[speechTrackIndex][1]) || 'sil');
      }
      if (speechSource || hasAttachedAgentAudio()) {
        const available = manifest && manifest.visemes ? manifest.visemes : ['sil'];
        return reactiveAudioViseme(reactiveMouthState, audioSignal, now, available);
      }
      reactiveMouthState.viseme = 'sil';
      reactiveMouthState.audibleUntil = 0;
      return 'sil';
    };

    const blinkAmount = (now, reduce = false) => {
      // A blink and its dependent lower-lid/under-eye strip are decorative
      // renderer motion.  Respect Reduced Motion immediately, including in
      // the middle of a blink, and defer the next one until motion is allowed
      // again instead of resuming an in-progress close.
      if (reduce) {
        blinkStartedAt = 0;
        nextBlinkAt = Math.max(nextBlinkAt, now + 1000);
        return 0;
      }
      if (!blinkStartedAt && now >= nextBlinkAt) blinkStartedAt = now;
      if (!blinkStartedAt) return 0;
      const elapsed = now - blinkStartedAt;
      if (elapsed < 90) return elapsed / 90;
      if (elapsed < 135) return 1;
      if (elapsed < 250) return 1 - (elapsed - 135) / 115;
      blinkStartedAt = 0;
      nextBlinkAt = now + 1900 + Math.random() * 4300;
      return 0;
    };

    const microBrow = (now, reduce = false) => {
      if (reduce) return 0;
      if (now >= nextMicroExpression) {
        microExpression = { value: Math.random() * 2 - 1, started: now, duration: 900 + Math.random() * 900 };
        nextMicroExpression = now + 2800 + Math.random() * 4300;
      }
      const phase = (now - microExpression.started) / microExpression.duration;
      return phase > 0 && phase < 1 ? microExpression.value * Math.sin(Math.PI * phase) : 0;
    };

    const speechExpressionAt = (now, speaking, state, reduce = false) => {
      const zero = { brow: 0, underEye: 0, squeeze: 0, asymmetry: 0 };
      const interpolate = (from, to, amount) => {
        const t = Math.max(0, Math.min(1, amount));
        const eased = t * t * (3 - 2 * t);
        return Object.fromEntries(Object.keys(zero).map(key => [key,
          Number(from[key] || 0) + (Number(to[key] || 0) - Number(from[key] || 0)) * eased,
        ]));
      };
      if (reduce) {
        state.mode = 'idle';
        state.value = zero;
        return zero;
      }
      if (!speaking) {
        if (state.mode === 'speaking') {
          state.from = { ...state.value };
          state.to = zero;
          state.started = now;
          state.duration = 280;
          state.mode = 'release';
        }
        if (state.mode !== 'release') return zero;
        const value = interpolate(state.from, state.to,
          (now - state.started) / Math.max(1, state.duration));
        state.value = value;
        if (now - state.started >= state.duration) state.mode = 'idle';
        return value;
      }
      if (state.mode !== 'speaking' || now >= state.nextAt) {
        state.from = { ...(state.value || zero) };
        state.to = {
          // Tiny semi-random phrases: a soft knit/raise and an under-eye
          // bunch follow speech together, but never repeat on a metronome.
          brow: .22 + Math.random() * .48,
          underEye: .24 + Math.random() * .44,
          squeeze: Math.random() < .28 ? 1.35 : 0,
          asymmetry: (Math.random() * 2 - 1) * .14,
        };
        state.started = now;
        state.duration = 480 + Math.random() * 540;
        state.nextAt = now + state.duration + 120 + Math.random() * 260;
        state.mode = 'speaking';
      }
      const value = interpolate(state.from, state.to,
        (now - state.started) / Math.max(1, state.duration));
      state.value = value;
      return value;
    };

    // Cursor attention is measured from the avatar's eyes rather than from the
    // centre of its transparent window. The tanh curve is lively nearby and
    // asymptotically bounded to the calibrated atlas, so a cursor on another
    // display still reads clearly without ever asking the eyes for an
    // anatomically impossible pose.
    const cursorGazeTarget = (point, anchor, ranges, viewport) => {
      const eye = anchor && Number.isFinite(anchor.x) && Number.isFinite(anchor.y)
        ? anchor : { x: 0, y: 0 };
      const tracked = point && point.seen && Number.isFinite(point.x) && Number.isFinite(point.y)
        ? point : eye;
      const width = Math.max(1, Number(viewport && viewport.width) || 1);
      const height = Math.max(1, Number(viewport && viewport.height) || 1);
      const limitX = Math.max(0, Number(ranges && ranges.x) || 0);
      const limitY = Math.max(0, Number(ranges && ranges.y) || 0);
      const directionX = Math.tanh((tracked.x - eye.x) / Math.max(64, width * .12));
      const directionY = Math.tanh((tracked.y - eye.y) / Math.max(84, height * .16));
      return {
        x: Math.max(-limitX, Math.min(limitX, directionX * limitX * .84)),
        y: Math.max(-limitY, Math.min(limitY, directionY * limitY * .78)),
      };
    };

    const smoothCursorGaze = (state, target, now, reduce = false) => {
      const elapsed = state.at > 0 ? Math.max(1, Math.min(80, now - state.at)) : 16;
      const response = reduce ? 1 : 1 - Math.exp(-elapsed / 72);
      state.x += (target.x - state.x) * response;
      state.y += (target.y - state.y) * response;
      state.at = now;
      return { x: state.x, y: state.y };
    };

    const avatarFaceAnchor = () => {
      const geometry = lastBodyGeometry;
      const face = geometry && geometry.metadata && geometry.metadata.alignment
        && geometry.metadata.alignment.face_bounds;
      if (!geometry || !Array.isArray(face) || face.length < 4) {
        return { x: innerWidth * .5, y: innerHeight * .42 };
      }
      return {
        x: geometry.fit.x + (Number(face[0]) + Number(face[2]) * .5) * geometry.fit.scale,
        y: geometry.fit.y + (Number(face[1]) + Number(face[3]) * .5) * geometry.fit.scale,
      };
    };

    const drawStripState = (target, image, geometry, values, value, row = 0) => {
      if (!target || !image || !geometry || !Array.isArray(geometry.box)) return;
      const box = geometry.box.map(Number);
      const width = box[2];
      const height = box[3];
      if (!(width > 0 && height > 0)) return;
      const index = nearestIndex(values, value);
      const states = Math.max(1, values.length);
      const sourceY = (index + row * states) * height;
      target.drawImage(image, 0, sourceY, width, height, box[0], box[1], width, height);
    };

    const composeHead = now => {
      const wanted = desiredViseme(now);
      if (wanted !== currentViseme && visemeImages.has(wanted)) {
        previousViseme = currentViseme;
        currentViseme = wanted;
        // A timed local track can lead its sound to centre the blend. Live Talk
        // sees the exact samples being played, so begin halfway through the
        // crossfade instead of adding another full texture-frame of latency.
        visemeChangedAt = hasAttachedAgentAudio() && !speechTrack.length
          ? now - XFADE * 500 : now;
      }
      const oldImage = visemeImages.get(previousViseme) || visemeImages.get('sil') || [...visemeImages.values()][0];
      const newImage = visemeImages.get(currentViseme) || oldImage;
      const blend = Math.max(0, Math.min(1, (now - visemeChangedAt) / (XFADE * 1000)));
      faceContext.setTransform(1, 0, 0, 1, 0, 0);
      faceContext.globalCompositeOperation = 'source-over';
      faceContext.globalAlpha = 1;
      faceContext.clearRect(0, 0, portraitWidth, portraitHeight);
      if (oldImage) faceContext.drawImage(oldImage, 0, 0, portraitWidth, portraitHeight);
      if (newImage && newImage !== oldImage) {
        faceContext.globalAlpha = blend;
        faceContext.drawImage(newImage, 0, 0, portraitWidth, portraitHeight);
        faceContext.globalAlpha = 1;
      }

      const blink = blinkAmount(now, reducedMotion.matches);
      const gazeXValues = manifest.gaze && manifest.gaze.dxs || [0];
      const gazeYValues = manifest.gaze && manifest.gaze.dys || [0];
      const gazeTarget = cursorGazeTarget(pointer, avatarFaceAnchor(), {
        x: Math.max(...gazeXValues.map(value => Math.abs(Number(value))), 0),
        y: Math.max(...gazeYValues.map(value => Math.abs(Number(value))), 0),
      }, { width: innerWidth, height: innerHeight });
      const gaze = smoothCursorGaze(gazeState, gazeTarget, now, reducedMotion.matches);
      const browValues = manifest.brow && manifest.brow.dys || [0];
      const browTop = Math.max(...browValues.map(value => Math.abs(Number(value))), 0);
      const liveAudioSpeaking = Boolean(
        live && live.remoteAudioState && live.remoteAudioState.speaking);
      const speaking = Boolean(agentSpeaking || speechSource || liveAudioSpeaking);
      const upperFaceSpeaking = speaking && !reducedMotion.matches;
      const expression = speechExpressionAt(now, upperFaceSpeaking,
        speechExpressionState, reducedMotion.matches);
      const browGain = rigExpressionGain('brows', 10, 10);
      const eyebagGain = rigExpressionGain('eyebags', 35, 35);
      const browValue = (upperFaceSpeaking
        ? -(.24 + expression.brow * .48) * browGain
        : -.18 * microBrow(now, reducedMotion.matches) * browGain) * browTop;

      if (manifest.brow) {
        const squeeze = manifest.brow.sqs || [0];
        const row = nearestIndex(squeeze, upperFaceSpeaking ? expression.squeeze : 0);
        for (const key of ['l', 'r']) {
          const side = key === 'l' ? 1 - expression.asymmetry : 1 + expression.asymmetry;
          drawStripState(faceContext, layers.brow[key], manifest.brow[key], browValues,
            browValue * side, row);
        }
      }
      if (manifest.cheek) {
        const values = manifest.cheek.ups || [0];
        const value = speaking ? Number(values[values.length - 1] || 0) * .35 : 0;
        for (const key of ['l', 'r']) drawStripState(faceContext, layers.cheek[key], manifest.cheek[key], values, value);
      }
      if (manifest.eyebag) {
        const values = manifest.eyebag.ups || [0];
        const maximum = Number(values[values.length - 1] || 0);
        const blinkValue = blink * maximum * .3;
        const speechValue = upperFaceSpeaking
          ? (.20 + expression.underEye * .42) * eyebagGain * maximum : 0;
        for (const key of ['l', 'r']) {
          const side = key === 'l' ? 1 - expression.asymmetry : 1 + expression.asymmetry;
          drawStripState(faceContext, layers.eyebag[key], manifest.eyebag[key], values,
            Math.max(blinkValue, speechValue * side));
        }
      }
      if (manifest.gaze) {
        const row = nearestIndex(gazeYValues, gaze.y);
        for (const key of ['l', 'r']) drawStripState(faceContext, layers.gaze[key], manifest.gaze[key], gazeXValues, gaze.x, row);
      }
      if (manifest.eyes && Array.isArray(manifest.eyes.states)) {
        const states = manifest.eyes.states;
        for (const key of ['l', 'r']) {
          const image = layers.eyes[key];
          const geometry = manifest.eyes[key];
          if (!image || !geometry || !Array.isArray(geometry.box) || blink <= .004) continue;
          const box = geometry.box.map(Number);
          let high = 0;
          while (high < states.length - 1 && Number(states[high]) < blink) high += 1;
          const low = high - 1;
          const lowValue = low >= 0 ? Number(states[low]) : 0;
          const highValue = Number(states[high]) || 1;
          const blendValue = Math.max(0, Math.min(1, (blink - lowValue) / Math.max(.0001, highValue - lowValue)));
          if (low >= 0) faceContext.drawImage(image, 0, low * box[3], box[2], box[3], box[0], box[1], box[2], box[3]);
          faceContext.globalAlpha = blendValue;
          faceContext.drawImage(image, 0, high * box[3], box[2], box[3], box[0], box[1], box[2], box[3]);
          faceContext.globalAlpha = 1;
        }
      }

      if (cutoutImage) {
        faceContext.globalCompositeOperation = 'destination-in';
        faceContext.drawImage(cutoutImage, 0, 0, portraitWidth, portraitHeight);
        faceContext.globalCompositeOperation = 'source-over';
      }

      headContext.setTransform(1, 0, 0, 1, 0, 0);
      headContext.globalCompositeOperation = 'source-over';
      headContext.globalAlpha = 1;
      headContext.clearRect(0, 0, portraitWidth, portraitHeight);
      headContext.drawImage(faceCanvas, 0, 0);
      if (headMask) {
        headContext.globalCompositeOperation = 'destination-in';
        headContext.drawImage(headMask, 0, 0, portraitWidth, portraitHeight);
        headContext.globalCompositeOperation = 'source-over';
      }
    };

    const motionPhaseAt = (state, clip, epochMs) => {
      const wrapped = (((Number(state && state.phase) || 0) % 1) + 1) % 1;
      if (!state || !state.enabled || state.mode !== 'walk') return wrapped;
      const sampledAt = Number(state.sampledAt);
      if (!Number.isFinite(sampledAt) || !Number.isFinite(epochMs)) return wrapped;
      const cycleSeconds = Number(clip && clip.cycle_seconds)
        || Math.max(.1, Number(clip && clip.frames || 1) / Math.max(1, Number(clip && clip.fps || 1)));
      // Main owns screen travel and periodically phase-locks this clock. Fill
      // only the short interval between IPC packets so a 24fps atlas follows
      // the display clock instead of inheriting 16–67ms packet jitter.
      const elapsedMs = Math.max(0, Math.min(100, epochMs - sampledAt));
      return (wrapped + elapsedMs / (cycleSeconds * 1000)) % 1;
    };

    const motionFrame = (clip, now, phase = null) => {
      if (!clip || !clip.frames || !clip.sheets || !clip.sheets.length) return null;
      const raw = phase === null
        ? Math.floor(now / 1000 * (Number(clip.fps) || 12)) % clip.frames
        : Math.min(clip.frames - 1, Math.floor((((phase % 1) + 1) % 1) * clip.frames));
      const sheet = clip.sheets.find(value => raw >= value.first && raw < value.first + value.count);
      if (!sheet) return null;
      const local = raw - sheet.first;
      return {
        sheet,
        index: raw,
        sx: (local % sheet.columns) * clip.frame_width,
        sy: Math.floor(local / sheet.columns) * clip.frame_height,
      };
    };

    const clearStage = () => {
      context.setTransform(1, 0, 0, 1, 0, 0);
      context.clearRect(0, 0, canvas.width, canvas.height);
    };

    const IDLE_SEAM_BLEND_SECONDS = 2 / 3;
    const clipVideos = clip => [clip && clip.video, clip && clip.loopVideo].filter(Boolean);

    const resetIdlePlayback = clip => {
      const videos = clipVideos(clip);
      clip.idlePlayback = { active: 0, fading: false, mix: 0 };
      videos.forEach((video, index) => {
        video.pause();
        try { video.currentTime = 0; } catch (_) { /* poster covers a pending seek */ }
        if (index === 0) video.play().catch(() => {});
      });
    };

    // Keep two copies of the small GPU-decoded stream warm, but run the
    // second one only for the final 2/3 second of each six-second idle. The
    // outgoing decoded frame remains on the canvas while the incoming copy
    // starts at zero, so neither a seek gap nor the bad endpoint jump can
    // flash. At 12fps the dissolve is eight source frames, and the extra
    // decoder is active for only ~11% of the loop.
    const idleVideoFrames = (clip, frozen = false) => {
      const videos = clipVideos(clip);
      if (videos.length < 2) return videos.length ? [{ video: videos[0], alpha: 1 }] : [];
      const playback = clip.idlePlayback || (clip.idlePlayback = {
        active: 0, fading: false, mix: 0,
      });
      let active = videos[playback.active];
      let standby = videos[1 - playback.active];
      if (frozen) {
        for (const video of videos) if (!video.paused) video.pause();
      } else if (!playback.fading) {
        if (active.paused && !active.ended) active.play().catch(() => {});
        const duration = Number(active.duration);
        if (active.ended || (Number.isFinite(duration)
            && duration > IDLE_SEAM_BLEND_SECONDS
            && active.currentTime >= duration - IDLE_SEAM_BLEND_SECONDS)) {
          playback.fading = true;
          playback.mix = 0;
          standby.pause();
          try { standby.currentTime = 0; } catch (_) { /* keep the outgoing frame */ }
          standby.play().catch(() => {});
        }
      }
      if (!frozen && playback.fading) {
        if (!active.ended && active.paused) active.play().catch(() => {});
        if (standby.paused && !standby.ended) standby.play().catch(() => {});
      }
      if (!playback.fading) return [{ video: active, alpha: 1 }];
      const standbyReady = standby.readyState >= 2 && !standby.seeking;
      if (!standbyReady) return [{ video: active, alpha: 1 }];
      if (!frozen) {
        playback.mix = Math.max(0, Math.min(1,
          Number(standby.currentTime) / IDLE_SEAM_BLEND_SECONDS));
      }
      if (playback.mix >= .985) {
        active.pause();
        try { active.currentTime = 0; } catch (_) { /* pre-roll on the next pass */ }
        playback.active = 1 - playback.active;
        playback.fading = false;
        playback.mix = 0;
        active = standby;
        return [{ video: active, alpha: 1 }];
      }
      return [
        { video: active, alpha: 1 - playback.mix },
        { video: standby, alpha: playback.mix },
      ];
    };

    const beginMotionPresentation = (kind, edge, clip) => {
      const key = `${kind}:${edge || ''}`;
      if (key === presentedMotionKey) return key;
      presentedMotionKey = key;
      paintedMotionKey = '';
      for (const otherClip of Object.values(motion)) {
        if (otherClip === clip) continue;
        for (const video of clipVideos(otherClip)) if (!video.paused) video.pause();
      }
      if (clip.video) {
        if (kind === 'idle' && clip.loopVideo) resetIdlePlayback(clip);
        else {
          clip.video.pause();
          try { clip.video.currentTime = 0; } catch (_) { /* poster covers a pending seek */ }
          clip.video.play().catch(() => {});
        }
      }
      return key;
    };

    const endMotionPresentation = () => {
      if (!presentedMotionKey) return;
      presentedMotionKey = '';
      paintedMotionKey = '';
      for (const clip of Object.values(motion)) {
        for (const video of clipVideos(clip)) if (!video.paused) video.pause();
      }
    };

    const drawMotion = (kind, now, edge = null) => {
      const clip = motion[kind];
      if (!clip) return false;
      const chatScoped = root.classList.contains('chat-mode')
        && (manualMotionKind === kind
          || (kind === 'idle' && (edge === 'left' || edge === 'right')));
      const displayEdge = chatScoped && kind === 'idle'
        ? (edge === 'left' ? 'left' : 'right') : edge;
      const presentationKey = beginMotionPresentation(kind, displayEdge, clip);
      const width = Number(clip.frame_width) || 720;
      const height = Number(clip.frame_height) || 1088;
      const metadata = { bounds: clip.bounds || [0, 0, width, height] };
      const fit = chatScoped && (kind === 'walk' || kind === 'idle')
        ? chatWindowMotionFit(kind, metadata, width, height, now, clip, displayEdge)
        : cameraFor(metadata, width, height, 'full');
      const direction = chatScoped && kind === 'walk'
        ? fit.direction : Number(roamState.direction) || 1;
      const freeIdle = kind === 'idle' && clip.anchor_mode === 'free';
      const mirror = kind === 'walk' ? direction < 0 : displayEdge === 'right' && !freeIdle;
      const phase = chatScoped && kind === 'walk' ? fit.phase
        : kind === 'walk' && roamState.enabled
          ? motionPhaseAt(roamState, clip, performance.timeOrigin + now) : null;
      const frame = clip.video ? null : motionFrame(clip, now, phase);
      let x = fit.x;
      if (chatScoped && kind === 'idle') {
        const anchors = clip.edge_anchors || {};
        const frameAnchors = Array.isArray(anchors[`${displayEdge}_frames`])
          ? anchors[`${displayEdge}_frames`] : [];
        const support = Number(frameAnchors[frame ? frame.index : 0]);
        if (displayEdge === 'left') {
          const leftSupport = Number.isFinite(support) ? support
            : Number(anchors.left) || Number(fit.crop.x);
          x = 3 - leftSupport * fit.scale;
        } else {
          const rightSupport = Number.isFinite(support) ? support
            : Number(anchors.right) || Number(fit.crop.x + fit.crop.w);
          x = innerWidth - 3 - rightSupport * fit.scale;
        }
      }
      if (kind === 'idle' && displayEdge && !freeIdle && !chatScoped) {
        const anchors = clip.edge_anchors || {};
        const frameAnchors = Array.isArray(anchors.left_frames) ? anchors.left_frames : [];
        const support = Number(frameAnchors[frame ? frame.index : 0]);
        const leftSupport = Number.isFinite(support) ? support : Number(anchors.left) || 0;
        x = displayEdge === 'left' ? 3 - leftSupport * fit.scale : innerWidth - 3 - (width - leftSupport) * fit.scale;
      }

      const frozen = roamState.enabled && roamState.mode === 'stand';
      let videoFrames = [];
      if (clip.video) {
        if (kind === 'idle' && clip.loopVideo) {
          videoFrames = idleVideoFrames(clip, frozen);
        } else {
          if (frozen && !clip.video.paused) clip.video.pause();
          else if (!frozen && clip.video.paused && !clip.video.ended) clip.video.play().catch(() => {});
          videoFrames = [{ video: clip.video, alpha: 1 }];
        }
      }
      const videoReady = Boolean(videoFrames.length && videoFrames.every(
        value => value.video.readyState >= 2 && !value.video.seeking));
      const fallback = !videoReady && !frame ? clip.posterImage : null;
      // A transient decoder state must hold the last valid transparent frame,
      // never clear the stage and expose the standing plate for one refresh.
      if (!videoReady && !frame && !fallback) return paintedMotionKey === presentationKey;

      clearStage();
      context.save();
      context.setTransform(pixelRatio * fit.scale, 0, 0, pixelRatio * fit.scale, pixelRatio * x, pixelRatio * fit.y);
      if (mirror) { context.translate(width, 0); context.scale(-1, 1); }
      if (videoReady) {
        for (const value of videoFrames) {
          context.globalAlpha = value.alpha;
          context.drawImage(value.video, 0, 0, width, height);
        }
        context.globalAlpha = 1;
      } else if (frame) {
        context.drawImage(frame.sheet.image, frame.sx, frame.sy, width, height, 0, 0, width, height);
      } else {
        context.drawImage(fallback, 0, 0, width, height);
      }
      context.restore();
      paintedMotionKey = presentationKey;
      return true;
    };

    // Speech should be carried by the mouth and expression bank, not by a
    // metronomic full-body rock. Keep a small, slow counter-sway and breath so
    // the plate remains alive; reduced-motion users get a completely stable
    // silhouette while lip sync itself stays available.
    const bodyMotionAt = (now, speaking, state, reduce = false) => {
      const target = speaking ? 1 : 0;
      if (reduce) {
        state.speechBlend = target;
        state.at = now;
        return { sway: 0, breathe: 1 };
      }
      const elapsed = state.at > 0 ? Math.max(1, Math.min(80, now - state.at)) : 16;
      const responseTime = target > state.speechBlend ? 260 : 420;
      const response = 1 - Math.exp(-elapsed / responseTime);
      state.speechBlend += (target - state.speechBlend) * response;
      state.speechBlend = Math.max(0, Math.min(1, state.speechBlend));
      state.at = now;
      const idle = {
        sway: Math.sin(now / 2200) * .0056,
        breathe: 1 + Math.sin(now / 1250) * .0025,
      };
      const speech = {
        sway: Math.sin(now / 1050) * .0011 + Math.sin(now / 2600) * .00025,
        breathe: 1 + Math.sin(now / 1650) * .0009,
      };
      const blend = state.speechBlend;
      return {
        sway: idle.sway + (speech.sway - idle.sway) * blend,
        breathe: idle.breathe + (speech.breathe - idle.breathe) * blend,
      };
    };

    const drawAvatar = (now, presentation = '') => {
      clearStage();
      composeHead(now);
      const hasBody = Boolean(bodyImage && manifest.body);
      const image = hasBody ? bodyImage : faceCanvas;
      const width = image.naturalWidth || image.width || portraitWidth;
      const height = image.naturalHeight || image.height || portraitHeight;
      const metadata = hasBody ? manifest.body : {
        bounds: manifest.cutout && manifest.cutout.bounds || [0, 0, width, height],
        alignment: { face_bounds: [width * .2, height * .08, width * .6, height * .64] },
      };
      const chatIdleEdge = presentation === 'chat-edge-idle-left' ? 'left'
        : presentation === 'chat-edge-idle-right' ? 'right' : null;
      const fit = chatIdleEdge
        ? chatWindowMotionFit('idle', metadata, width, height, now, null, chatIdleEdge)
        : cameraFor(metadata, width, height);
      const bounds = metadata.bounds || [0, 0, width, height];
      const pivotX = bounds[0] + bounds[2] * .5;
      const pivotY = bounds[1] + bounds[3];
      const liveAudioSpeaking = Boolean(
        live && live.remoteAudioState && live.remoteAudioState.speaking);
      const { sway, breathe } = bodyMotionAt(
        now, Boolean(agentSpeaking || speechSource || liveAudioSpeaking),
        bodyMotionState, reducedMotion.matches);

      context.save();
      context.setTransform(pixelRatio * fit.scale, 0, 0, pixelRatio * fit.scale, pixelRatio * fit.x, pixelRatio * fit.y);
      context.translate(pivotX, pivotY);
      context.rotate(sway + (chatIdleEdge === 'left' ? .018
        : chatIdleEdge === 'right' ? -.018 : 0));
      context.scale(breathe, 1);
      context.translate(-pivotX, -pivotY);
      context.drawImage(image, 0, 0, width, height);
      if (hasBody && headMask && Array.isArray(manifest.body.face_transform) && manifest.body.face_transform.length === 2) {
        const matrix = manifest.body.face_transform;
        context.save();
        context.transform(matrix[0][0], matrix[1][0], matrix[0][1], matrix[1][1], matrix[0][2], matrix[1][2]);
        context.drawImage(headCanvas, 0, 0, portraitWidth, portraitHeight);
        context.restore();
      }
      context.restore();

      lastBodyGeometry = { fit, width, height, metadata, pivotX, pivotY, sway, breathe, hasBody };
    };

    const chatStandbyEdge = value => Number(value && value.x) < 0 ? 'left' : 'right';
    const standbyIdleDelay = inChat => inChat ? 10000 : 12000;
    const edgeIdleActive = now => {
      const inChat = root.classList.contains('chat-mode');
      return Boolean((motion.idle || inChat) && !roamState.enabled
        && !speechSource && !agentSpeaking && !live && !ptt && !turnController
        && now - lastActivity > standbyIdleDelay(inChat));
    };

    const roamMotionKind = (mode, presentationMode = null) => {
      const presented = mode === 'stand' ? String(presentationMode || 'walk') : String(mode || '');
      return presented === 'walk' ? 'walk' : presented.startsWith('ledge-') ? 'idle' : null;
    };

    const roamPresentationSignature = value => [
      Boolean(value && value.enabled),
      String(value && value.mode || ''),
      String(value && value.presentationMode || ''),
      Number(value && value.direction) || 1,
      String(value && value.edge || ''),
    ].join(':');

    const drawPresentedMotion = (kind, now, edge = null) => {
      const rendered = drawMotion(kind, now, edge);
      setAvatarOnlyMotion(rendered && (kind === 'walk' || kind === 'idle'));
      return rendered;
    };

    const paintFrame = now => {
      resizeCanvas();
      if (!ready) { clearStage(); setAvatarOnlyMotion(false); return; }

      if (manualMotionKind) {
        const inChat = root.classList.contains('chat-mode');
        const chatWalk = inChat && manualMotionKind === 'walk'
          ? chatWalkPresentationAt(now) : null;
        const presentedKind = chatWalk ? chatWalk.kind : manualMotionKind;
        const presentedEdge = chatWalk ? chatWalk.edge : side;
        const rendered = inChat
          ? drawMotion(presentedKind, now, presentedEdge)
          : drawPresentedMotion(presentedKind, now, presentedEdge);
        if (rendered) {
          if (inChat) setAvatarOnlyMotion(false);
          return;
        }
        if (inChat && presentedKind === 'idle') {
          endMotionPresentation();
          setAvatarOnlyMotion(false);
          drawAvatar(now, `chat-edge-idle-${presentedEdge || chatStandbyEdge(chatAvatarOffset)}`);
          return;
        }
        manualMotionKind = null;
        chatWalkState = null;
      }

      if (roamState.enabled) {
        // Intentional hover pauses the roam engine in `stand`. Keep the held
        // Walk atlas frame and pure-alpha presentation instead of replacing
        // it with the static avatar and restoring the hidden chrome.
        const kind = roamMotionKind(roamState.mode, roamState.presentationMode);
        if (kind && drawPresentedMotion(kind, now, roamState.edge || side)) return;
      }
      if (now < moveUntil && drawPresentedMotion('move', now)) return;
      if (moveUntil && now >= moveUntil) {
        moveUntil = 0;
        movesButton.classList.remove('showing');
      }
      if (edgeIdleActive(now)) {
        const inChat = root.classList.contains('chat-mode');
        const idleEdge = inChat ? chatStandbyEdge(chatAvatarOffset) : side;
        if (!idleDocked) {
          idleDocked = true;
          if (!inChat && shell && typeof shell.dockPet === 'function') shell.dockPet();
        }
        if (inChat) {
          const rendered = motion.idle && drawMotion('idle', now, idleEdge);
          setAvatarOnlyMotion(false);
          if (rendered) return;
          endMotionPresentation();
          drawAvatar(now, `chat-edge-idle-${idleEdge}`);
          return;
        }
        if (drawPresentedMotion('idle', now, idleEdge)) return;
      } else if (idleDocked) {
        idleDocked = false;
        if (!root.classList.contains('chat-mode')
          && shell && typeof shell.undockPet === 'function') shell.undockPet();
      }
      endMotionPresentation();
      setAvatarOnlyMotion(false);
      drawAvatar(now);
    };

    const motionFrameDelay = (clip, frozen = false) => {
      if (frozen) return 250;
      const fps = Math.max(1, Math.min(30, Number(clip && clip.fps) || 12));
      return 1000 / fps;
    };

    const standbyFrameDelay = (now, state = {}, onBattery = false) => {
      const pointerAt = Number(state.pointerAt);
      const gazeAnimating = Number.isFinite(pointerAt)
        && now - pointerAt >= 0 && now - pointerAt < STANDBY_GAZE_SETTLE_MS;
      const facialAnimation = Boolean(state.blink || state.micro
        || state.release || state.viseme || gazeAnimating);
      // A still avatar only needs a low-rate maintenance paint. Blink, gaze,
      // and release/crossfade windows temporarily return to conversational
      // cadence, so the power saving never makes eyes or lips visibly step.
      return facialAnimation ? (onBattery ? 50 : 32) : STANDBY_MAINTENANCE_MS;
    };

    const frameDelay = now => {
      if (document.hidden || Number(shellState.pet && shellState.pet.opacity) <= .001) return 250;
      if (manualMotionKind) {
        const chatWalkIdle = root.classList.contains('chat-mode')
          && manualMotionKind === 'walk'
          && chatWalkState && String(chatWalkState.mode).startsWith('ledge-');
        const clip = motion[chatWalkIdle ? 'idle' : manualMotionKind];
        if (clip) return motionFrameDelay(clip,
          Boolean(manualMotionKind === 'move' && clip.video && clip.video.ended));
        if (chatWalkIdle) return 32;
      }
      if (roamState.enabled) {
        const kind = roamMotionKind(roamState.mode, roamState.presentationMode);
        const clip = kind && motion[kind];
        const frozen = roamState.mode === 'stand'
          || Boolean(kind === 'move' && clip && clip.video && clip.video.ended);
        return motionFrameDelay(clip, frozen);
      }
      if (now < moveUntil) {
        return motionFrameDelay(motion.move,
          Boolean(motion.move && motion.move.video && motion.move.video.ended));
      }
      if (edgeIdleActive(now)) {
        return motion.idle ? motionFrameDelay(motion.idle, false) : 32;
      }
      if (dragging || avatarZoomGesture) return 16;
      const active = speechSource || hasAttachedAgentAudio() || agentSpeaking || ptt;
      if (active) return shellState.onBattery ? 50 : 32;
      const decorativeMotion = !reducedMotion.matches;
      const microElapsed = now - Number(microExpression.started || 0);
      return standbyFrameDelay(now, {
        blink: decorativeMotion && Boolean(blinkStartedAt),
        micro: decorativeMotion && microExpression.started > 0
          && microElapsed >= 0 && microElapsed < microExpression.duration,
        release: speechExpressionState.mode !== 'idle',
        viseme: currentViseme !== previousViseme
          && now - visemeChangedAt < XFADE * 1000,
        pointerAt: decorativeMotion && pointer.seen
          ? pointer.at : Number.NEGATIVE_INFINITY,
      }, shellState.onBattery);
    };

    const advanceFrameClock = (previous, now, delay) => {
      const interval = Math.max(1, Number(delay) || 1);
      const elapsed = now - previous;
      if (!(previous > 0) || elapsed < 0 || elapsed > interval * 4) {
        return { due: true, next: now };
      }
      // Keep the fractional deadline instead of resetting to `now`. At 60Hz
      // this yields the correct alternating 2/3-refresh holds for 24fps;
      // resetting rounded 41.7ms up to three refreshes and silently made the
      // source look like 20fps.
      if (elapsed + .5 < interval) return { due: false, next: previous };
      const steps = Math.max(1, Math.floor((elapsed + .5) / interval));
      return { due: true, next: previous + steps * interval };
    };

    function renderLoop(now) {
      requestAnimationFrame(renderLoop);
      if (!ready) return;
      const clock = advanceFrameClock(lastFrame, now, frameDelay(now));
      if (!clock.due) return;
      lastFrame = clock.next;
      if (audioAnalyser) {
        if (!audioTimeData || audioTimeData.length !== audioAnalyser.fftSize) audioTimeData = new Uint8Array(audioAnalyser.fftSize);
        if (!audioFrequencyData || audioFrequencyData.length !== audioAnalyser.frequencyBinCount) audioFrequencyData = new Uint8Array(audioAnalyser.frequencyBinCount);
        audioAnalyser.getByteTimeDomainData(audioTimeData);
        audioAnalyser.getByteFrequencyData(audioFrequencyData);
        const measured = measureAudioSignal(audioTimeData, audioFrequencyData, audioContext && audioContext.sampleRate);
        audioPeak = Math.max(.018, measured.rms, audioPeak * .994);
        audioSignal = { ...measured, relative: Math.min(1, measured.rms / audioPeak) };
      } else {
        audioSignal = { rms: 0, relative: 0, low: 0, mid: 0, high: 0, centroid: 0, zcr: 0 };
      }
      if (live) syncLiveTalkAudioStatus(live, now);
      if (ptt) updateRecordingMeter(now);
      paintFrame(now);
      updateHit(false);
      syncPetEngagement();
      if (!avatarOnlyMotion && now - lastControlReport > 200) {
        lastControlReport = now;
        reportControlRects();
      }
    }

    const pointInsideRect = (point, rectangle) => point.x >= rectangle.left && point.x <= rectangle.right && point.y >= rectangle.top && point.y <= rectangle.bottom;

    const controlElements = () => {
      if (avatarOnlyMotion) return [];
      const draft = document.querySelector('.email-review');
      if (draft) return [draft];
      if (!root.classList.contains('chat-mode')) return [];
      const values = [rail, motionPicker.hidden ? null : motionPicker,
        opacityPanel.hidden ? null : opacityPanel];
      if (root.classList.contains('chat-open')
          && !(root.classList.contains('chat-mode') && interactionLayer === 'avatar')) {
        values.push(chatDock);
      }
      if (emptyState.classList.contains('show')) values.push(emptyState);
      return values.filter(Boolean);
    };

    const overControls = point => controlElements().some(element => {
      if (!element) return false;
      const box = element.getBoundingClientRect();
      return box.width > 0 && box.height > 0 && pointInsideRect(point, box);
    });

    const avatarCanvasPoint = point => root.classList.contains('chat-mode') && avatarMirrored
      ? { ...point, x: innerWidth - Number(point.x || 0) }
      : point;

    const paintedAvatarAt = point => {
      if (!ready || !point || point.inside === false
          || point.x < 0 || point.y < 0 || point.x >= innerWidth || point.y >= innerHeight) return false;
      try {
        const sample = avatarCanvasPoint(point);
        const alpha = context.getImageData(
          Math.floor(sample.x * pixelRatio), Math.floor(sample.y * pixelRatio), 1, 1).data[3];
        return alpha > 18;
      } catch (_) {
        return false;
      }
    };

    function updateHit(force) {
      if (!shell || typeof shell.setPetHit !== 'function') return;
      const chromeHit = overControls(pointer);
      const petOpacity = Number(canvas.style.opacity || 1);
      const avatarLayerInteractive = !root.classList.contains('chat-mode')
        || (interactionLayer === 'avatar' && petOpacity > .001);
      const figureHit = avatarLayerInteractive && !chromeHit && paintedAvatarAt(pointer);
      // A live pinch owns interactivity until its end packet. Pinching inward
      // can move the resized figure away from a stationary cursor; dropping
      // the hit claim mid-stream would make Electron click through and lose
      // the remaining wheel events before the gesture can settle or persist.
      const hit = dragging || Boolean(ptt) || Boolean(avatarZoomGesture) || chromeHit || figureHit;
      avatarHit = figureHit;
      root.classList.toggle('avatar-hover', figureHit);
      if (hit && !root.classList.contains('chat-mode')) markActivity();
      const now = performance.now();
      if (hit !== petHit || force || now - lastHitSent > 550) {
        petHit = hit;
        lastHitSent = now;
        shell.setPetHit(hit);
      }
    }

    function syncPetEngagement() {
      if (!shell || typeof shell.setPetEngaged !== 'function') return;
      // The chat may have been open when Horizon Walk was selected. It is
      // inert and invisible during the presentation, so it must not pin the
      // roam engine in its stationary interaction state. Likewise, hovering
      // a now-hidden rail control is window interactivity, not avatar hover.
      const engaged = Boolean(shellState.pet && shellState.pet.roam
        && (avatarHit || ptt || speechSource || agentSpeaking));
      if (engaged === petEngaged) return;
      petEngaged = engaged;
      shell.setPetEngaged(engaged);
    }

    const safeUTF16Prefix = (value, maximum) => {
      const text = String(value || '');
      const limit = Math.max(0, Math.floor(Number(maximum) || 0));
      if (text.length <= limit) return text;
      let clipped = text.slice(0, limit);
      const final = clipped.charCodeAt(clipped.length - 1);
      if (final >= 0xD800 && final <= 0xDBFF) clipped = clipped.slice(0, -1);
      return clipped;
    };

    const formatSelectedFeedback = (value, maximum = 12000) => {
      const selected = String(value || '').replace(/\r\n?/g, '\n');
      const limit = Math.max(0, Math.floor(Number(maximum) || 0));
      const suffix = '\n\nAsk about this selection: ';
      if (!selected.trim() || limit <= suffix.length + 4) {
        return { text: '', truncated: Boolean(selected.trim()) };
      }
      const quoted = `> ${selected.replace(/\n/g, '\n> ')}`;
      const budget = limit - suffix.length;
      if (quoted.length <= budget) return { text: `${quoted}${suffix}`, truncated: false };
      const marker = '\n> …';
      const clipped = safeUTF16Prefix(quoted, Math.max(0, budget - marker.length))
        .replace(/[\n\s>]+$/u, '');
      return { text: `${clipped}${marker}${suffix}`, truncated: true };
    };

    const composeAskAIDraft = (current, selected, maximum = 12000) => {
      const existing = String(current || '');
      const limit = Math.max(0, Math.floor(Number(maximum) || 0));
      const separator = existing
        ? (existing.endsWith('\n\n') ? '' : existing.endsWith('\n') ? '\n' : '\n\n')
        : '';
      const room = limit - existing.length - separator.length;
      const formatted = formatSelectedFeedback(selected, room);
      if (!formatted.text) {
        return { value: existing, inserted: false, truncated: formatted.truncated };
      }
      return {
        value: `${existing}${separator}${formatted.text}`,
        inserted: true,
        truncated: formatted.truncated,
      };
    };

    const selectionToolbarPoint = (selectionRect, toolbarSize, dockBounds) => {
      const gutter = 8;
      const width = Math.max(1, Number(toolbarSize && toolbarSize.width) || 1);
      const height = Math.max(1, Number(toolbarSize && toolbarSize.height) || 1);
      const boundsWidth = Math.max(width + gutter * 2, Number(dockBounds && dockBounds.width) || width);
      const boundsHeight = Math.max(height + gutter * 2, Number(dockBounds && dockBounds.height) || height);
      const left = Number(selectionRect && selectionRect.left) || 0;
      const top = Number(selectionRect && selectionRect.top) || 0;
      const right = Number(selectionRect && selectionRect.right) || left;
      const bottom = Number(selectionRect && selectionRect.bottom) || top;
      const dockLeft = Number(dockBounds && dockBounds.left) || 0;
      const dockTop = Number(dockBounds && dockBounds.top) || 0;
      const centered = (left + right) / 2 - dockLeft - width / 2;
      const x = Math.max(gutter, Math.min(boundsWidth - width - gutter, centered));
      const above = top - dockTop - height - gutter;
      const below = bottom - dockTop + gutter;
      const y = above >= gutter
        ? above : Math.max(gutter, Math.min(boundsHeight - height - gutter, below));
      return { x, y };
    };

    const feedbackSelectionCandidate = selection => {
      if (!selection || selection.rangeCount !== 1 || selection.isCollapsed) return null;
      const elementFor = node => node && (node.nodeType === 1 ? node : node.parentElement);
      const start = elementFor(selection.anchorNode);
      const end = elementFor(selection.focusNode);
      const bubble = start && typeof start.closest === 'function'
        ? start.closest('.message.assistant .bubble') : null;
      if (!bubble || !end || !bubble.contains(selection.anchorNode)
          || !bubble.contains(selection.focusNode) || !bubble.isConnected) return null;
      const text = String(selection.toString() || '');
      if (!text.trim()) return null;
      const range = selection.getRangeAt(0);
      const measured = range.getBoundingClientRect();
      const rect = measured && (measured.width || measured.height)
        ? measured : bubble.getBoundingClientRect();
      return { bubble, text, rect };
    };

    const hideSelectionActions = (forget = false) => {
      selectionActions.classList.remove('show');
      selectionActions.setAttribute('aria-hidden', 'true');
      selectionActions.inert = true;
      if (forget) selectedFeedback = null;
    };

    const showSelectionActions = candidate => {
      if (!candidate || avatarOnlyMotion || !root.classList.contains('chat-open')) {
        hideSelectionActions(true);
        return;
      }
      selectedFeedback = candidate;
      selectionActions.inert = false;
      selectionActions.setAttribute('aria-hidden', 'false');
      selectionActions.classList.add('show');
      const dock = chatDock.getBoundingClientRect();
      const toolbar = selectionActions.getBoundingClientRect();
      const point = selectionToolbarPoint(candidate.rect, toolbar, dock);
      selectionActions.style.left = `${Math.round(point.x)}px`;
      selectionActions.style.top = `${Math.round(point.y)}px`;
    };

    const refreshSelectionActions = () => {
      if (selectingFeedback || selectionActions.matches(':focus-within')) return;
      showSelectionActions(feedbackSelectionCandidate(getSelection()));
    };

    const writeClipboardText = async value => {
      const text = String(value || '');
      if (!text) return false;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* the selection-preserving fallback remains available */ }
      if (typeof document.execCommand !== 'function') return false;
      const active = document.activeElement;
      const activeSelection = active && typeof active.selectionStart === 'number'
        ? [active.selectionStart, active.selectionEnd, active.selectionDirection] : null;
      const selection = getSelection();
      const ranges = selection
        ? Array.from({ length: selection.rangeCount }, (_, index) => selection.getRangeAt(index).cloneRange())
        : [];
      const field = document.createElement('textarea');
      field.value = text;
      field.readOnly = true;
      field.setAttribute('aria-hidden', 'true');
      Object.assign(field.style, { position: 'fixed', opacity: '0', pointerEvents: 'none' });
      document.body.appendChild(field);
      field.select();
      let copied = false;
      try { copied = Boolean(document.execCommand('copy')); } catch (_) { copied = false; }
      field.remove();
      if (active && typeof active.focus === 'function') {
        active.focus({ preventScroll: true });
        if (activeSelection && typeof active.setSelectionRange === 'function') {
          active.setSelectionRange(...activeSelection);
        }
      }
      if (selection) {
        selection.removeAllRanges();
        for (const range of ranges) selection.addRange(range);
      }
      return copied;
    };

    const copyFeedbackText = async (text, kind) => {
      if (await writeClipboardText(text)) {
        notify(kind === 'selection' ? 'Selected text copied.' : 'Response copied.');
        return;
      }
      notify('Copy was unavailable. Select the text and press ⌘C.');
    };

    const askAIAboutSelectedFeedback = () => {
      const selected = selectedFeedback && selectedFeedback.text;
      if (!selected) return;
      const drafted = composeAskAIDraft(
        composer.value,
        selected,
        Number(composer.maxLength) || 12000,
      );
      if (!drafted.inserted) {
        notify('The message draft is full. Copy the selection or shorten the draft first.');
        return;
      }
      composer.value = drafted.value;
      hideSelectionActions(true);
      const selection = getSelection();
      if (selection) selection.removeAllRanges();
      resizeComposer();
      openChat(false);
      if (shell && typeof shell.focusPetWindow === 'function') shell.focusPetWindow();
      requestAnimationFrame(() => {
        composer.focus({ preventScroll: true });
        composer.setSelectionRange(composer.value.length, composer.value.length);
      });
      notify(drafted.truncated
        ? 'Selection shortened to fit. Add your question, then send.'
        : 'Selection added. Add your question, then send.');
    };

    const responseActionButton = (label, title, pathData, handler) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'response-action';
      button.setAttribute('aria-label', label);
      button.title = title;
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      icon.appendChild(path);
      button.appendChild(icon);
      button.addEventListener('click', handler);
      return button;
    };

    let lastControlPacket = '';
    function reportControlRects(force = false) {
      if (!shell || typeof shell.setPetControlRects !== 'function') return;
      const rects = [];
      for (const element of controlElements()) {
        if (!element) continue;
        const box = element.getBoundingClientRect();
        if (box.width > 0 && box.height > 0) rects.push({ x: Math.floor(box.left), y: Math.floor(box.top), w: Math.ceil(box.width), h: Math.ceil(box.height) });
      }
      const packet = JSON.stringify(rects);
      if (force || packet !== lastControlPacket) {
        lastControlPacket = packet;
        shell.setPetControlRects(rects);
      }
    }

    const avatarLocalPoint = point => {
      const geometry = lastBodyGeometry;
      if (!geometry || !paintedAvatarAt({ ...point, inside: true })) return null;
      const sample = avatarCanvasPoint(point);
      let x = (sample.x - geometry.fit.x) / geometry.fit.scale;
      let y = (sample.y - geometry.fit.y) / geometry.fit.scale;
      const dx = x - geometry.pivotX;
      const dy = y - geometry.pivotY;
      const cosine = Math.cos(-geometry.sway);
      const sine = Math.sin(-geometry.sway);
      x = (dx * cosine - dy * sine) / geometry.breathe + geometry.pivotX;
      y = dx * sine + dy * cosine + geometry.pivotY;
      return { x, y };
    };

    const pointOnHead = point => {
      if (!lastBodyGeometry) return true;
      const geometry = lastBodyGeometry;
      const local = avatarLocalPoint(point);
      if (!local) return false;
      const face = geometry.metadata && geometry.metadata.alignment && geometry.metadata.alignment.face_bounds;
      if (!Array.isArray(face)) return !geometry.hasBody;
      const margin = face[2] * .45;
      return local.x >= face[0] - margin && local.x <= face[0] + face[2] + margin
        && local.y >= face[1] - face[3] * .7 && local.y <= face[1] + face[3] * 1.3;
    };

    const avatarBodyTapAction = (local, geometry) => {
      if (!local || !geometry) return null;
      const face = geometry.metadata && geometry.metadata.alignment
        && geometry.metadata.alignment.face_bounds;
      if (!geometry.hasBody || !Array.isArray(face) || face.length < 4) return null;
      const headMargin = Number(face[2]) * .45;
      if (local.x >= Number(face[0]) - headMargin
          && local.x <= Number(face[0]) + Number(face[2]) + headMargin
          && local.y >= Number(face[1]) - Number(face[3]) * .7
          && local.y <= Number(face[1]) + Number(face[3]) * 1.3) return null;
      const rawBounds = geometry.metadata && geometry.metadata.bounds;
      const bounds = Array.isArray(rawBounds) && rawBounds.length >= 4
        ? rawBounds.map(Number) : [0, 0, geometry.width, geometry.height];
      if (!(bounds[2] > 0 && bounds[3] > 0)) return null;
      const horizontal = (local.x - bounds[0]) / bounds[2];
      const vertical = (local.y - bounds[1]) / bounds[3];
      if (horizontal >= .20 && horizontal <= .80 && vertical >= .20 && vertical < .48) {
        return 'opacity-up';
      }
      if (vertical >= .48 && vertical <= 1.04) return 'opacity-down';
      return null;
    };

      if (!chatThreads.some(thread => thread.id === activeThreadID)) {
        activeThreadID = chatThreads[0] ? chatThreads[0].id : freshThread().id;

      let encoded = JSON.stringify(chatThreads);
      while (encoded.length > CHAT_HISTORY_MAX_BYTES && chatThreads.length > 1) {
        const removable = [...chatThreads].reverse().find(thread => thread.id !== activeThreadID);
        if (!removable) break;
        chatThreads = chatThreads.filter(thread => thread.id !== removable.id);
        encoded = JSON.stringify(chatThreads);

      while (encoded.length > CHAT_HISTORY_MAX_BYTES) {
