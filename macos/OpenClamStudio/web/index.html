<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OpenClam Studio</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('openclam-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <script src="/livekit-client.js"></script>
  <style>
    :root {
      --ink: #f7f4ef;
      --muted: #a9a5a0;
      --glass: rgba(18, 20, 25, .84);
      --glass-strong: rgba(12, 14, 18, .94);
      --line: rgba(255, 255, 255, .13);
      --line-strong: rgba(255, 255, 255, .24);
      --accent: #f45d62;
      --accent-soft: rgba(244, 93, 98, .18);
      --good: #66d69a;
      --warning: #f4bd62;
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #0c0e12;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    html.is-electron body { background: transparent; }
    button, textarea, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: default;
    }

    html.dragging #stage { cursor: grabbing; }

    #topline {
      position: fixed;
      z-index: 20;
      top: 14px;
      left: 16px;
      max-width: calc(100vw - 118px);
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(15, 17, 21, .68);
      backdrop-filter: blur(18px) saturate(1.15);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .16);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .015em;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    /* Status belongs in the conversation work stream. Keep this internal
       node for existing state transitions, but never paint a floating avatar
       badge over either presentation. */
    #topline { display: none !important; }

    #statusDot {
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: #717782;
    }

    #topline[data-tone="good"] #statusDot { background: var(--good); box-shadow: 0 0 11px rgba(102, 214, 154, .65); }
    #topline[data-tone="busy"] #statusDot { background: var(--warning); box-shadow: 0 0 11px rgba(244, 189, 98, .5); }
    #topline[data-tone="live"] #statusDot { background: var(--accent); box-shadow: 0 0 12px rgba(244, 93, 98, .7); animation: callPulse 1.2s ease-in-out infinite; }
    #statusText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #rail {
      position: fixed;
      z-index: 30;
      top: 14px;
      right: 14px;
      display: grid;
      gap: 8px;
    }

    .round-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(15, 17, 21, .74);
      backdrop-filter: blur(18px) saturate(1.12);
      color: #d5d1cb;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
      cursor: pointer;
      transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
    }

    .round-button:hover { transform: translateY(-1px); color: #fff; border-color: var(--line-strong); background: rgba(29, 32, 39, .9); }
    .round-button:active { transform: scale(.95); }
    .round-button svg { width: 19px; height: 19px; fill: currentColor; }
    .round-button[disabled] { opacity: .36; cursor: default; transform: none; }

    #liveTalkButton[data-state="connecting"] { color: var(--warning); border-color: rgba(244, 189, 98, .4); animation: callPulse 1.15s ease-in-out infinite; }
    #liveTalkButton[data-state="connected"] { color: white; background: rgba(190, 42, 55, .88); border-color: rgba(255, 150, 150, .55); }
    #walkButton[aria-pressed="true"], #movesButton.showing { color: var(--good); border-color: rgba(102, 214, 154, .4); }

    @keyframes callPulse { 50% { opacity: .52; } }

    #chatDock {
      position: fixed;
      z-index: 35;
      left: 50%;
      bottom: 14px;
      width: min(680px, calc(100vw - 28px));
      transform: translate(-50%, 12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .22s ease, transform .28s cubic-bezier(.2, .8, .2, 1), visibility .22s;
    }

    html.chat-open #chatDock {
      transform: translate(-50%, 0);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #conversation {
      max-height: min(42vh, 350px);
      overflow: auto;
      margin: 0 0 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.12);
      box-shadow: var(--shadow);
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
      overscroll-behavior: contain;
    }

    #conversation::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    #conversation:empty { display: none; }
    .message { display: flex; align-items: flex-end; gap: 7px; margin: 4px 0; }
    .message.user { justify-content: flex-end; }
    .bubble {
      min-width: 0;
      max-width: min(82%, 530px);
      padding: 9px 12px;
      border-radius: 14px;
      color: #f4f1ec;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      unicode-bidi: plaintext;
      user-select: text;
    }

    .message.assistant .bubble { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.08); border-bottom-left-radius: 5px; }
    .message.user .bubble { background: #ef625f; color: #180c0c; border-bottom-right-radius: 5px; }
    .message.working .bubble { color: var(--muted); letter-spacing: .12em; }

    .response-actions {
      display: flex;
      flex: none;
      align-items: center;
      align-self: flex-end;
      gap: 1px;
    }

    .response-route {
      max-width: min(340px, 38vw);
      margin-right: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .response-action {
      width: 28px;
      height: 28px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #aaa6a0;
      cursor: pointer;
    }

    .response-action:hover { color: white; background: rgba(255,255,255,.08); }
    .response-action svg { width: 15px; height: 15px; fill: currentColor; }

    #selectionActions {
      position: absolute;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(35, 37, 42, .98);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .34);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .12s ease, visibility .12s ease;
    }

    #selectionActions.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .selection-action {
      min-height: 30px;
      padding: 5px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 12px;
      font-weight: 560;
      white-space: nowrap;
    }

    .selection-action:hover { background: rgba(255,255,255,.09); }

    .media-card { margin: 8px 0 4px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #080a0d; }
    .media-card img, .media-card video { width: 100%; max-height: 260px; display: block; object-fit: contain; }
    .media-card .media-name { padding: 7px 9px; color: var(--muted); font-size: 11px; }

    #composerRow {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(1.14);
      box-shadow: var(--shadow);
    }

    #composer {
      flex: 1;
      min-width: 0;
      height: 40px;
      min-height: 40px;
      max-height: 112px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 9px 7px;
      line-height: 1.42;
      unicode-bidi: plaintext;
      user-select: text;
    }

    #composer::placeholder { color: #817e7a; }
    .composer-button {
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 13px;
      background: rgba(255,255,255,.08);
      color: #d8d4ce;
      cursor: pointer;
      transition: transform .13s ease, background .2s ease, color .2s ease;
    }

    .composer-button:hover { background: rgba(255,255,255,.14); color: white; }
    .composer-button:active { transform: scale(.95); }
    .composer-button svg { width: 19px; height: 19px; fill: currentColor; }
    #sendButton { background: var(--accent); color: #1e090b; }
    #sendButton[disabled] { opacity: .35; cursor: default; }
    #pttButton.recording { color: white; background: #bd2b3a; animation: callPulse .9s ease-in-out infinite; }
    #closeChatButton { background: transparent; }

    #recordingChip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      display: none;
      align-items: center;
      gap: 8px;
      transform: translateX(-50%);
      padding: 7px 11px;
      border: 1px solid rgba(244, 93, 98, .34);
      border-radius: 11px;
      background: rgba(22, 12, 16, .92);
      color: #ffd9d9;
      font-size: 12px;
      white-space: nowrap;
    }

    html.recording #recordingChip,
    #recordingChip[data-visible="true"] { display: flex; }
    #recordingLevel { display: flex; align-items: center; gap: 2px; height: 16px; }
    #recordingLevel[hidden],
    #recordingClock[hidden] { display: none; }
    #recordingLevel i { width: 2px; height: 3px; border-radius: 2px; background: currentColor; transition: height 70ms ease; }

    #toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      top: 60px;
      max-width: min(440px, calc(100vw - 36px));
      transform: translate(-50%, -8px);
      opacity: 0;
      pointer-events: none;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 18, 22, .92);
      color: #e9e5df;
      box-shadow: 0 14px 40px rgba(0,0,0,.28);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      transition: opacity .2s ease, transform .2s ease;
    }

    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #emptyState {
      position: fixed;
      z-index: 25;
      inset: 0;
      display: none;
      place-items: end center;
      /* The always-available right rail occupies the last 52px. Keep the
         onboarding card in the remaining canvas so Settings never sits on
         its border in a compact pet window. */
      padding: 30px 68px 24px 24px;
      background: radial-gradient(circle at 50% 35%, rgba(244, 93, 98, .14), transparent 45%), #0c0e12;
    }

    #emptyState.show { display: grid; }
    #emptyCard {
      width: min(430px, 100%);
      padding: 31px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(18, 20, 25, .95);
      text-align: center;
      box-shadow: var(--shadow);
      transition: opacity .2s ease, transform .2s ease;
    }

    #emptyCard h1 { margin: 0 0 9px; font-size: 25px; letter-spacing: -.035em; }
    #emptyCard p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    .empty-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; }
    .empty-actions button {
      height: 43px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.08);
      color: var(--ink);
      font-weight: 650;
      cursor: pointer;
    }
    #emptySettings { border-color: transparent; background: var(--accent); color: #220a0c; }
    html.chat-open #emptyCard { opacity: 0; transform: translateY(8px); pointer-events: none; }

    .email-review {
      position: fixed;
      z-index: 70;
      left: 50%;
      top: 50%;
      width: min(500px, calc(100vw - 28px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      transform: translate(-50%, -50%);
      padding: 20px;
      border: 1px solid var(--line-strong);
      border-radius: 21px;
      background: #15171c;
      box-shadow: 0 34px 100px rgba(0,0,0,.55);
      user-select: text;
    }

    .email-review h2 { margin: 0 0 5px; font-size: 20px; letter-spacing: -.025em; }
    .email-review .unsent { margin-bottom: 16px; color: var(--warning); font-size: 12px; line-height: 1.45; }
    .email-review label { display: grid; gap: 5px; margin: 11px 0; color: var(--muted); font-size: 12px; }
    .email-review input, .email-review textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: 0;
      background: #0e1014;
      color: var(--ink);
      padding: 9px 11px;
      user-select: text;
    }

    .email-review textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
    .email-review input:focus, .email-review textarea:focus { border-color: rgba(244, 93, 98, .62); }
    .email-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .email-actions button { height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.07); color: var(--ink); cursor: pointer; }
    .email-actions button:last-child { background: var(--accent); color: #21090b; border-color: transparent; }

    :focus-visible { outline: 2px solid rgba(255, 151, 154, .9); outline-offset: 2px; }

    html.pet-mode #topline { opacity: .72; }
    html.pet-mode:not(.chat-open) #topline { transform: translateY(-5px); opacity: 0; }
    /* Moves and Walk are primary desktop controls, not hover decoration. Keep
       their hit targets stable even when the pointer is over transparent
       canvas or macOS Reduced Motion removes transition feedback. */
    html.pet-mode #rail .secondary {
      opacity: 1;
      visibility: visible;
      transform: none;
      pointer-events: auto;
    }
    @media (max-width: 520px) {
      #topline { max-width: calc(100vw - 78px); }
      #rail { right: 9px; }
      .round-button { width: 39px; height: 39px; border-radius: 13px; }
      #conversation { max-height: 34vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* Codex Work visual contract: a calm editorial thread, flat chronological
       activity, and one deliberate composer surface. The avatar runtime stays
       independent and the palette follows the Mac's light/dark appearance. */
    :root {
      color-scheme: light dark;
      --codex-surface: #fbfbfa;
      --codex-editor: #ffffff;
      --codex-elevated: #f5f5f3;
      --codex-control: #f1f1ef;
      --codex-under: #ffffff;
      --codex-text: #202020;
      --codex-text-secondary: rgba(32, 32, 32, .66);
      --codex-text-tertiary: rgba(32, 32, 32, .46);
      --codex-border: rgba(32, 32, 32, .10);
      --codex-border-heavy: rgba(32, 32, 32, .17);
      --codex-border-light: rgba(32, 32, 32, .055);
      --codex-focus: #339cff;
      --codex-hover: rgba(32, 32, 32, .055);
      --codex-pressed: rgba(32, 32, 32, .10);
      --ink: var(--codex-text);
      --muted: var(--codex-text-secondary);
      --glass: rgba(33, 33, 33, .96);
      --glass-strong: rgba(40, 40, 40, .96);
      --line: var(--codex-border);
      --line-strong: var(--codex-border-heavy);
      --accent: var(--codex-text);
      --accent-soft: rgba(255, 255, 255, .07);
      --good: #40c977;
      --warning: #ff8549;
      --shadow: 0 18px 60px rgba(0, 0, 0, .14);
      --pet-edge: 12px;
      --pet-rail-size: 40px;
      --pet-rail-gap: 10px;
      --pet-rail-reserve: calc(var(--pet-edge) + var(--pet-rail-size) + var(--pet-rail-gap));
      --pet-surface-radius: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --codex-surface: #181818;
      --codex-editor: #212121;
      --codex-elevated: #282828;
      --codex-control: #303030;
      --codex-under: #0d0d0d;
      --codex-text: #ffffff;
      --codex-text-secondary: rgba(255, 255, 255, .70);
      --codex-text-tertiary: rgba(255, 255, 255, .50);
      --codex-border: rgba(255, 255, 255, .08);
      --codex-border-heavy: rgba(255, 255, 255, .16);
      --codex-border-light: rgba(255, 255, 255, .04);
      --codex-hover: rgba(255, 255, 255, .08);
      --codex-pressed: rgba(255, 255, 255, .12);
      --shadow: 0 18px 60px rgba(0, 0, 0, .42);
    }

    body { background: var(--codex-surface); }
    html.is-electron, html.is-electron body { background: transparent; }

    #topline {
      top: 12px;
      left: 12px;
      min-height: 30px;
      padding: 6px 10px;
      border-color: var(--codex-border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--codex-editor) 96%, transparent);
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .20);
      color: var(--codex-text-secondary);
      font-size: 12px;
      font-weight: 430;
      letter-spacing: 0;
    }

    #topline[data-tone="good"] #statusDot { box-shadow: none; }
    #topline[data-tone="busy"] #statusDot { box-shadow: none; }
    #topline[data-tone="live"] #statusDot { background: #ff6764; box-shadow: none; }

    #rail {
      z-index: 40;
      top: var(--pet-edge);
      right: var(--pet-edge);
      gap: 6px;
    }
    .round-button {
      width: 40px;
      height: 40px;
      border-color: var(--codex-border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--codex-editor) 96%, transparent);
      backdrop-filter: blur(16px);
      color: var(--codex-text-secondary);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
    }
    .round-button:hover {
      transform: none;
      color: var(--codex-text);
      border-color: var(--codex-border-heavy);
      background: var(--codex-hover);
    }
    .round-button:active { transform: scale(.96); background: var(--codex-pressed); }
    .round-button svg { width: 18px; height: 18px; }
    #liveTalkButton[data-state="connecting"] { color: var(--warning); border-color: rgba(255, 133, 73, .4); }
    #liveTalkButton[data-state="connected"] { color: var(--codex-under); background: #ff6764; border-color: #ff6764; }

    #chatDock {
      left: var(--pet-edge);
      right: var(--pet-rail-reserve);
      bottom: var(--pet-edge);
      width: auto;
      max-width: 820px;
      margin-inline: auto;
      padding: 0;
      border: 0;
      border-radius: var(--pet-surface-radius);
      /* Chromium's backdrop-filter backing surface is rectangular in a
         transparent Electron window. It painted the large grey square seen
         around this otherwise rounded dock. The near-opaque dock already has
         sufficient contrast, so keep the rounded surface and remove only the
         compositor halo. */
      background: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      box-shadow: none;
      transform: translateY(12px);
    }
    html.chat-open #chatDock { transform: translateY(0); }
    html.chat-open #chatDock:has(#conversation:not(:empty)) {
      border: 1px solid var(--codex-border);
      background: color-mix(in srgb, var(--codex-editor) 98.5%, transparent);
      box-shadow: var(--shadow);
    }
    #conversation {
      height: min(64dvh, 680px);
      min-height: min(330px, calc(100dvh - 150px));
      max-height: calc(100dvh - 150px);
      margin: 0;
      padding: 34px clamp(22px, 5vw, 54px) 22px;
      border: 0;
      border-radius: 15px;
      background: transparent;
      backdrop-filter: none;
      box-shadow: none;
      scrollbar-width: none;
      scrollbar-color: transparent transparent;
    }
    .message { gap: 8px; margin: 22px 0; }
    .bubble {
      color: var(--codex-text);
      font-size: clamp(15px, 1.25vw, 18px);
      font-weight: 420;
      line-height: 1.58;
      letter-spacing: -.006em;
    }
    .message.assistant .bubble {
      max-width: min(100%, 860px);
      padding: 5px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .message.user .bubble {
      max-width: min(74%, 690px);
      padding: 13px 17px;
      border: 1px solid var(--codex-border-light);
      border-radius: 18px;
      background: var(--codex-control);
      color: var(--codex-text);
    }
    .response-action { color: var(--codex-text-tertiary); border-radius: 8px; }
    .response-action:hover { color: var(--codex-text); background: var(--codex-hover); }
    #selectionActions {
      border-color: var(--codex-border-heavy);
      background: rgba(40, 40, 40, .99);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .42);
    }
    .selection-action { color: var(--codex-text); }
    .selection-action:hover { background: rgba(255, 255, 255, .08); }
    .media-card { border-color: var(--codex-border); border-radius: 12px; background: var(--codex-under); }
    #agentModeBar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      color: var(--codex-text-tertiary);
      font-size: 12px;
      font-weight: 600;
    }

      background: var(--codex-surface-raised);
      box-shadow: var(--codex-shadow-sm);
      color: var(--codex-text-secondary);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    #chatHeaderAvatarModeButton:hover { color: var(--codex-text); background: var(--codex-hover); }
    #chatHeaderThemeButton svg { width: 17px; height: 17px; }
    #chatThreadHeading {
      min-width: 0;
      max-width: min(540px, calc(100vw - 250px));
      padding: 9px 12px;
      border-radius: 13px;
      color: var(--codex-text);
      background: color-mix(in srgb, var(--codex-surface) 82%, transparent);
      box-shadow: var(--codex-shadow-sm);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.01em;
    }
    #chatHistoryScrim {
      position: fixed;
      inset: 0;
      z-index: 88;
      background: rgba(15, 15, 15, .18);
      backdrop-filter: blur(2px);
    }
    html.chat-mode.history-open #chatHistoryScrim { display: block; pointer-events: auto; }
    html.chat-mode #chatHistoryPanel {
      position: fixed;
      z-index: 89;
      inset: 0 auto 0 0;
      width: min(320px, calc(100vw - 44px));
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 14px 16px;
      color: var(--codex-text);
      background: color-mix(in srgb, var(--codex-surface) 96%, transparent);
      border-right: 1px solid var(--codex-line);
      box-shadow: 18px 0 50px rgba(0, 0, 0, .16);
      transform: translateX(-105%);
      transition: transform 180ms ease;
      pointer-events: none;
    }
    html.chat-mode.history-open #chatHistoryPanel { transform: translateX(0); pointer-events: auto; }
    .history-panel-header { display: flex; align-items: center; gap: 8px; }
    .history-panel-header strong { flex: 1; padding-left: 4px; font-size: 16px; }
    #newChatButton {
      min-height: 36px;
      padding: 9px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--codex-border-heavy) !important;
      border-radius: 11px;
      background: color-mix(in srgb, var(--codex-editor) 98%, transparent) !important;
      color: var(--codex-text) !important;
      font-weight: 650;
      box-shadow: none !important;
    }
    #newChatButton:hover { background: var(--codex-hover); }
    #newChatButton svg { width: 15px; height: 15px; flex: 0 0 15px; fill: currentColor; }
    #closeHistoryButton {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: transparent;
      font-size: 20px;
    }
    #chatHistoryList { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 5px; }
    .history-panel-footer {
      display: grid;
      gap: 6px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--codex-line);
    }
    .history-panel-action {
      min-height: 42px;
      padding: 0 12px;
      border-radius: 11px;
      background: transparent;
      color: var(--codex-text-secondary);
      text-align: left;
      font-weight: 600;
    }
    .history-panel-action:hover { color: var(--codex-text); background: var(--codex-hover); }
    .history-thread { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; }
    .history-thread-main {
      min-width: 0;
      padding: 10px 11px;
      text-align: left;
      border-radius: 11px;
      background: transparent;
    }
    .history-thread.active .history-thread-main { background: var(--codex-hover); }
    .history-thread-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .history-thread-time { display: block; margin-top: 3px; color: var(--codex-muted); font-size: 11px; }
    .history-thread-more {
      align-self: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: transparent;
      color: var(--codex-muted);
    }
    .history-thread-main:hover,
    .history-thread-more:hover,
    #closeHistoryButton:hover { background: var(--codex-hover); }
    html.chat-mode.avatar-layer-top #chatHeader { opacity: .38; pointer-events: none; }

    @media (max-width: 820px) {
      html.chat-mode #chatDock,
      html.chat-mode.chat-open #chatDock,
      html.chat-mode.chat-open #chatDock:has(#conversation:not(:empty)) { padding-left: 12px; padding-right: 62px; }
      html.chat-mode #conversation,
      html.chat-mode #conversation:empty,
      html.chat-mode #composerShell { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      html.avatar-only-motion #topline,
      html.avatar-only-motion #rail,
      html.avatar-only-motion #chatDock,
      html.avatar-only-motion #emptyState,
      html.avatar-only-motion #toast,
      html.avatar-only-motion .email-review { transform: none; }
      html.avatar-only-motion #toast { transform: translateX(-50%); }
      html.avatar-only-motion .email-review { transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h5v2H5v4H3V4a1 1 0 0 1 1-1Zm11 0h5a1 1 0 0 1 1 1v5h-2V5h-4V3ZM3 15h2v4h4v2H4a1 1 0 0 1-1-1v-5Zm16 0h2v5a1 1 0 0 1-1 1h-5v-2h4v-4ZM12 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm-5 10c.35-2.25 2.03-3.5 5-3.5s4.65 1.25 5 3.5H7Z"/></svg>

    <button id="speakerButton" class="round-button chat-only-control" type="button" aria-label="Read latest reply aloud" title="Read latest reply aloud">

  <div id="motionPicker" class="rail-picker" role="menu" aria-label="Avatar motion" hidden>

  <section id="chatDock" aria-label="Conversation">
    <header id="chatHeader">
      <button id="chatHistoryButton" class="chat-header-button" type="button" aria-expanded="false" aria-controls="chatHistoryPanel" aria-label="Open chat history" title="Chat history">

        <button id="closeHistoryButton" type="button" aria-label="Close chat history" title="Close">×</button>

      <div id="chatHistoryList" role="list"></div>
      <div class="history-panel-footer">
        <button id="historySettingsButton" class="history-panel-action" type="button" aria-label="Open Settings">Settings</button>
      </div>

    <div id="conversation" role="log" aria-live="polite" aria-relevant="additions"></div>
