<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenClam Studio speech</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    ::selection{background:rgba(255,255,255,.22);color:inherit}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    body{display:grid;place-items:center;padding:18px 30px 34px;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
      -webkit-font-smoothing:antialiased}
    /* Codex macOS surface language: graphite elevation, 8% separator,
       restrained 16px radius, and the native system type hierarchy. */
    .bubble{position:relative;width:min(100%,720px);padding:20px 26px 22px;
      border:1px solid rgba(255,255,255,.08);border-radius:16px;
      background:rgba(33,33,33,.96);backdrop-filter:blur(16px);
      box-shadow:0 12px 36px rgba(0,0,0,.34)}
    .head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .mark{flex:none;width:5px;height:5px;border-radius:50%;background:#fff}
    .name{flex:none;font:600 10px/1 inherit;letter-spacing:.24em;color:rgba(255,255,255,.5)}
    .rule{flex:1;height:1px;background:rgba(255,255,255,.08)}
    /* Scrollable, not clamped: a long markdown reply (a story, a briefing)
       reads to the end. The shell holds the auto-hide while the cursor is
       on the card. */
    #text{color:#fff;text-wrap:pretty;font-size:clamp(17px,2vw,24px);
      font-weight:430;line-height:1.45;letter-spacing:-.012em;
      max-height:calc(100vh - 128px);overflow-y:auto;overscroll-behavior:contain;
      scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
    #text::-webkit-scrollbar{width:6px}
    #text::-webkit-scrollbar-track{background:transparent}
    #text::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:6px}
    body.medium #text{font-size:clamp(15px,1.75vw,20px)}
    body.long #text{font-size:clamp(14px,1.5vw,17px);line-height:1.5}
    /* Markdown blocks, in the bubble's own quiet palette. The model is asked
       to speak plainly, but when a reply arrives as markdown it must read as
       markdown, not as raw asterisks and fences. */
    #text p,#text ul,#text ol,#text pre,#text blockquote,#text table,
    #text h1,#text h2,#text h3,#text h4,#text h5,#text h6{margin:0 0 .5em}
    #text>:last-child{margin-bottom:0}
    #text h1,#text h2,#text h3,#text h4,#text h5,#text h6{
      color:#fff;font-weight:650;line-height:1.25;letter-spacing:-.02em}
    #text h1{font-size:1.15em}#text h2{font-size:1.1em}#text h3{font-size:1.05em}
    #text ul,#text ol{padding-left:1.3em}
    #text li+li{margin-top:.22em}
    #text code{padding:.1em .32em;border-radius:5px;background:rgba(255,255,255,.08);
      color:rgba(255,255,255,.9);font:500 .88em/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
    #text pre{padding:9px 11px;border:1px solid rgba(255,255,255,.08);border-radius:8px;
      background:#181818;white-space:pre-wrap;overflow-wrap:anywhere}
    #text pre code{padding:0;background:transparent;color:rgba(255,255,255,.9)}
    #text blockquote{padding-left:.8em;border-left:3px solid #8f8f8f;color:rgba(255,255,255,.7)}
    #text a{color:#ededed;text-decoration-color:rgba(237,237,237,.5)}
    #text hr{height:1px;border:0;background:rgba(255,255,255,.08)}
    #text table{width:100%;border-collapse:collapse;font-size:.9em}
    #text th,#text td{padding:4px 7px;border:1px solid rgba(255,255,255,.08);
      text-align:left;vertical-align:top}
    #text th{color:#fff;font-weight:650}
    body.companion{display:block;padding:12px;color:#f5f5f5}
    body.companion .bubble{width:100%;padding:14px 16px;border-radius:25px;
      box-shadow:0 5px 12px rgba(0,0,0,.18)}
    body.companion .head,body.companion #text{display:none}
    #companionHeader{display:flex;gap:7px;align-items:center;min-height:42px}
    #companionHeader[hidden],#preview[hidden],#followup[hidden]{display:none}
    .summary{flex:1;min-width:0}
    #companionTitle{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #companionStatus{display:block;margin-top:3px;font-size:12px;line-height:1.3;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    button{border:0;cursor:pointer;color:inherit;background:rgba(128,128,128,.17);flex:none;
      width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font:inherit;font-size:18px;line-height:1;padding:6px}
    button:hover{background:rgba(128,128,128,.3)}button:disabled{opacity:.3;cursor:default}
    button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    button:focus-visible,input:focus-visible{outline:2px solid #7fb5ff;outline-offset:2px}
    #dismiss{position:absolute;left:-7px;top:-7px;width:24px;height:24px;padding:3px;background:#555}
    #preview{margin:9px 0 0;font-size:12px;line-height:1.45;opacity:.86;display:-webkit-box;
      -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
    #followup{display:flex;align-items:center;gap:6px;margin-top:12px}
    #followup input{font:inherit;font-size:13px;line-height:1.4;color:inherit;min-width:0;flex:1;width:100%;
      border:1px solid rgba(128,128,128,.2);border-radius:17px;padding:8px 11px;background:rgba(128,128,128,.1)}
    #followup input::placeholder{color:inherit;opacity:.5}
    body.companion[data-theme="light"]{color:#242424}
    body.companion[data-theme="light"] .bubble{background:rgba(250,250,250,.97);border-color:rgba(0,0,0,.08)}
    body.companion[data-theme="light"] #dismiss{background:#f7f7f7}
  </style>
</head>
<body>
  <section class="bubble" role="status" aria-live="polite">
    <div id="companionHeader" hidden>
      <div class="summary"><strong id="companionTitle">Tia</strong><span id="companionStatus"></span></div>
      <button id="expand" title="Follow up" aria-label="Follow up" aria-expanded="false"><svg viewBox="0 0 20 20"><path d="m8 4-6 5 6 5V10c5 0 8 2 10 6 0-7-4-10-10-10z"/></svg></button>
      <button id="stop" title="Stop" aria-label="Stop current activity"><svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></svg></button>
      <button id="openChat" title="Open Chat/Talk" aria-label="Open Chat/Talk"><svg viewBox="0 0 20 20"><path d="M4 4h12v9H9l-5 4z"/></svg></button>
      <button id="dismiss" title="Dismiss" aria-label="Dismiss status bubble">×</button>
    </div>
    <div id="preview" hidden></div>
    <form id="followup" hidden><input id="followupText" aria-label="Follow up" placeholder="Follow up…" maxlength="8000" autocomplete="off"><button type="submit" id="sendFollowup" aria-label="Send follow-up">↑</button></form>
    <div class="head" aria-hidden="true"><span class="mark"></span><span class="name">OPENCLAM</span><span class="rule"></span></div>
    <div id="text"></div>
  </section>
  <script>
    const applyBubbleDesign = value => {
      document.documentElement.dataset.design = value === 'atelier' ? 'atelier' : 'quiet';
    };
    applyBubbleDesign(localStorage.getItem('openclam-design'));
    addEventListener('storage', event => {
      if (event.key === 'openclam-design') applyBubbleDesign(event.newValue);
    });
    const text = document.getElementById('text');
    const api=window.openclamBubble;
    let companionExpanded=false;
    const input=document.getElementById('followupText');
    const sizeBubble=()=>{if(document.body.classList.contains('companion'))api?.resize(Math.ceil(document.querySelector('.bubble').getBoundingClientRect().height+24));};
    api?.onState(payload=>{
      document.body.classList.add('companion');document.body.dataset.theme=payload.theme==='light'?'light':'dark';
      document.getElementById('companionHeader').hidden=false;
      document.getElementById('companionTitle').textContent=payload.title||'OpenClam';
      document.getElementById('companionStatus').textContent=payload.activity||(payload.message?.role==='user'?'You said':payload.message?.role==='notice'?'Notice':'Reply');
      const preview=document.getElementById('preview');preview.textContent=payload.message?.text||'';preview.hidden=!preview.textContent;
      document.getElementById('stop').disabled=!payload.canStop;
      document.getElementById('stop').title=payload.live?'End Live Talk':'Stop current activity';
      document.getElementById('followup').hidden=!payload.expanded;
      document.getElementById('expand').setAttribute('aria-expanded',String(Boolean(payload.expanded)));
      input.disabled=!payload.canSend;document.getElementById('sendFollowup').disabled=!payload.canSend;
      input.placeholder=payload.live?'End Live Talk to type':payload.busy?'Waiting for this reply…':'Follow up…';
      if(payload.expanded&&!companionExpanded&&!input.disabled)input.focus();
      companionExpanded=Boolean(payload.expanded);sizeBubble();
    });
    for(const [id,action] of [['expand','expand'],['stop','stop'],['openChat','chat'],['dismiss','dismiss']])
      document.getElementById(id).addEventListener('click',()=>api?.action({action}));
    document.getElementById('followup').addEventListener('submit',async event=>{
      event.preventDefault();const value=input.value.trim();if(!value||input.disabled)return;
      if(await api?.action({action:'followup',text:value}))input.value='';
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape')void api?.action({action:'dismiss'});});
    new ResizeObserver(sizeBubble).observe(document.querySelector('.bubble'));
    /* The same DOM-built markdown renderer as the chat caption in
       index.html: every piece of text lands via textContent, so a reply can
       never inject markup - it can only be markdown. */
    function safeMarkdownHref(value){
      try{
        const url=new URL(value,location.href);
        return ['http:','https:','mailto:'].includes(url.protocol)?url.href:'';
      }catch(e){return'';}
    }
    function appendInlineMarkdown(parent,source){
      const raw=String(source||'');
      const tokens=/(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|~~[^~\n]+~~|\[[^\]\n]+\]\([^)\s]+(?:\s+"[^"]*")?\)|\*[^*\n]+\*|_[^_\n]+_)/g;
      let cursor=0,match;
      while((match=tokens.exec(raw))){
        if(match.index>cursor)parent.append(document.createTextNode(raw.slice(cursor,match.index)));
        const token=match[0];let node=null,inner='';
        if(token.startsWith('`')){
          node=document.createElement('code');node.textContent=token.slice(1,-1);
        }else if(token.startsWith('**')||token.startsWith('__')){
          node=document.createElement('strong');inner=token.slice(2,-2);
        }else if(token.startsWith('~~')){
          node=document.createElement('del');inner=token.slice(2,-2);
        }else if(token.startsWith('[')){
          const parts=token.match(/^\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)$/);
          const href=parts&&safeMarkdownHref(parts[2]);
          if(href){
            node=document.createElement('a');node.href=href;node.target='_blank';
            node.rel='noopener noreferrer';appendInlineMarkdown(node,parts[1]);
          }else{
            parent.append(document.createTextNode(parts?parts[1]:token));
          }
        }else{
          node=document.createElement('em');inner=token.slice(1,-1);
        }
        if(node){
          if(inner)appendInlineMarkdown(node,inner);
          parent.append(node);
        }
        cursor=tokens.lastIndex;
      }
      if(cursor<raw.length)parent.append(document.createTextNode(raw.slice(cursor)));
    }
    function markdownCells(line){
      return line.trim().replace(/^\||\|$/g,'').split('|').map(cell=>cell.trim());
    }
    function isMarkdownTableDivider(line){
      return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    }
    function renderMarkdown(source,target){
      const lines=String(source||'').replace(/\r\n?/g,'\n').split('\n');
      let index=0;
      while(index<lines.length){
        const line=lines[index];
        if(!line.trim()){index++;continue;}
        const fence=line.match(/^\s*```([\w+-]*)\s*$/);
        if(fence){
          const code=[];index++;
          while(index<lines.length&&!/^\s*```\s*$/.test(lines[index]))code.push(lines[index++]);
          if(index<lines.length)index++;
          const pre=document.createElement('pre'),body=document.createElement('code');
          if(fence[1])body.dataset.language=fence[1];
          body.textContent=code.join('\n');pre.append(body);target.append(pre);continue;
        }
        const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
        if(heading){
          const node=document.createElement('h'+heading[1].length);
          appendInlineMarkdown(node,heading[2]);target.append(node);index++;continue;
        }
        if(/^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
          target.append(document.createElement('hr'));index++;continue;
        }
        if(/^\s{0,3}>/.test(line)){
          const quoted=[];
          while(index<lines.length&&/^\s{0,3}>/.test(lines[index]))
            quoted.push(lines[index++].replace(/^\s{0,3}>\s?/,''));
          const quote=document.createElement('blockquote');
          renderMarkdown(quoted.join('\n'),quote);target.append(quote);continue;
        }
        const listItem=line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
        if(listItem){
          const ordered=/^\d/.test(listItem[1]),list=document.createElement(ordered?'ol':'ul');
          while(index<lines.length){
            const item=lines[index].match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
            if(!item||/^\d/.test(item[1])!==ordered)break;
            const child=document.createElement('li');appendInlineMarkdown(child,item[2]);
            list.append(child);index++;
          }
          target.append(list);continue;
        }
        if(index+1<lines.length&&line.includes('|')&&isMarkdownTableDivider(lines[index+1])){
          const table=document.createElement('table'),head=document.createElement('thead');
          const headRow=document.createElement('tr');
          for(const cell of markdownCells(line)){
            const th=document.createElement('th');appendInlineMarkdown(th,cell);headRow.append(th);
          }
          head.append(headRow);table.append(head);index+=2;
          const body=document.createElement('tbody');
          while(index<lines.length&&lines[index].trim()&&lines[index].includes('|')){
            const rowElement=document.createElement('tr');
            for(const cell of markdownCells(lines[index++])){
              const td=document.createElement('td');appendInlineMarkdown(td,cell);rowElement.append(td);
            }
            body.append(rowElement);
          }
          table.append(body);target.append(table);continue;
        }
        const paragraph=[];
        while(index<lines.length&&lines[index].trim()){
          if(paragraph.length&&(/^\s{0,3}(?:```|#{1,6}\s|>|[-+*]\s+|\d+[.)]\s+)/.test(lines[index])||
             /^\s{0,3}(?:-{3,}|\*{3,}|_{3,})\s*$/.test(lines[index])))break;
          paragraph.push(lines[index++].trim());
        }
        const node=document.createElement('p');appendInlineMarkdown(node,paragraph.join(' '));
        target.append(node);
      }
    }
    window.openclamBubble?.onText((payload = {}) => {
      document.body.classList.remove('companion');
      document.getElementById('companionHeader').hidden=true;
      document.getElementById('preview').hidden=true;document.getElementById('followup').hidden=true;
      const value = String(payload.text || '').trim();
      text.textContent = '';
      renderMarkdown(value, text);
      text.scrollTop = 0;
      document.body.classList.toggle('medium', value.length > 130 && value.length <= 260);
      document.body.classList.toggle('long', value.length > 260);
    });
    // Reading pauses the auto-hide; leaving grants a short grace.
    document.addEventListener('mouseenter', () => window.openclamBubble?.hold(true));
    document.addEventListener('mouseleave', () => window.openclamBubble?.hold(false));
  </script>
</body>
</html>
